<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#600011">
<title>Имоти Надежда – недвижими имоти в Шумен, Варна, Бургас и Нови пазар</title>
<meta name="description" content="Имоти Надежда – апартаменти, къщи и парцели за продажба и под наем в Шумен, Варна, Бургас и Нови пазар.">
<link rel="icon" href="/mobile/crm/assets/app-icon3-round-192.png">
<link rel="preload" as="image" href="home-assets/shumen-original-background.webp">
<style>
:root{--wine:#680019;--wine2:#78001e;--gold:#c48b24;--cream:#fff8ef}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#14301f;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{font-family:Georgia,'PT Serif','Times New Roman',serif;color:var(--wine)}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #ffcc49;outline-offset:3px}
/* the page is drawn on an 865 px canvas (the approved reference) and scaled to the screen */
#cv{position:relative;width:865px;min-height:1536px;transform-origin:0 0;overflow:hidden}
.bg{position:absolute;left:0;top:-210px;width:100%;height:calc(100% + 210px);object-fit:cover;object-position:center top}
.abs{position:absolute}
/* header */
.hdr{left:0;top:0;width:865px;height:219px;z-index:4;filter:drop-shadow(0 6px 4px rgba(35,10,8,.45))}
.hdr>img{position:absolute;inset:0;width:100%;height:100%}
.brand{left:28px;top:8px;width:270px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;color:#61031b;text-align:center;white-space:nowrap}
.brand img{width:212px;height:72px;object-fit:contain}
.brand span{font-weight:400;font-size:22px;letter-spacing:.2px;margin-top:4px}
.brand strong{font-size:24px;margin-top:4px}
.nav{left:376px;top:96px;right:30px;height:44px;display:flex;align-items:center;justify-content:space-between;color:#fff8f1;font-weight:400;font-size:22px;white-space:nowrap}
.nav i{display:block;width:1.5px;height:30px;background:#f6ba37}
.nav a{padding:6px 2px}
.nav .me img{width:40px;height:40px;filter:brightness(0) saturate(100%) invert(75%) sepia(96%) saturate(605%) hue-rotate(351deg)}
/* search */
.sp{left:25px;top:720px;width:817px;height:203px;z-index:3;filter:drop-shadow(0 6px 5px rgba(41,12,11,.45))}
.sp>img.shape{position:absolute;inset:0;width:100%;height:100%}
.fs{position:absolute;display:flex;align-items:center;gap:16px;color:#69021c;font-weight:700}
.fs>img{flex:none;width:36px;height:36px;filter:brightness(0) saturate(100%) invert(53%) sepia(84%) saturate(531%) hue-rotate(357deg)}
.fs .t{display:block;min-width:0}
.fs small{display:block;font-size:17px;font-weight:700;margin-bottom:2px}
.fs .v{display:flex;align-items:center;gap:7px;font-size:21px;line-height:1.15;white-space:nowrap}
.fs .v b{font-weight:700}
.fs .v img{width:12px;height:12px;filter:brightness(0) saturate(100%) invert(11%) sepia(75%) saturate(976%) hue-rotate(305deg)}
.fs select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.f-city{left:32px;top:22px;width:220px;height:74px}.f-hood{left:268px;top:22px;width:220px;height:74px}
.f-price{left:32px;top:108px;width:220px;height:78px}.f-area{left:268px;top:108px;width:220px;height:78px}
.sp .div1{left:250px;top:30px;width:1px;height:150px;background:rgba(141,81,40,.22)}
.sp .div2{left:32px;top:102px;width:440px;height:1px;background:rgba(141,81,40,.16)}
.f-type{left:540px;top:22px;width:262px;height:74px;color:#fff}
.f-type small{font-weight:400;font-size:16px}
.f-type>img{filter:brightness(0) saturate(100%) invert(75%) sepia(100%) saturate(600%) hue-rotate(355deg)}
.f-type .v{font-size:22px}.f-type .v img{filter:brightness(0) invert(1)}
.sp .div3{left:500px;top:100px;width:300px;height:1px;background:rgba(232,178,99,.3)}
.adv{left:488px;top:120px;height:60px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:22px}
.adv img{width:32px;height:32px;filter:brightness(0) saturate(100%) invert(82%) sepia(74%) saturate(485%) hue-rotate(352deg)}
.go{left:632px;top:113px;width:160px;height:62px;border-radius:16px;background:linear-gradient(150deg,#fff0aa,#f3a518);color:#640319;box-shadow:inset 0 1px 1px #fff7c7,0 0 16px rgba(255,200,90,.6),0 4px 8px rgba(60,10,5,.35);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:24px}
.go img{width:30px;height:30px;filter:brightness(0) saturate(100%) invert(13%) sepia(50%) saturate(1113%) hue-rotate(309deg)}
.advp{left:470px;top:196px;width:330px;padding:16px 18px;border-radius:18px;background:linear-gradient(180deg,#fffaf3,#fdf0e3);border:2px solid #e2a33b;box-shadow:0 10px 24px rgba(40,10,5,.4);z-index:6;color:#69021c}
.advp[hidden]{display:none}
.advp label{display:block;font-size:17px;font-weight:700;margin:8px 0 5px}
.advp select{width:100%;height:46px;border-radius:12px;border:1.5px solid #e2a33b;background:#fff;padding:0 12px;font-size:19px;color:#4e0912}
/* city cards */
.city{z-index:2;border:2px solid #e2a33b;background:#fff7ed;border-radius:30px;box-shadow:0 8px 17px rgba(32,13,8,.4),0 0 14px rgba(255,214,150,.35);overflow:hidden;text-align:left;color:#6c001b}
.city .ph{position:absolute;left:0;right:0;top:0;height:78%;width:100%;object-fit:cover;object-position:center}
.city .fade{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(to bottom,rgba(255,248,238,0) 0%,rgba(255,248,238,.8) 38%,#fff8ed 68%,#fff8ed 100%)}
.city .ct{position:absolute;left:30px;right:22px;bottom:24px;display:flex;align-items:flex-end;justify-content:space-between}
.city .nm{display:flex;align-items:center;gap:10px;font-size:33px;font-weight:700;white-space:nowrap}
.city .nm img{width:30px;height:30px;filter:brightness(0) saturate(100%) invert(48%) sepia(95%) saturate(598%) hue-rotate(352deg)}
.city .vc{display:block;margin-top:4px;color:#ae760f;font-weight:700;font-size:25px;letter-spacing:.3px}
.city .ar{width:60px;height:60px;border-radius:50%;border:2px solid #ba8318;background:#fffdfa;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 10px rgba(255,210,120,.5)}
.city .ar img{width:28px;height:28px;filter:brightness(0) saturate(100%) invert(47%) sepia(70%) saturate(622%) hue-rotate(356deg)}
.c1{left:28px;top:931px;width:399px;height:262px}.c2{left:437px;top:931px;width:402px;height:262px}
.c3{left:28px;top:1202px;width:399px;height:262px}.c4{left:437px;top:1202px;width:402px;height:262px}
.city:active{transform:scale(.985)}
/* results sheet (real published listings) */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:rgba(30,4,10,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet[hidden]{display:none}
.sh-in{margin-top:auto;max-height:86vh;display:flex;flex-direction:column;border-radius:24px 24px 0 0;background:linear-gradient(180deg,#fffaf3,#fbeee0);border-top:2px solid #e2a33b;box-shadow:0 -10px 30px rgba(30,4,10,.45);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;align-items:center;gap:10px;padding:4px 4px 10px}
.sh-h h2{flex:1;font-size:19px;color:#600011}
.sh-h small{display:block;font:400 13px/1.3 Georgia,serif;color:#7a5a4a;margin-top:2px}
.sh-x{width:38px;height:38px;border-radius:50%;border:1.5px solid #e2a33b;background:#fff;color:#600011;font-size:20px;line-height:1}
.sh-list{overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;gap:12px;padding:2px}
.pc{display:flex;gap:12px;align-items:stretch;border-radius:18px;background:#fffdf9;border:1.5px solid rgba(226,163,59,.7);box-shadow:0 4px 10px rgba(60,20,10,.15);overflow:hidden;color:#4e0912}
.pc img{width:120px;min-height:96px;object-fit:cover;flex:none;background:#f1e2d2}
.pc .tx{padding:10px 10px 10px 0;min-width:0;display:flex;flex-direction:column;justify-content:center}
.pc b{font-size:16px;line-height:1.2}
.pc span{font:400 13px/1.35 Georgia,serif;color:#6b4a40;margin-top:3px}
.pc em{font-style:normal;font-weight:700;font-size:17px;color:#8d1530;margin-top:5px}
.empty{padding:22px 14px;text-align:center;font-size:15px;line-height:1.45;color:#6b4a40}
.empty a{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:14px;background:linear-gradient(150deg,#fff0aa,#f3a518);color:#640319;font-weight:700}
</style>
</head>
<body>
<div id="cv">
  <img class="bg" src="home-assets/shumen-original-background.webp" alt="Шумен – паметникът „Създатели на българската държава“ и панорама на града">

  <header class="abs hdr">
    <img src="home-assets/header-shape.svg" alt="">
    <a class="abs brand" href="/mobile/home.html" aria-label="Имоти Надежда – начало"><img src="home-assets/logo-roofs.svg" alt=""><span>НЕДВИЖИМИ ИМОТИ</span><strong>• ИМОТИ НАДЕЖДА •</strong></a>
    <nav class="abs nav" aria-label="Основна навигация">
      <a href="#" data-deal="sale">За продажба</a><i></i>
      <a href="#" data-deal="rent">Под наем</a><i></i>
      <a href="#" id="about">За нас</a><i></i>
      <a class="me" href="/mobile/crm/crm-nachalo.html" aria-label="Вход за брокери"><img src="home-assets/user.svg" alt=""></a>

  <form class="abs sp" id="sp" aria-label="Търсене на имот">
    <img class="shape" src="home-assets/search-shape.svg" alt="">
    <span class="abs div1"></span><span class="abs div2"></span><span class="abs div3"></span>
    <label class="fs f-city"><img src="home-assets/pin.svg" alt=""><span class="t"><small>Град</small><span class="v"><b id="v-city"></b><img src="home-assets/chevron-down.svg" alt=""></span></span><select id="s-city" aria-label="Град"></select></label>
    <label class="fs f-hood"><img src="home-assets/house.svg" alt=""><span class="t"><small>Квартал</small><span class="v"><b id="v-hood"></b><img src="home-assets/chevron-down.svg" alt=""></span></span><select id="s-hood" aria-label="Квартал"></select></label>
    <label class="fs f-price"><img src="home-assets/tag.svg" alt=""><span class="t"><small>Цена</small><span class="v" id="v-price"></span></span><select id="s-price" aria-label="Цена"></select></label>
    <label class="fs f-area"><img src="home-assets/area.svg" alt=""><span class="t"><small>Площ</small><span class="v" id="v-area"></span></span><select id="s-area" aria-label="Площ"></select></label>
    <label class="fs f-type"><img src="home-assets/briefcase.svg" alt=""><span class="t"><small>Вид имот</small><span class="v"><b id="v-type"></b><img src="home-assets/chevron-down.svg" alt=""></span></span><select id="s-type" aria-label="Вид имот"></select></label>
    <button type="button" class="abs adv" id="adv" aria-expanded="false"><img src="home-assets/sliders.svg" alt="">Филтри</button>
    <button type="submit" class="abs go"><img src="home-assets/search.svg" alt="">Търси</button>
    <div class="abs advp" id="advp" hidden>
      <label for="s-deal">Сделка</label><select id="s-deal"><option value="">Продажба и наем</option><option value="sale">Продажба</option><option value="rent">Под наем</option></select>
      <label for="s-rooms">Стаи</label><select id="s-rooms"><option value="">Без значение</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select>
    </div>
  </form>

  <button class="abs city c1" data-city="shumen"><img class="ph" src="home-assets/city-shumen.webp" alt=""><span class="fade"></span><span class="ct"><span><span class="nm"><img src="home-assets/pin.svg" alt="">Шумен</span><span class="vc">ВИЖ ГРАДА</span></span><span class="ar"><img src="home-assets/arrow-right.svg" alt=""></span></span></button>
  <button class="abs city c2" data-city="varna"><img class="ph" src="home-assets/city-varna.webp" alt=""><span class="fade"></span><span class="ct"><span><span class="nm"><img src="home-assets/pin.svg" alt="">Варна</span><span class="vc">ВИЖ ГРАДА</span></span><span class="ar"><img src="home-assets/arrow-right.svg" alt=""></span></span></button>
  <button class="abs city c3" data-city="burgas"><img class="ph" src="home-assets/city-burgas.webp" alt=""><span class="fade"></span><span class="ct"><span><span class="nm"><img src="home-assets/pin.svg" alt="">Бургас</span><span class="vc">ВИЖ ГРАДА</span></span><span class="ar"><img src="home-assets/arrow-right.svg" alt=""></span></span></button>
  <button class="abs city c4" data-city="novi-pazar"><img class="ph" src="home-assets/city-novi-pazar.webp" alt=""><span class="fade"></span><span class="ct"><span><span class="nm"><img src="home-assets/pin.svg" alt="">Нов пазар</span><span class="vc">ВИЖ ГРАДА</span></span><span class="ar"><img src="home-assets/arrow-right.svg" alt=""></span></span></button>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="sh-in"><div class="sh-h"><h2 id="sh-t">Резултати<small id="sh-s"></small></h2><button class="sh-x" id="sh-x" aria-label="Затвори">×</button></div><div class="sh-list" id="sh-list"></div></div>
</div>

<script src="/mobile/places.js"></script>
<script src="/mobile/site-data.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var cv = $("cv"), W = 865, H = 1536;
  function fit() {
    var k = document.documentElement.clientWidth / W;
    cv.style.zoom = k;
    cv.style.minHeight = Math.max(H, innerHeight / k) + "px";
  }
  addEventListener("resize", fit); fit();

  var CITIES = { "Шумен": "shumen", "Варна": "varna", "Бургас": "burgas", "Нов пазар": "novi-pazar" };
  var HOODS = window.NDPlaces ? { "Бургас": NDPlaces.PLACES["Бургас"], "Шумен": NDPlaces.PLACES["Шумен"], "Варна": NDPlaces.PLACES["Варна"], "Нов пазар": NDPlaces.PLACES["Нови пазар"] } : {
    "Бургас": ["Лазур", "Славейков", "Изгрев", "Възраждане", "Център", "Братя Миладинови", "Зорница", "Меден рудник", "Сарафово", "Крайморие", "Победа"],
    "Шумен": ["Център", "Тракия", "Боян Българанов 1", "Боян Българанов 2", "Добруджански", "Еверест", "Гривица", "Пети полк", "Дивдядово"],
    "Варна": ["Център", "Чайка", "Левски", "Бриз", "Възраждане", "Трошево", "Аспарухово", "Галата", "Владислав Варненчик", "Изгрев"],
    "Нов пазар": ["Център", "Изток", "Запад", "Север", "Юг"]
  };
  var PRICES = [["", "Без значение"], ["0-100000", "до 100 000 €"], ["100000-200000", "от 100 000 €|до 200 000 €"], ["200000-500000", "от 200 000 €|до 500 000 €"], ["500000-", "от 500 000 €"]];
  var AREAS = [["", "Без значение"], ["0-60", "до 60 м²"], ["60-100", "от 60 м²|до 100 м²"], ["100-200", "от 100 м²|до 200 м²"], ["200-", "от 200 м²"]];
  var TYPES = ["Всички", "Апартамент", "Къща", "Парцел", "Офис", "Магазин"];
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function fill(sel, opts, val) { sel.innerHTML = opts.map(function (o) { var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(v) + '"' + (v === val ? " selected" : "") + ">" + esc(t.replace("|", " ")) + "</option>"; }).join(""); }
  var chev = '<img src="home-assets/chevron-down.svg" alt="">';
  function show() {
    $("v-city").textContent = $("s-city").value; $("v-hood").textContent = $("s-hood").value || "Всички"; $("v-type").textContent = $("s-type").value;
    [["s-price", "v-price", PRICES], ["s-area", "v-area", AREAS]].forEach(function (x) {
      var t = (x[2].filter(function (o) { return o[0] === $(x[0]).value; })[0] || x[2][0])[1].split("|");
      $(x[1]).innerHTML = "<span><b>" + esc(t[0]) + "</b>" + chev + (t[1] ? "<br><b>" + esc(t[1]) + "</b>" : "") + "</span>";
    });
  }
  fill($("s-city"), Object.keys(CITIES), "Бургас");
  function hoods() { fill($("s-hood"), [["", "Всички"]].concat(HOODS[$("s-city").value]), $("s-city").value === "Бургас" ? "Лазур" : ""); }
  hoods();
  fill($("s-price"), PRICES, "200000-500000"); fill($("s-area"), AREAS, "100-200"); fill($("s-type"), TYPES, "Апартамент");
  $("s-city").onchange = function () { hoods(); show(); };
  ["s-hood", "s-price", "s-area", "s-type"].forEach(function (id) { $(id).onchange = show; });
  show();
  $("adv").onclick = function () { var p = $("advp"); p.hidden = !p.hidden; this.setAttribute("aria-expanded", !p.hidden); };

  /* real search over the published listings from the CRM */
  function range(v) { if (!v) return null; var p = v.split("-"); return [Number(p[0]) || 0, p[1] ? Number(p[1]) : Infinity]; }
  function search(o) {
    o = o || {};
    var city = o.city || $("s-city").value, hood = o.all ? "" : $("s-hood").value, type = o.all ? "Всички" : $("s-type").value;
    var pr = o.all ? null : range($("s-price").value), ar = o.all ? null : range($("s-area").value), deal = o.deal || (o.all ? "" : $("s-deal").value), rooms = o.all ? 0 : Number($("s-rooms").value || 0);
    $("sh-list").innerHTML = '<div class="empty">Зареждане…</div>'; $("sheet").hidden = false;
    $("sh-t").firstChild.nodeValue = (deal === "rent" ? "Под наем" : deal === "sale" ? "За продажба" : "Имоти") + " – " + city;
    $("sh-s").textContent = [hood, type !== "Всички" ? type : "", pr ? $("s-price").options[$("s-price").selectedIndex].text : "", ar ? $("s-area").options[$("s-area").selectedIndex].text : ""].filter(Boolean).join(" · ");
    (window.__ND_READY || Promise.resolve()).then(function () {
      var list = (window.__ND_LISTINGS || []).filter(function (p) {
        if ((window.NDPlaces ? NDPlaces.city(p.city) : p.city) !== (window.NDPlaces ? NDPlaces.city(city) : city)) return false;
        if (hood && p.hood && p.hood !== hood) return false;
        if (type !== "Всички" && p.type && p.type !== type) return false;
        if (deal && p.deal !== deal) return false;
        if (pr && (p.price < pr[0] || p.price > pr[1])) return false;
        if (ar && p.area && (p.area < ar[0] || p.area > ar[1])) return false;
        if (rooms && p.rooms && p.rooms < rooms) return false;
        return true;
      });
      var slug = CITIES[city] || "burgas";
      $("sh-list").innerHTML = list.length ? list.map(function (p) {
        return '<a class="pc" href="/mobile/ilj.html#/property/' + encodeURIComponent(p.id) + "/" + slug + '"><img src="' + esc(p.img || "home-assets/city-" + slug + ".webp") + '" alt="" loading="lazy"><span class="tx"><b>' + esc(p.title) + "</b><span>" +
          esc([p.city, p.hood].filter(Boolean).join(", ")) + (p.area ? " · " + p.area + " м²" : "") + (p.rooms ? " · " + p.rooms + " стаи" : "") + "</span><em>" + new Intl.NumberFormat("bg-BG").format(p.price) + " €" + (p.deal === "rent" ? " / мес." : "") + "</em></span></a>";
      }).join("") : '<div class="empty">Няма публикувани имоти по тези критерии.<br>Опитайте с по-широко търсене или вижте целия град.<br><a href="/mobile/ilj.html#/city/' + slug + '">Виж ' + esc(city) + "</a></div>";
    });
  }
  $("about").onclick = function (e) {
    e.preventDefault(); $("sheet").hidden = false; $("sh-t").firstChild.nodeValue = "Имоти Надежда"; $("sh-s").textContent = "Недвижими имоти · Шумен · Варна · Бургас · Нови пазар";
    $("sh-list").innerHTML = '<div class="empty" style="text-align:left">Вашият надежден партньор в недвижимите имоти. Помагаме Ви да купите, продадете или наемете имот – с лично отношение, познаване на местния пазар и внимание към всеки детайл, от първия оглед до финализирането на сделката.<br><a href="/mobile/ilj.html#/city/shumen">Разгледай имотите</a></div>';
  };
  $("sp").onsubmit = function (e) { e.preventDefault(); $("advp").hidden = true; search(); };
  $("sh-x").onclick = function () { $("sheet").hidden = true; };
  $("sheet").onclick = function (e) { if (e.target === this) this.hidden = true; };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { $("sheet").hidden = true; $("advp").hidden = true; } });
  [].forEach.call(document.querySelectorAll("[data-deal]"), function (a) { a.onclick = function (e) { e.preventDefault(); search({ deal: a.getAttribute("data-deal"), all: true }); }; });
  [].forEach.call(document.querySelectorAll(".city"), function (b) { b.onclick = function () { location.href = "/mobile/ilj.html#/city/" + b.getAttribute("data-city"); }; });
})();
</script>
<script src="/mobile/ash.js" defer></script>
</body>
