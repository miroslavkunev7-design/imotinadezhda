  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 20%,#000 42%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 20%,#000 42%)}
.ccard .nm{position:absolute;left:27px;top:10px;right:12px;font:700 31px/1.1 var(--serif);color:#5e0a1a;white-space:nowrap;text-shadow:0 1px 0 #fff}
.ccard .ph-n{position:absolute;left:25px;top:50px;display:flex;align-items:center;gap:13px;font:700 27.5px/1 var(--sans);color:#6b0a1c;letter-spacing:.2px}
.ccard .ph-n svg.i{font-size:29px;stroke-width:2}
.ccard .row{position:absolute;left:27px;display:flex;align-items:center;gap:20px;font:400 22.5px/1 var(--sans);color:#1f1111;white-space:nowrap}
.ccard .row svg.i{font-size:24px;color:#7b1020;stroke-width:2}
.ccard .go{position:absolute;right:16px;bottom:var(--gob,12px);width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#4a0a10;font-size:32px;
  background:radial-gradient(circle at 35% 28%,#fffbe8 0%,#f7dfa0 35%,#d9a650 75%,#b98235 100%);box-shadow:0 3px 7px rgba(0,0,0,.4),0 0 0 1px #fff2c4 inset,0 0 10px rgba(255,220,150,.6)}
.ccard .go svg.i{stroke-width:2.6}
.cgrid .empty{grid-column:1/-1;padding:28px;border-radius:22px;text-align:center;font:400 23px/1.4 var(--sans);color:#5a0a12;
  background:rgba(255,248,242,.85);box-shadow:0 0 0 1px rgba(231,196,160,.6)}
.cgrid .empty button{margin-top:12px;padding:10px 22px;border-radius:20px;font:700 21px/1 var(--sans);color:#fff;background:linear-gradient(180deg,#a3213a,#6a0a1d);box-shadow:0 0 0 1px #e6b866}

/* ================= CLIENT CARD WINDOW ================= */
.mback{position:fixed;inset:0;z-index:40;background:rgba(40,5,12,.45);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;transition:opacity .25s}
.mback.show{opacity:1}
.mwin{position:fixed;z-index:41;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(var(--dockH,60px) + 10px);
  border-radius:26px;overflow:hidden;background:#f3d2b5;border:2px solid #efc57a;
  box-shadow:0 0 0 1px rgba(255,235,190,.6),0 0 22px rgba(255,200,120,.55),0 20px 50px rgba(30,0,8,.55);
  transform:translateY(14px) scale(.98);opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s,left .25s,right .25s,top .25s,bottom .25s,border-radius .25s}
.mwin.show{transform:none;opacity:1}
.mwin.full{left:0;right:0;top:0;bottom:var(--dockH,60px);border-radius:0;border-width:0}
.mscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:radial-gradient(120% 60% at 50% 55%,#f6d3b6 0%,#efc19c 55%,#e2a882 100%)}
.mcv{position:relative;width:1024px;padding:392px 0 34px}
.mtop{height:385px}
.mctl{position:absolute;right:12px;top:12px;display:flex;gap:10px;z-index:5}
.mbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;color:#5a0a12;
  background:radial-gradient(circle at 35% 28%,#fffdf6 0%,#f7e3b3 45%,#d9a650 100%);box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 0 1px #fff2c4 inset,0 0 10px rgba(255,214,140,.55)}
.mbtn svg.i{stroke-width:2.6}
.nb b{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#ee1c25;color:#fff;font:700 14px/22px var(--sans);text-align:center;filter:none}
.nb:after{display:none}
.m-name{left:66px;top:208px;font:700 64px/1.05 var(--serif);white-space:nowrap;
  background:linear-gradient(180deg,#fff4d4 0%,#f6d99b 38%,#d9a254 62%,#f7dca2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 3px rgba(40,0,8,.75))}
.m-phone{left:45px;top:293px;height:76px;padding:0 44px 0 32px;border-radius:38px;display:flex;align-items:center;gap:30px;text-decoration:none;color:#fff;
  background:linear-gradient(180deg,#a3213a 0%,#7a0f22 40%,#55071a 100%);border:3px solid #edc47a;
  box-shadow:0 0 0 1px rgba(255,236,190,.6),0 0 16px rgba(255,200,120,.6),inset 0 2px 3px rgba(255,170,180,.5),0 6px 12px rgba(30,0,8,.4)}
.m-phone svg.i{font-size:44px;color:#fff2e0;stroke-width:1.6}
.m-phone span{font:700 48px/1 var(--cond);letter-spacing:1.5px;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.m-actions{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:0 20px 0 24px}
.ma{height:92px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(180deg,#fffcf9 0%,#fbefe5 100%);box-shadow:0 3px 8px rgba(140,70,40,.3),0 0 0 1px rgba(231,196,160,.6),0 0 10px rgba(255,230,200,.8),inset 0 -2px 3px rgba(230,190,160,.35);
  font:700 22px/1 var(--cond);color:#3b0a0e}
.ma svg.i{font-size:42px;color:#7d1222;stroke-width:1.9}
.mpanel{position:relative;margin:20px 12px 0;border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,247,240,.96) 0%,rgba(252,236,222,.95) 100%);border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px rgba(226,176,120,.35),0 0 20px rgba(255,236,214,.95),0 10px 22px rgba(120,50,20,.22),inset 0 1px 0 #fff}
.mribbon{position:absolute;left:-1px;top:-1px;width:702px;height:64px;pointer-events:none}
.mtitle{position:relative;height:64px;display:flex;align-items:center;gap:26px;padding-left:40px;color:#fff;font:400 38px/1 var(--serif);text-shadow:0 2px 3px rgba(40,0,8,.55)}
.mtitle svg.i{font-size:42px;color:#fff0dc;stroke-width:1.7}
.mall{position:absolute;right:36px;top:16px;display:flex;align-items:center;gap:8px;font:700 27px/1 var(--cond);color:#5a0a12}
.mall svg.i{font-size:28px;stroke-width:2.6}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 13px;padding:14px 16px 18px}
.fcell{position:relative;height:var(--fh,104px);border-radius:22px;overflow:hidden;text-align:left;
  background:linear-gradient(180deg,#fffbf7 0%,#fbeee3 100%);border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px rgba(226,176,120,.55),0 0 12px rgba(255,226,190,.9),0 5px 12px rgba(120,50,20,.2)}
.fcell .fp{position:absolute;right:6px;top:6px;bottom:6px;width:44%;border-radius:0 16px 16px 0;background-size:cover;background-position:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 22%,#000 48%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.55) 22%,#000 48%)}
.fcell .fi{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:56px;color:#7b1020}
.fcell .fi svg.i{stroke-width:1.9}
.fcell .fl{position:absolute;left:92px;top:22px;font:700 29px/1 var(--cond);color:#6b0a1c}
.fcell .fv{position:absolute;left:92px;top:58px;right:14px;font:400 28px/1.05 var(--cond);color:#1f1111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcell .pill{display:inline-flex;align-items:center;gap:12px;height:40px;padding:0 20px;border-radius:20px;background:linear-gradient(180deg,#e4f5cb,#cfe9ad);
  color:#1e4d12;font:700 27px/1 var(--cond);box-shadow:inset 0 0 0 1px rgba(120,170,80,.45);margin-top:-6px}
.fcell .pill i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7de86a,#1e9c1a 70%)}
.fcell .pill.warn{background:linear-gradient(180deg,#fff1cc,#f7dc9a);color:#6a4300;box-shadow:inset 0 0 0 1px rgba(200,150,60,.45)}
.fcell .pill.warn i{background:radial-gradient(circle at 35% 30%,#ffd36a,#d18a12 70%)}
.alist{margin:10px 18px 22px;border-radius:22px;padding:4px 24px;background:linear-gradient(180deg,rgba(255,252,249,.97),rgba(252,240,231,.95));
  box-shadow:0 2px 6px rgba(140,70,40,.18),0 0 0 1px rgba(231,196,160,.5)}
.arow{display:flex;align-items:center;height:55px;gap:30px;font:400 22.5px/1 var(--cond);color:#1f1111}
.arow+.arow{border-top:1.5px solid rgba(120,60,50,.28)}
.arow svg.i{font-size:36px;color:#7b1020;stroke-width:1.8;margin-left:8px}
.arow .at{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .tm{white-space:nowrap}
html.locked,html.locked body{overflow:hidden}
@media (prefers-reduced-motion:reduce){.mwin,.mback{transition:none}}
#dock{z-index:50}

/* ================= DESKTOP (same file, same sections, same order) ================= */
html.desk,html.desk body{height:100%;overflow:hidden}
html.desk #stage{height:100vh;padding-bottom:0!important;overflow:hidden}
html.desk .status,html.desk .home-ind,html.desk .dock-bg{display:none}
html.desk .ctop{width:100%}
html.desk .flow{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;grid-template-columns:1000px 1000px;column-gap:var(--G,24px);padding:16px 0 0 var(--xL,24px)}
html.desk .cpanel{margin:0!important;width:1000px}
html.desk .cgrid{padding:15px 8px 4px;height:var(--gh,420px);overflow-y:auto;align-content:start;scrollbar-width:thin;scrollbar-color:#c99a5a transparent}
html:not(.desk) .mbtn{width:32px;height:32px;font-size:17px}
html.desk .mscroll{overflow:hidden}
html.desk .mwin,html.desk .mwin.full{right:auto;bottom:auto;border-radius:26px;border-width:2px}
html.desk .mcv{width:2048px;height:866px;padding:0}
html.desk .mtop{left:12px;top:12px;width:1000px;height:730px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 2px #efc57a,0 0 18px rgba(255,200,120,.45)}
html.desk .mtop .photo{left:-250px!important;top:0!important;width:1300px!important}
html.desk .mtop .shade{background:linear-gradient(0deg,rgba(60,8,20,.9) 0%,rgba(60,8,20,0) 42%),linear-gradient(90deg,rgba(64,10,22,.75) 0%,rgba(64,10,22,0) 55%)}
html.desk .m-name{top:540px}
html.desk .m-phone{top:626px}
html.desk .m-actions{position:absolute;left:12px;top:762px;width:1000px;padding:0}
html.desk .m-data{position:absolute;left:1036px;top:12px;width:1000px;margin:0}
html.desk .m-act{position:absolute;left:1036px;top:585px;width:1000px;margin:0}
@media (hover:hover){button:hover{filter:brightness(1.06)}.ccard:hover,.ma:hover,.fcell:hover{transform:translateY(-2px);transition:transform .18s}}

/* ================= SMOOTH PAGE-TO-PAGE TRANSITION (shared by all CRM pages) ================= */
@view-transition{navigation:auto}
body{background:#efc19c}
#dock{view-transition-name:crm-dock}
::view-transition-old(root){animation:crmOut .22s ease both}
::view-transition-new(root){animation:crmIn .36s cubic-bezier(.2,.7,.2,1) both}
::view-transition-group(crm-dock){animation-duration:.3s}
@keyframes crmOut{to{opacity:0}}
@keyframes crmIn{from{opacity:0;transform:translateY(10px)}}
html.no-vt #stage{animation:crmIn .34s cubic-bezier(.2,.7,.2,1) both}
html.leaving #stage{opacity:0;transform:translateY(-6px);transition:opacity .17s ease,transform .17s ease}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root),html.no-vt #stage{animation:none}html.leaving #stage{transition:none}}

  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('.nv[data-href]');if(!b)return;e.preventDefault();e.stopPropagation();window.goTo(b.getAttribute('data-href'))},true);

  });
})();

  clients.forEach(function(c,i){
    c.contact=d(c.days)+' г.';c.order=i;
    if(!c.acts)c.acts=[['phone','Телефонен разговор – уточнени изисквания',c.days?d(c.days)+', 10:15':'днес, 09:15'],
      ['file-text',(c.cat==='rent'?'Изпратени 2 оферти за наем':'Изпратени 2 предложения'),d(c.days+1)+', 15:20'],
      ['calendar-check','Уговорен оглед – '+c.type.toLowerCase()+', '+c.hood,d(Math.max(c.days-1,0))+', 11:00']];
  });
  var money=function(n){return new Intl.NumberFormat('fr-FR').format(n).replace(/ | /g,' ')};
  var budget=function(c){return 'до '+money(c.budget)+' €'+(c.cat==='rent'?' / мес.':'')};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})};
  var img=function(n){return (window.IMG&&window.IMG[n])||('assets/'+n)};
  var ic=function(n){return '<svg class="i"><use href="#'+n+'"/></svg>'};

  /* ---------- layout scaling ---------- */
  var ctop=document.querySelector('.ctop'),cphoto=ctop.querySelector('.photo'),cctrls=[].slice.call(ctop.querySelectorAll('.ctrl,.avatar')),
      ctexts=[].slice.call(ctop.querySelectorAll('.hero-title,.hero-sub')).map(function(el){return {el:el,top:parseFloat(el.style.top)}});
  var desk=false;
  function isDesk(){return root.clientWidth>=1024&&root.clientWidth/innerHeight>=1.2}
  function fitDesk(){
    var vw=root.clientWidth,vh=innerHeight,BW=2072,BH=1190;
    var k=Math.min(vw/BW,vh/BH),Wc=vw/k,Hc=vh/k,exH=Hc-BH,exW=Wc-BW;
    var Hh=395+Math.min(exH*.5,160),G=24+Math.min(exW*.15,80),xL=(Wc-2000-G)/2;
    canvas.style.zoom=k;canvas.style.marginLeft='0px';canvas.style.width=Wc+'px';canvas.style.height=Hc+'px';canvas.style.paddingTop=Hh+'px';
    ctop.style.height=Hh+'px';
    ctexts.forEach(function(o){o.el.style.top=(o.top+(Hh-395)*.75)+'px'});
    var ph=Hh*1.55,pw=ph*1.777;cphoto.style.width=pw+'px';cphoto.style.left=(Wc-pw+20)+'px';cphoto.style.top=(30-.16*ph)+'px';
    cctrls.forEach(function(el){if(el.dataset.l==null)el.dataset.l=parseFloat(getComputedStyle(el).left);el.style.left=(Wc-1024+(+el.dataset.l))+'px'});
    root.style.setProperty('--G',G+'px');root.style.setProperty('--xL',xL+'px');
    root.style.setProperty('--gh',(Hc-Hh-16-197-162)+'px');
    dockC.style.transform='scale('+k+')';dockC.style.left=((vw-1024*k)/2)+'px';
    dock.style.height=(DOCK*k)+'px';root.style.setProperty('--dockH',(118*k)+'px');
    fitModal();
  }
  function clearDesk(){
    canvas.style.width=canvas.style.height=canvas.style.paddingTop='';ctop.style.height='';
    ctexts.forEach(function(o){o.el.style.top=o.top+'px'});
    cphoto.style.width=cphoto.style.left=cphoto.style.top='';cctrls.forEach(function(el){el.style.left=''});
  }
  function fit(){
    desk=isDesk();root.classList.toggle('desk',desk);
    if(desk){fitDesk();return}
    clearDesk();
    var vw=root.clientWidth,k=vw/W,off=(root.clientWidth-vw)/2;
    canvas.style.zoom=k;canvas.style.marginLeft=(off/k)+'px';
    dockC.style.transform='scale('+k+')';dockC.style.left=off+'px';
    dock.style.height=(DOCK*k)+'px';
    stage.style.paddingBottom=(DOCK*k)+'px';
    root.style.setProperty('--dockH',(118*k)+'px');
    fitModal();
  }
  var ctlBox=document.querySelector('.mctl');var ctlBase=0;
  mscroll.addEventListener('scroll',function(){if(!desk)ctlBox.style.top=Math.max(8,ctlBase-mscroll.scrollTop)+'px'},{passive:true});
  function fitModal(){
    if(win.hidden)return;
    if(desk){
      var vw=root.clientWidth,dh=parseFloat(getComputedStyle(root).getPropertyValue('--dockH'))||100,ah=innerHeight-dh-14;
      var aw=full?vw-16:vw*.94,av=full?ah-8:ah*.94,z=Math.min(aw/2048,av/866),w=2048*z,h=866*z;
      win.style.width=w+'px';win.style.height=h+'px';win.style.left=((vw-w)/2)+'px';win.style.top=Math.max(6,(ah-h)/2)+'px';
      mcv.style.zoom=z;
      ctlBox.style.top='';
    }else{win.style.width=win.style.height=win.style.left=win.style.top='';var zz=win.clientWidth/W;mcv.style.zoom=zz;ctlBase=331*zz-16;ctlBox.style.top=Math.max(8,ctlBase-mscroll.scrollTop)+'px'}
  }
  addEventListener('resize',fit);addEventListener('orientationchange',fit);

  /* ---------- lists with independent filters ---------- */
  var geo={sales:{h:196,name:10,phone:50,rows:[96,129,162],gob:8},rent:{h:170,name:8,phone:44,rows:[82,111,140],gob:11}};
  var ALLC='Всички',ALLH='Всички',ALLT='Всички имоти';
  var sorts=[['new','Най-нови'],['name','Име (А–Я)'],['asc','Бюджет: възходящо'],['desc','Бюджет: низходящо']];
  function fillSelect(sel,opts,val){sel.innerHTML=opts.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(v===val?' selected':'')+'>'+esc(t)+'</option>'}).join('')}
  function showVal(sel){var l=sel.closest('.fld');l.querySelector('.val').textContent=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:''}
  function setup(cat){
    var mine=clients.filter(function(c){return c.cat===cat});
    var q=document.getElementById('q-'+cat),city=document.getElementById('city-'+cat),hood=document.getElementById('hood-'+cat),
        type=document.getElementById('type-'+cat),sort=document.getElementById('sort-'+cat),grid=document.getElementById('grid-'+cat);
    var uniq=function(a){return a.filter(function(v,i){return a.indexOf(v)===i})};
    fillSelect(city,[ALLC].concat(uniq(mine.map(function(c){return c.city}))),ALLC);
    function hoods(){var cs=city.value;fillSelect(hood,[ALLH].concat(uniq(mine.filter(function(c){return cs===ALLC||c.city===cs}).map(function(c){return c.hood}))),ALLH);showVal(hood)}
    hoods();
    fillSelect(type,[ALLT,'Апартамент','Къща'],ALLT);fillSelect(sort,sorts,'new');
    [city,hood,type,sort].forEach(showVal);
    function render(){
      var s=q.value.trim().toLocaleLowerCase('bg'),digits=s.replace(/\D/g,'');
      var list=mine.filter(function(c){
        if(city.value!==ALLC&&c.city!==city.value)return false;
        if(hood.value!==ALLH&&c.hood!==hood.value)return false;
        if(type.value!==ALLT&&c.type!==type.value)return false;
        if(s&&c.name.toLocaleLowerCase('bg').indexOf(s)<0&&!(digits&&c.phone.replace(/\D/g,'').indexOf(digits)>=0))return false;
        return true});
      list.sort(function(a,b){return sort.value==='name'?a.name.localeCompare(b.name,'bg'):sort.value==='asc'?a.budget-b.budget:sort.value==='desc'?b.budget-a.budget:a.days-b.days||a.order-b.order});
      var g=geo[cat];
      grid.innerHTML=list.length?list.map(function(c){
        return '<button class="ccard" data-id="'+c.id+'" style="--h:'+g.h+'px;--gob:'+g.gob+'px" aria-label="Отвори картата на '+esc(c.name)+'">'+
          '<span class="ph" style="background-image:url('+img('card-'+c.id+'.jpg')+')"></span>'+
          '<span class="nm" style="top:'+g.name+'px">'+esc(c.name)+'</span>'+
          '<span class="ph-n" style="top:'+g.phone+'px">'+ic('phone')+esc(c.phone)+'</span>'+
          '<span class="row" style="top:'+g.rows[0]+'px">'+ic('house')+esc(c.type)+'</span>'+
          '<span class="row" style="top:'+g.rows[1]+'px">'+ic('pin')+esc(c.city+', '+c.hood)+'</span>'+
          '<span class="row" style="top:'+g.rows[2]+'px">'+ic('coins')+esc(budget(c))+'</span>'+
          '<span class="go">'+ic('arrow-r')+'</span></button>'}).join('')
        :'<div class="empty">Няма клиенти по избраните критерии.<br><button type="button" data-reset>Изчисти филтрите</button></div>';
      var r=grid.querySelector('[data-reset]');
      if(r)r.addEventListener('click',function(){q.value='';city.value=ALLC;hoods();type.value=ALLT;sort.value='new';[city,type,sort].forEach(showVal);render()});
    }
    q.addEventListener('input',render);
    city.addEventListener('change',function(){showVal(city);hoods();render()});   /* changing the city clears the district */
    [hood,type,sort].forEach(function(s){s.addEventListener('change',function(){showVal(s);render()})});
    grid.addEventListener('click',function(e){var b=e.target.closest('.ccard');if(b)open(b.getAttribute('data-id'),b)});
    render();
  }

  /* ---------- client card window ---------- */
  var lastFocus=null,full=false;
  function field(icon,label,value,pic,h,raw){
    return '<div class="fcell" style="--fh:'+h+'px"><span class="fp" style="background-image:url('+img(pic)+')"></span>'+
      '<span class="fi">'+ic(icon)+'</span><span class="fl">'+label+'</span><span class="fv">'+(raw?value:esc(value))+'</span></div>'}
  function open(id,from){
    var c=clients.filter(function(x){return x.id===id})[0];if(!c)return;
    lastFocus=from||document.activeElement;
    document.getElementById('m-name').textContent=c.name;
    var ph=document.getElementById('m-phone');ph.querySelector('span').textContent=c.phone;ph.href='tel:'+c.phone.replace(/\s/g,'');
    var st=c.status==='Активен'?'<span class="pill"><i></i>'+esc(c.status)+'</span>':'<span class="pill warn"><i></i>'+esc(c.status)+'</span>';
    document.getElementById('m-fields').innerHTML=[
      field('mail','Имейл',c.email,'field-email.webp',112),field('id-card','ЕГН',c.egn,'field-id.webp',112),
      field('house','Адрес',c.type,'field-home.webp',100),field('pin','Град / Област',c.city+', '+c.hood,'field-shumen.webp',100),
      field('coins','Бюджет',budget(c),'field-budget.webp',99),field('calendar-check','Дата на контакт',c.contact,'field-calendar.webp',99),
      field('users','Статус',st,'field-status.webp',104,true),field('tag','Източник',c.source,'field-source.webp',104)].join('');
    document.getElementById('m-acts').innerHTML=c.acts.map(function(a){return '<div class="arow">'+ic(a[0])+'<span class="at">'+esc(a[1])+'</span><span class="tm">'+esc(a[2])+'</span></div>'}).join('');
    win.dataset.client=c.name;
    back.hidden=false;win.hidden=false;root.classList.add('locked');
    fitModal();mscroll.scrollTop=0;
    requestAnimationFrame(function(){back.classList.add('show');win.classList.add('show')});
    try{history.replaceState(null,'','#'+c.id)}catch(e){}
    setTimeout(function(){document.getElementById('m-close').focus({preventScroll:true})},60);
  }
  function close(){
    win.classList.remove('show');back.classList.remove('show');
    setTimeout(function(){win.hidden=true;back.hidden=true;setFull(false)},230);
    root.classList.remove('locked');
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
  }
  function setFull(v){
    full=v;win.classList.toggle('full',v);
    var b=document.getElementById('m-full');b.innerHTML=ic(v?'minimize-2':'maximize-2');
    b.setAttribute('aria-label',v?'Възстанови размера':'На цял екран');b.title=b.getAttribute('aria-label');
    fitModal();setTimeout(fitModal,280);
  }
  document.getElementById('m-full').addEventListener('click',function(){setFull(!full)});
  document.getElementById('m-close').addEventListener('click',close);
  back.addEventListener('click',close);
  document.addEventListener('keydown',function(e){
    if(win.hidden)return;
    if(e.key==='Escape'){e.preventDefault();close();return}
    if(e.key==='Tab'){var f=[].slice.call(win.querySelectorAll('button,a[href],input,select')).filter(function(x){return x.offsetParent!==null});
      if(!f.length)return;var a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  });
  win.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b)say(b.getAttribute('data-act')+' – '+(win.dataset.client||''))});

  /* ---------- toast + misc buttons ---------- */
  var t=document.getElementById('toast'),timer;
  function say(s){t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){t.classList.remove('show')},2200)}
  document.querySelectorAll('[data-msg]').forEach(function(b){b.addEventListener('click',function(){say(b.getAttribute('data-msg'))})});
  document.querySelectorAll('[data-focus]').forEach(function(b){b.addEventListener('click',function(){var el=document.getElementById(b.getAttribute('data-focus'));el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){el.focus({preventScroll:true})},350)})});
  document.querySelectorAll('[data-nav]').forEach(function(b){b.addEventListener('click',function(){
    var to=b.getAttribute('data-href');if(to){window.goTo(to);return}
    if(b.classList.contains('on')){if(!win.hidden)close();scrollTo({top:0,behavior:'smooth'});return}
    say(b.getAttribute('data-nav')+' – страницата предстои')})});

  try{var dw=document.querySelector('.status .time');if(dw&&!matchMedia('(pointer:coarse)').matches){}}catch(e){}
  setup('sales');setup('rent');fit();
  /* deep link: crm-klienti.html#maria opens that client's card */
  var h=(location.hash||'').slice(1);if(h&&clients.some(function(c){return c.id===h}))open(h);
})();
