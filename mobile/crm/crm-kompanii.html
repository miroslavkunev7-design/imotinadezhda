/* ================= SMOOTH PAGE-TO-PAGE TRANSITION (shared by all CRM pages) ================= */
@view-transition{navigation:auto}
body{background:#efc19c}
#dock{view-transition-name:crm-dock}
::view-transition-old(root){animation:crmOut .22s ease both}
::view-transition-new(root){animation:crmIn .36s cubic-bezier(.2,.7,.2,1) both}
::view-transition-group(crm-dock){animation-duration:.3s}
@keyframes crmOut{to{opacity:0}}
@keyframes crmIn{from{opacity:0;transform:translateY(10px)}}
html.no-vt #stage{animation:crmIn .34s cubic-bezier(.2,.7,.2,1) both}

.oe .en b{display:block;font:700 27px/1.1 var(--cond);color:#6b0a1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oe .en span{display:block;font:400 21px/1.2 var(--cond);color:#1f1111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oe .sep{height:52px;background:rgba(90,30,30,.25)}
.oe .ek{position:relative;padding-left:30px;display:flex;flex-direction:column;gap:6px;min-width:0}
.oe .ek span{display:flex;align-items:center;gap:16px;font:400 22px/1 var(--cond);color:#1f1111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oe .ek svg.i{flex:0 0 auto;font-size:26px;color:#7b1020;stroke-width:1.9}
.oe .ar{position:relative;justify-self:center;font-size:36px;color:#5a0a12}.oe .ar svg.i{stroke-width:2.4}
.od-emps .none{padding:16px 24px;font:italic 400 23px/1.4 var(--cond);color:#7a5a52}

/* desktop: list left, company detail right */
html.desk .ocv{padding-top:0}
html.desk .ocv .ctop .photo{-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.5) 30%,#000 52%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.5) 30%,#000 52%)}
html.desk .oflow{padding:0 var(--xL,24px)}
html.desk .otools{padding:18px 0 0}
html.desk .o-pop{right:0}
html.desk .odet{min-height:var(--lh,700px)}
html.desk .oc{height:var(--och,118px)}
html.desk .oc .on2{top:calc(14px + var(--ocd,0px))}html.desk .oc .oca{top:calc(54px + var(--ocd,0px))}html.desk .oc .om{top:calc(84px + var(--ocd,0px))}
html.desk .oc .op{width:calc(390px + var(--ocd,0px)*3)}
html.desk .ocols{display:grid;grid-template-columns:1000px 1fr;column-gap:30px;align-items:start}
html.desk .olist{padding:22px 0 0;max-height:var(--lh,700px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#c99a5a transparent;padding-right:6px}
html.desk .odet{margin:22px 0 0;max-height:var(--lh,700px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#c99a5a transparent}
html.desk .odet:empty{display:block;min-height:200px;box-shadow:0 0 0 1.5px rgba(226,176,120,.5),0 0 18px rgba(255,226,190,.7)}
html.desk .odet:empty:before{content:'Изберете компания, за да видите данните и служителите ѝ.';display:block;padding:60px 40px;text-align:center;font:400 28px/1.4 var(--cond);color:#7a5a52}

/* ================= FORM WINDOW ================= */
.fwin{background:#f6dcc4}
.fwin .mscroll{background:linear-gradient(180deg,#fff7ef 0%,#fbe8d7 60%,#f6d8bf 100%)}
.fctl{top:12px;right:12px}
.f-x{color:#fff!important;background:radial-gradient(circle at 35% 28%,#8d1a30,#5a0718 70%)!important;box-shadow:0 0 0 2px #f1d7a8,0 2px 6px rgba(0,0,0,.4)!important}
html:not(.desk) .fctl{top:calc(var(--fz,.37)*16px);right:calc(var(--fz,.37)*18px)}
html:not(.desk) .fctl .mbtn{width:calc(var(--fz,.37)*62px);height:calc(var(--fz,.37)*62px);font-size:calc(var(--fz,.37)*32px)}
.fcv{position:relative;width:1024px;padding:0 0 26px}
.f-bar{position:sticky;top:0;z-index:4;height:96px;display:flex;align-items:center;gap:30px;padding-left:40px;color:#fff3dc;
  background:linear-gradient(180deg,#9a1a33 0%,#74101f 45%,#4f0716 100%);border-bottom:2px solid #e9bd6f;box-shadow:inset 0 2px 3px rgba(255,170,180,.45),0 4px 10px rgba(60,5,15,.3)}
.f-bar svg.i{font-size:56px;color:#f3cf86;stroke-width:1.6}
.f-bar h2{font:700 44px/1 var(--serif);text-shadow:0 2px 3px rgba(30,0,8,.6)}
.f-photo{height:170px;margin:0;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 45%);mask-image:linear-gradient(0deg,transparent 0,#000 45%)}
.f-body{display:grid;grid-template-columns:1fr 1fr;gap:4px 30px;padding:0 36px}
.f-body .ef.wide{grid-column:1/-1}
.ef{margin-bottom:22px}
.el{display:flex;align-items:center;gap:22px;font:700 27px/1 var(--cond);color:#6b0a1c;margin-bottom:10px}
.el svg.i{font-size:38px;color:#7b1020;stroke-width:1.7;flex:0 0 auto}
.ef .in{height:56px;font-size:25px;border-radius:16px;padding:0 18px}
.in.ta{height:140px;padding:14px 18px;resize:none;line-height:1.35;font-family:var(--cond)}
.in.bad{box-shadow:0 0 0 2.5px #c81a3a,0 0 10px rgba(200,26,58,.35)}
.ev-err{min-height:34px;padding:0 36px;font:700 24px/1.3 var(--cond);color:#b0102e}
.ev-acts{display:flex;justify-content:center;gap:26px;padding:6px 28px 0}
.ea{height:72px;min-width:220px;padding:0 34px;border-radius:36px;display:flex;align-items:center;justify-content:center;gap:16px;font:700 29px/1 var(--cond);color:#6b0a1c;
  background:linear-gradient(180deg,#fffcf9 0%,#fbefe5 100%);box-shadow:0 3px 7px rgba(140,70,40,.28),0 0 0 1px rgba(231,196,160,.6),0 0 12px rgba(255,230,200,.8),inset 0 1px 0 #fff}
.ea svg.i{font-size:36px;stroke-width:1.9}
.ea.hot{min-width:340px;color:#fff;font-weight:400;background:linear-gradient(180deg,#a3213a 0%,#7a0f22 42%,#55071a 100%);border:2px solid #edc47a;
  box-shadow:0 0 0 1px rgba(255,236,190,.5),0 0 16px rgba(255,190,120,.7),inset 0 2px 3px rgba(255,170,180,.5)}
.ea.del{min-width:0;color:#a30d26}
.ea[hidden]{display:none}
html.desk .fwin .mscroll{overflow:hidden}

/* smooth navigation between CRM pages: native cross-page transition where supported, a soft fade elsewhere */
(function(){
  var root=document.documentElement,vt=('onpagereveal' in window);
  if(!vt)root.classList.add('no-vt');
  window.goTo=function(url){
    if(vt){location.href=url;return}
    root.classList.add('leaving');setTimeout(function(){location.href=url},170);
  };
  addEventListener('pageshow',function(){root.classList.remove('leaving')});
  /* nav-capture: the bottom menu always navigates, even if a page script fails */
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('.nv[data-href]');if(!b)return;e.preventDefault();e.stopPropagation();window.goTo(b.getAttribute('data-href'))},true);
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;
    var h=a.getAttribute('href');if(/^crm-[\w-]+\.html(#[\w-]+)?$/.test(h)){e.preventDefault();window.goTo(h)}
  });
})();
</script>

      desc:'Интериорен дизайн и обзавеждане – проекти „до ключ“ за клиенти на агенцията.',
      emps:[{id:'i1',name:'Виолета Русева',role:'Главен дизайнер',phone:'+359 887 200 300',email:'v.ruseva@interiorpro.bg'},
            {id:'i2',name:'Калоян Минчев',role:'3D визуализации',phone:'+359 887 200 301',email:'k.minchev@interiorpro.bg'},
            {id:'i3',name:'Рая Христова',role:'Проектен мениджър',phone:'+359 887 200 302',email:'r.hristova@interiorpro.bg'},
            {id:'i4',name:'Борис Неделчев',role:'Монтаж и доставка',phone:'+359 887 200 303',email:'b.nedelchev@interiorpro.bg'}]}
  ];
  var cos=[];
  function persist(){if(window.ND)ND.sync('companies',cos).catch(function(){})}
  var empWord=function(n){return n+' '+(n===1?'служител':'служители')};

  /* ---------- scaling ---------- */
  var top=document.querySelector('.otop'),photo=top.querySelector('.photo'),ctrls=[].slice.call(top.querySelectorAll('.ctrl,.avatar')),
      texts=[].slice.call(top.querySelectorAll('.hero-title,.hero-sub,.o-ic')).map(function(el){return {el:el,top:parseFloat(el.style.top||getComputedStyle(el).top)}});
  var desk=false;
  function isDesk(){return root.clientWidth>=1024&&root.clientWidth/innerHeight>=1.2}
  function fit(){
    desk=isDesk();root.classList.toggle('desk',desk);
    if(desk){
      var vw=root.clientWidth,vh=innerHeight,BW=2072,BH=1180,k=Math.min(vw/BW,vh/BH),Wc=vw/k,Hc=vh/k,exH=Hc-BH,exW=Wc-BW;
      var Hh=320+Math.min(exH*.4,140),xL=24+Math.min(exW*.5,200);
      canvas.style.zoom=k;canvas.style.marginLeft='0px';canvas.style.width=Wc+'px';canvas.style.height=Hc+'px';canvas.style.paddingTop=Hh+'px';
      top.style.height=Hh+'px';
      texts.forEach(function(o){o.el.style.top=(o.top+(Hh-320)*.75)+'px'});
      var ph=Hh*1.0,pw=ph*3.36;photo.style.width=pw+'px';photo.style.left=(Wc-pw)+'px';photo.style.top=(Hh-ph)+'px';
      ctrls.forEach(function(el){if(el.dataset.l==null)el.dataset.l=parseFloat(getComputedStyle(el).left);el.style.left=(Wc-1024+(+el.dataset.l))+'px'});
      root.style.setProperty('--xL',xL+'px');root.style.setProperty('--lh',(Hc-Hh-18-62-22-162-10)+'px');
      dockC.style.transform='scale('+k+')';dockC.style.left=((vw-1024*k)/2)+'px';stage.style.paddingBottom='0px';
      dock.style.height=(DOCK*k)+'px';root.style.setProperty('--dockH',(118*k)+'px');
    }else{
      canvas.style.width=canvas.style.height=canvas.style.paddingTop='';top.style.height='';
      texts.forEach(function(o){o.el.style.top=o.top+'px'});photo.style.width=photo.style.left=photo.style.top='';ctrls.forEach(function(el){el.style.left=''});
      var vw2=root.clientWidth,k2=vw2/W,off=(root.clientWidth-vw2)/2;
      canvas.style.zoom=k2;canvas.style.marginLeft=(off/k2)+'px';
      dockC.style.transform='scale('+k2+')';dockC.style.left=off+'px';
      dock.style.height=(DOCK*k2)+'px';stage.style.paddingBottom=(DOCK*k2)+'px';root.style.setProperty('--dockH',(118*k2)+'px');
    }
    if(typeof sizeCards==='function'&&$('olist').children.length)sizeCards();
    fitF();
  }
  addEventListener('resize',fit);addEventListener('orientationchange',fit);

  /* ---------- list + filter ---------- */
  var cat='',sel=cos[0]?cos[0].id:null;
  $('o-pop').innerHTML='<li role="option" data-c="" class="on">'+ic('building-2')+'Всички компании</li>'+CATS.map(function(c){return '<li role="option" data-c="'+c.id+'">'+ic(c.icon)+esc(c.group)+'</li>'}).join('');
  $('o-filt').addEventListener('click',function(e){e.stopPropagation();var p=$('o-pop'),o=p.hidden;p.hidden=!o;this.setAttribute('aria-expanded',o)});
  document.addEventListener('click',function(e){if(!e.target.closest('#o-pop')&&!e.target.closest('#o-filt')){$('o-pop').hidden=true;$('o-filt').setAttribute('aria-expanded','false')}});
  $('o-pop').addEventListener('click',function(e){var li=e.target.closest('li');if(!li)return;cat=li.dataset.c;
    [].forEach.call(this.children,function(x){x.classList.toggle('on',x===li)});$('o-filt-t').textContent=cat?catOf(cat).group:'Филтри';this.hidden=true;$('o-filt').setAttribute('aria-expanded','false');renderList()});
  $('o-q').addEventListener('input',renderList);
  function sizeCards(){if(!desk){root.style.removeProperty('--och');root.style.removeProperty('--ocd');return}var n=Math.max(1,$('olist').querySelectorAll('.oc').length),lh=parseFloat(getComputedStyle(root).getPropertyValue('--lh'))||700;
    var h=Math.max(118,Math.min(240,(lh-22-16*(n-1))/n));root.style.setProperty('--och',h+'px');root.style.setProperty('--ocd',((h-118)/2)+'px')}
  function renderList(){
    var q=$('o-q').value.trim().toLocaleLowerCase('bg');
    var list=cos.filter(function(c){if(cat&&c.cat!==cat)return false;if(!q)return true;
      return (c.name+' '+catOf(c.cat).label+' '+c.emps.map(function(e){return e.name}).join(' ')).toLocaleLowerCase('bg').indexOf(q)>=0});
    $('olist').innerHTML=list.length?list.map(function(c){var ct=catOf(c.cat);
      return '<article class="oc'+(c.id===sel?' on':'')+'" tabindex="0" data-id="'+c.id+'" aria-expanded="'+(c.id===sel)+'" aria-label="'+esc(c.name)+'">'+
        '<span class="op" style="background-image:url('+img(ct.photo)+')"></span><span class="oi">'+ic(ct.icon)+'</span>'+
        '<h3 class="on2">'+esc(c.name)+'</h3><p class="oca">'+esc(ct.label)+'</p>'+
        '<p class="om"><span>'+ic('users')+empWord(c.emps.length)+'</span><i></i><span>'+ic('phone')+esc(c.phone||'—')+'</span></p>'+
        '<span class="ar">'+ic('chev-r')+'</span></article>'}).join('')
      :'<div class="empty">Няма компании по избраните критерии.</div>';
    sizeCards();
  }
  function renderDet(){
    var c=cos.filter(function(x){return x.id===sel})[0],box=$('odet');
    if(!c){box.innerHTML='';return}
    var ct=catOf(c.cat),row=function(icn,v,href){return v?(href?'<a href="'+href+'">'+ic(icn)+esc(v)+'</a>':'<span>'+ic(icn)+esc(v)+'</span>'):'<span>'+ic(icn)+'<em>няма данни</em></span>'};
    var web=c.web?('https://'+c.web.replace(/^https?:\/\//,'')):'';
    box.innerHTML='<header class="od-h">'+ic(ct.icon)+'<h2>'+esc(c.name)+'</h2>'+
        '<button type="button" data-edit aria-label="Редактирай компанията" title="Редактирай">'+ic('pencil')+'</button>'+
        '<button type="button" data-collapse aria-label="Свий" title="Свий">'+ic('chevron-up')+'</button></header>'+
      '<div class="od-info"><span class="od-ph" style="background-image:url('+img(c.cat==='bank'||c.cat==='invest'||c.cat==='service'?'co-desc.jpg':ct.photo)+')"></span>'+
        '<div class="od-c">'+row('pin',c.address)+row('phone',c.phone,c.phone?'tel:'+c.phone.replace(/\s/g,''):'')+row('mail',c.email,c.email?'mailto:'+c.email:'')+
          (c.web?'<a href="'+esc(web)+'" target="_blank" rel="noopener">'+ic('link')+esc(c.web)+'</a>':row('link',''))+'</div>'+
        '<div class="od-d">'+ic('file-text')+'<b>Описание</b><p>'+esc(c.desc||'—')+'</p></div></div>'+
      '<div class="od-eh">'+ic('users')+'<h3>Служители ('+c.emps.length+')</h3><button type="button" class="od-add" data-addemp>'+ic('plus')+'Добави служител</button></div>'+
      '<div class="od-emps">'+(c.emps.length?c.emps.map(function(e,i){
        return '<button type="button" class="oe" data-emp="'+e.id+'"><span class="ep" style="background-image:url('+img('co-emp'+(i%3)+'.jpg')+')"></span>'+ic('user-round')+
          '<span class="en"><b>'+esc(e.name)+'</b><span>'+esc(e.role||'—')+'</span></span><i class="sep"></i>'+
          '<span class="ek"><span>'+ic('phone')+esc(e.phone||'—')+'</span><span>'+ic('mail')+esc(e.email||'—')+'</span></span><span class="ar">'+ic('chev-r')+'</span></button>'}).join('')
        :'<p class="none">Няма добавени служители.</p>')+'</div>';
  }
  function select(id,scroll){
    sel=(sel===id&&!desk)?null:id;renderList();renderDet();
    if(sel&&scroll&&!desk)setTimeout(function(){$('odet').scrollIntoView({behavior:'smooth',block:'start'})},40);
  }
  $('olist').addEventListener('click',function(e){var c=e.target.closest('.oc');if(c)select(c.dataset.id,true)});
  $('olist').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('oc'))e.target.click()});
  $('odet').addEventListener('click',function(e){
    if(e.target.closest('[data-collapse]')){sel=null;renderList();renderDet();return}
    if(e.target.closest('[data-edit]')){openF('company',sel);return}
    if(e.target.closest('[data-addemp]')){openF('emp',null);return}
    var b=e.target.closest('[data-emp]');if(b)openF('emp',b.dataset.emp)});

  /* ---------- form window (company / employee) ---------- */
  var fwin=$('fwin'),fback=$('fback'),fcv=$('fcv'),fscroll=$('fscroll'),ffull=false,flast=null,mode=null,editId=null;
  function fld(id,label,icon,val,type,wide,ph){return '<div class="ef'+(wide?' wide':'')+'"><label class="el" for="'+id+'">'+ic(icon)+label+'</label>'+
    (type==='ta'?'<textarea class="in ta" id="'+id+'" placeholder="'+esc(ph||'')+'">'+esc(val)+'</textarea>':'<input class="in" id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(ph||'')+'">')+'</div>'}
  function openF(m,id){
    mode=m;editId=id;flast=document.activeElement;var c=cos.filter(function(x){return x.id===sel})[0];
    $('f-err').textContent='';
    if(m==='company'){
      var o=id?cos.filter(function(x){return x.id===id})[0]:{name:'',cat:'bank',phone:'',address:'',email:'',web:'',desc:''};
      $('f-title').textContent=id?'Редакция на компания':'Нова компания';$('f-ic').innerHTML='<use href="#building-2"/>';
      $('f-photo').style.backgroundImage='url('+img(catOf(o.cat).photo)+')';
      $('f-body').innerHTML=fld('f-name','Име на компанията *','building-2',o.name,'text',true,'напр. Банка ДСК')+
        '<div class="ef"><label class="el" for="f-cat">'+ic('tag')+'Вид дейност *</label><span class="selw"><select class="in" id="f-cat">'+CATS.map(function(x){return '<option value="'+x.id+'"'+(x.id===o.cat?' selected':'')+'>'+esc(x.label)+'</option>'}).join('')+'</select>'+ic('chev-d')+'</span></div>'+
        fld('f-phone','Телефон','phone',o.phone,'tel')+fld('f-addr','Адрес','pin',o.address,'text',true)+
        fld('f-mail','Имейл','mail',o.email,'email')+fld('f-web','Уебсайт','link',o.web,'text')+fld('f-desc','Описание','file-text',o.desc,'ta',true,'Кратко описание на партньорството…');
      $('f-cat').addEventListener('change',function(){$('f-photo').style.backgroundImage='url('+img(catOf(this.value).photo)+')'});
      $('f-del').hidden=!id;
    }else{
      if(!c)return;
      var e=id?c.emps.filter(function(x){return x.id===id})[0]:{name:'',role:'',phone:'',email:''};
      $('f-title').textContent=id?'Служител – '+c.name:'Нов служител – '+c.name;$('f-ic').innerHTML='<use href="#user-round"/>';
      $('f-photo').style.backgroundImage='url('+img('co-emp1.jpg')+')';
      $('f-body').innerHTML=fld('f-name','Име и фамилия *','user-round',e.name,'text',true)+fld('f-role','Длъжност','id-card',e.role,'text',true)+
        fld('f-phone','Телефон','phone',e.phone,'tel')+fld('f-mail','Имейл','mail',e.email,'email');
      $('f-del').hidden=!id;
    }
    fback.hidden=false;fwin.hidden=false;root.classList.add('locked');fitF();fscroll.scrollTop=0;
    requestAnimationFrame(function(){fback.classList.add('show');fwin.classList.add('show')});
    setTimeout(function(){$('f-name').focus({preventScroll:true})},80);
  }
  function closeF(){fwin.classList.remove('show');fback.classList.remove('show');root.classList.remove('locked');
    setTimeout(function(){fwin.hidden=true;fback.hidden=true;setFFull(false)},230);if(flast&&flast.focus&&document.contains(flast))flast.focus({preventScroll:true})}
  function setFFull(v){ffull=v;fwin.classList.toggle('full',v);var b=$('f-full');b.innerHTML=ic(v?'minimize-2':'maximize-2');
    b.setAttribute('aria-label',v?'Възстанови размера':'На цял екран');b.title=b.getAttribute('aria-label');fitF();setTimeout(fitF,280)}
  function fitF(){
    if(fwin.hidden)return;
    if(desk){var vw=root.clientWidth,dh=parseFloat(getComputedStyle(root).getPropertyValue('--dockH'))||100,ah=innerHeight-dh-14;
      var H=fcv.offsetHeight||1000,aw=ffull?vw-16:vw*.6,av=ffull?ah-8:ah*.94,z=Math.min(aw/1024,av/H),w=1024*z,h=H*z;
      fwin.style.width=w+'px';fwin.style.height=h+'px';fwin.style.left=((vw-w)/2)+'px';fwin.style.top=Math.max(6,(ah-h)/2)+'px';fcv.style.zoom=z}
    else{fwin.style.width=fwin.style.height=fwin.style.left=fwin.style.top='';var zz=fwin.clientWidth/1024;fcv.style.zoom=zz;fwin.style.setProperty('--fz',zz)}
  }
  var v=function(id){var el=$(id);return el?el.value.trim():''};
  fcv.addEventListener('submit',function(ev){
    ev.preventDefault();[].forEach.call(fcv.querySelectorAll('.bad'),function(x){x.classList.remove('bad')});
    var errs=[];
    if(!v('f-name')){errs.push('въведете име');$('f-name').classList.add('bad')}
    var mail=v('f-mail');if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){errs.push('проверете имейла');$('f-mail').classList.add('bad')}
    if(errs.length){$('f-err').textContent='Моля, '+errs.join(', ')+'.';return}
    if(mode==='company'){
      var rec={name:v('f-name'),cat:v('f-cat'),phone:v('f-phone'),address:v('f-addr'),email:mail,web:v('f-web'),desc:v('f-desc')};
      if(editId){cos=cos.map(function(x){return x.id===editId?Object.assign({},x,rec):x})}
      else{rec.id='c'+Date.now();rec.emps=[];cos.unshift(rec);sel=rec.id}
      say(editId?'Компанията е обновена':'Компанията е добавена');
    }else{
      var c=cos.filter(function(x){return x.id===sel})[0],er={name:v('f-name'),role:v('f-role'),phone:v('f-phone'),email:mail};
      if(editId)c.emps=c.emps.map(function(x){return x.id===editId?Object.assign({},x,er):x});else{er.id='e'+Date.now();c.emps.push(er)}
      say(editId?'Служителят е обновен':'Служителят е добавен');
    }
    persist();renderList();renderDet();closeF();
  });
  $('f-del').addEventListener('click',function(){
    var b=this,s=b.querySelector('span');if(!b.dataset.ok){b.dataset.ok='1';s.textContent='Потвърди';setTimeout(function(){delete b.dataset.ok;s.textContent='Изтрий'},2500);return}
    delete b.dataset.ok;s.textContent='Изтрий';
    if(mode==='company'){cos=cos.filter(function(x){return x.id!==editId});sel=cos[0]?cos[0].id:null;say('Компанията е изтрита')}
    else{var c=cos.filter(function(x){return x.id===sel})[0];c.emps=c.emps.filter(function(x){return x.id!==editId});say('Служителят е премахнат')}
    persist();renderList();renderDet();closeF()});
  $('o-new').addEventListener('click',function(){openF('company',null)});
  $('f-cancel').addEventListener('click',closeF);$('f-close').addEventListener('click',closeF);fback.addEventListener('click',closeF);
  $('f-full').addEventListener('click',function(){setFFull(!ffull)});
  document.addEventListener('keydown',function(e){
    if(fwin.hidden)return;
    if(e.key==='Escape'){e.preventDefault();closeF();return}
    if(e.key==='Tab'){var f=[].slice.call(fwin.querySelectorAll('button,input,select,textarea')).filter(function(x){return x.offsetParent!==null&&!x.disabled});if(!f.length)return;
      var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  });

  /* ---------- header buttons and navigation ---------- */
  document.querySelectorAll('[data-msg]').forEach(function(b){b.addEventListener('click',function(){say(b.getAttribute('data-msg'))})});
  document.querySelectorAll('[data-focus]').forEach(function(b){b.addEventListener('click',function(){var el=$(b.getAttribute('data-focus'));el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){el.focus({preventScroll:true})},350)})});
  document.querySelectorAll('[data-nav]').forEach(function(b){b.addEventListener('click',function(){
    var to=b.getAttribute('data-href');if(to){window.goTo(to);return}
    if(b.classList.contains('on')){if(!fwin.hidden)closeF();scrollTo({top:0,behavior:'smooth'});return}
    say(b.getAttribute('data-nav')+' – страницата предстои')})});

  renderList();renderDet();fit();
  ND.busy(1);
  ND.ready().then(function(){return ND.load('companies')}).then(function(list){
    ND.busy(0);cos=list;cos.forEach(function(c){if(!Array.isArray(c.emps))c.emps=[]});
    var h=(location.hash||'').slice(1);sel=cos.some(function(c){return c.id===h})?h:(cos[0]?cos[0].id:null);
    renderList();renderDet();
  }).catch(function(e){ND.busy(0);say('Грешка при зареждане: '+(e&&e.message||e))});
})();
</script>
