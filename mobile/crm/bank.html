CommissionChange}/></div></div><div className="payment-box"><Icon name="calendar"/><div><div className="payment-caption">Месечна вноска</div><output className="payment-number">€ {payment}{rateHi!=null&&rateHi!==rate&&price>0&&Number(down)<Number(price)?' – '+fmtPay(annuity(loan,rateHi,Number(years))):''}</output></div></div><div className="calc-buttons"><button className="green-button" onClick={calculate}><Icon name="calculator"/>Изчисли вноска</button><button className="white-green-button" onClick={saveOffer}><Icon name="bookmark"/>Запази оферта</button></div></section>
<aside className="credit-aside"><section className="note-card"><h2><Icon name="percent"/>Лихвен процент</h2><div className="interest-number">{loadingRates&&rate==null?'…':pct2(rate)+(rateHi!=null&&rateHi!==rate?' – '+pct2(rateHi):'')}</div><ul className="check-list"><li><Icon name="check"/><span>{BR.note?BR.note:(hasOwn?'Ваше условие: EURIBOR + марж':'Лихва от '+pct2(BR.r)+' до '+pct2(BR.r+RATE_SPREAD)+' според профила'+(BR.g?' · ГПР от '+pct2(BR.g):'')+(BR.fix?' · фикс. 5 г. '+pct2(BR.fix):'')+' · към '+RATE_DATE)}</span></li><li><Icon name="check"/><span>6М EURIBOR {index==null?'—':pct2(index)}{rates&&rates.euribor6m?' ('+rates.euribor6m.period+')':''}</span></li><li><Icon name="check"/><span>Марж {bankData[bank][0]}: <input aria-label="Марж на банката в %" className="margin-input" inputMode="decimal" defaultValue={margin.toFixed(2)} key={bank} onBlur={e=>setMargin(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')e.currentTarget.blur()}}/>%</span></li>{rates&&rates.estr&&rates.estr.value!=null&&<li><Icon name="check"/><span>€STR {pct2(rates.estr.value)} ({rates.estr.period})</span></li>}</ul><button className="green-button rate-refresh" disabled={loadingRates} onClick={refreshRates} title={refreshOpen?'Обнови лихвата към днешна дата':'Достъпно след 09:30'}><Icon name="refresh"/>{loadingRates?'Обновява…':'Обнови лихвата'}</button><p className="rate-note">{rates?('Обновено: '+new Date(rates.fetchedAt).toLocaleString('bg-BG',{timeZone:'Europe/Sofia',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+(refreshedToday?'':' · ново обновяване '+(refreshOpen?'е достъпно':'след 09:30'))):'Зарежда лихвите…'}<br/>Лихви на банките към {RATES_DATE} – еднакви за Шумен, Варна и Бургас; реалната оферта зависи от профила (обикновено +0,3–1,1 п.п.). EURIBOR/€STR: ЕЦБ. Промяна на маржа = Ваше условие от банката.</p></section><section className="note-card"><h2><Icon name="doc"/>Необходими документи</h2><ul className="check-list">{['Лична карта','Удостоверение за доход','Трудов договор','Справка от ЦКР (съгласие)','Документи за имота (нотариален акт/скица)'].map(t=><li key={t}><Icon name="check"/><span>{t}</span></li>)}</ul></section></aside></div>:creditTab==='offer'?<section className="offer-pane"><h2>Оферта за ипотечен кредит</h2>{offer?<><div className="offer-card"><div><strong>{offer.client||''}</strong><small>{offer.bank} · {offer.date}</small><p className="mt-3">Размер на кредита: <b>{money(offer.loan)}</b></p><p>Срок: <b>{offer.years} години</b> · Лихвен процент: <b>{pct2(offer.rate)}</b></p></div><div><small>Месечна вноска</small><strong>€ {offer.payment}</strong></div></div><div className="flex flex-wrap gap-3 mt-5"><button className="green-button" onClick={()=>download('Оферта-за-кредит.txt',`Клиент: ${offer.client}\nБанка: ${offer.bank}\nРазмер на кредита: ${money(offer.loan)}\nСрок: ${offer.years} години\nМесечна вноска: € ${offer.payment}`)}><Icon name="download"/>Изтегли оферта</button><button className="white-green-button" onClick={()=>setModal({type:'send',title:'Изпрати на клиента'})}><Icon name="send"/>Изпрати на клиента</button></div></>:<><p>Все още няма запазена оферта.</p><p className="mt-2 mb-6">Попълнете калкулатора и натиснете „Запази оферта“.</p><button className="green-button" onClick={()=>setCreditTab('calculator')}><Icon name="calculator"/>Към калкулатора</button></>}</section>:<section className="offer-pane"><h2>Статус на заявката</h2>{[['user','Избран клиент',client||'Изберете клиент от базата данни'],['home','Избран имот','Луксозен апартамент в центъра'],['doc','Документи на клиента',clientAttached?'Данните са заредени':'Очаква зареждане на данни от клиента'],['bookmark','Кредитна оферта',offer?'Офертата е запазена':'Очаква изчисление и запазване'],['send','Изпращане към банката','Заявката е в подготовка']].map(([i,t,d])=><div className="status-step" key={t}><Icon name={i}/><div><b>{t}</b><span>{d}</span></div></div>)}</section>}
</div></div><footer className="credit-footer"><button className="white-green-button" onClick={()=>setModal({type:'ckr',title:'Провери ЦКР'})}><Icon name="shield"/>Провери ЦКР</button><button className="white-green-button" onClick={()=>{setFeePrice(Number(price));setFeeLoan(loan);notify('Нотариални такси и разходи: '+money(total))}}><Icon name="scale"/>Изчисли нотариус</button><button className="white-green-button" onClick={()=>download('Списък-с-документи.txt','НЕОБХОДИМИ ДОКУМЕНТИ\n\nЛична карта\nУдостоверение за доход\nТрудов договор\nСправка от ЦКР (съгласие)\nДокументи за имота (нотариален акт/скица)')}><Icon name="download"/>Изтегли списък</button><button className="green-button" onClick={()=>setModal({type:'personnel',title:'Персонал'})}><Icon name="users"/>Персонал<Icon name="arrow"/></button></footer></section>
<section className="client-docs"><div className="section-topline"><div className="section-ribbon"><Icon name="doc"/>Документи на клиента за ипотека</div><div className="section-actions"><Btn icon="folder" onClick={()=>{setClientAttached(true);notify('Клиентските документи са избрани')}}>Избери клиентски документи</Btn><label className="cream-button cursor-pointer"><Icon name="upload"/>Прикачи нов документ<input type="file" className="hidden" multiple onChange={e=>notify(e.target.files.length+' документа са прикачени')}/></label></div></div><div className="client-doc-grid">{clientDocs.map((d,i)=><div key={d.name}><div className="doc-row" style={{'--row-image':`url(https://cdn.screenshottocode.com/${clientArt[i]}.png)`}}>{rowContent(d,i,true)}</div>{clientExpanded===i&&<div className="p-3 text-sm bg-orange-50 rounded-xl mt-1"><b>{d.name}</b><p>{d.count?`Прикачени файлове (${d.count})`:'Няма прикачени файлове'}</p><label className="cream-button text-xs mt-2 cursor-pointer"><Icon name="upload"/>Прикачи файл<input type="file" className="hidden" onChange={()=>notify('Файлът е прикачен успешно')}/></label></div>}</div>)}</div></section><footer className="quick-actions"><div className="section-ribbon"><Icon name="bolt"/>Бързи действия</div><Btn icon="shield" onClick={()=>setModal({type:'ckr',title:'Провери ЦКР'})}>Провери ЦКР</Btn><Btn icon="send" onClick={()=>setModal({type:'send',title:'Изпрати към банката',toBank:true})}>Изпрати към банката</Btn><Btn icon="doc" onClick={()=>download('Списък-документи.txt')}>Генерирай списък с документи</Btn><Btn icon="download" onClick={()=>download('Кредитен-разчет.txt',`Цена: ${money(price)}\nСамоучастие: ${money(down)}\nКредит: ${money(loan)}\nВноска: € ${payment}\nРазходи: ${money(total)}`)}>Изтегли разчет</Btn><Btn icon="send" onClick={()=>setModal({type:'send',title:'Изпрати на клиента'})}>Изпрати на клиента</Btn></footer>
</>:<><section className="property-overview"><div className="property-gallery"><div className="hero-image"><img src={gallery[photo%6]} style={{objectPosition:['50% 50%','50% 50%','0% 50%','70% 50%','100% 50%','50% 90%'][photo%6]}} alt="Луксозен апартамент – дневна с панорамна гледка"/><span className="apartment-label">Апартамент</span><button className="photo-arrow left" aria-label="Предишна снимка" onClick={()=>setPhoto((photo+23)%24)}><Icon name="left"/></button><button className="photo-arrow right" aria-label="Следваща снимка" onClick={()=>setPhoto((photo+1)%24)}><Icon name="right"/></button><span className="photo-counter">{photo+1} / 24</span><button className="photo-expand" aria-label="Увеличи снимката" onClick={()=>setModal({type:'image'})}><Icon name="expand"/></button></div><div className="photo-thumbnails">{Array.from({length:6},(_,i)=><button key={i} className={'photo-thumb '+(photo%6===i?'active':'')} aria-label={'Снимка '+(i+1)} onClick={()=>setPhoto(i)}><img src={thumbnails[i]} style={{objectPosition:['10% 50%','center','0% 50%','60% 50%','100% 50%','50% 90%'][i],filter:i===5?'saturate(.8) brightness(1.07)':'none'}} alt={'Изглед '+(i+1)}/></button>)}</div></div><div className="property-info"><h1>Луксозен апартамент<br/>в центъра</h1><div className="location"><Icon name="pin"/>София, Център</div><div className="property-price">€ 320 000 <Icon name="info"/></div><p className="official-price">Официална цена</p><button className={'heart-button '+(saved?'saved':'')} aria-label="Добави в любими" onClick={()=>{setSaved(!saved);notify(saved?'Имотът е премахнат от любими':'Имотът е добавен в любими')}}><Icon name="heart"/></button><div className="property-stats"><div className="stats-group">{[['area','120 м²','Площ'],['bed','3','Стаи'],['bath','2','Бани']].map(([ic,b,t])=><div className="stat-item" key={t}><Icon name={ic}/><span><b>{b}</b>{t}</span></div>)}</div><div className="stats-group">{[['layers','4 от 6','Етаж'],['calendar','2028','Година на строителство'],['bolt','Отлично','Състояние']].map(([ic,b,t])=><div className="stat-item" key={t}><Icon name={ic}/><span><b>{b}</b>{t}</span></div>)}</div></div><div className="property-cta"><Btn icon="phone" className="red-button" onClick={()=>setModal({type:'broker',title:'Свържи се с брокер'})}>Свържи се с брокер</Btn><Btn icon="bookmark" onClick={()=>{setSaved(!saved);notify(saved?'Имотът е премахнат от запазени':'Имотът е запазен')}}>{saved?'Запазен':'Запази'}</Btn><Btn icon="share" onClick={share}>Сподели</Btn><Btn icon="print" onClick={()=>window.print()}>Печат</Btn></div></div></section>
<nav className="property-nav" aria-label="Информация за имота">{[['home','Основна информация'],['image','Снимки и медии'],['list','Характеристики'],['pin','Локация'],['doc','Документи'],['user','Собственик'],['handshake','Сделка'],['doc','Договор'],['history','История']].map(([ic,t])=><Btn key={t} icon={ic} className={subtab===t?'red-button':''} onClick={()=>propertyTab(t)}>{t}</Btn>)}</nav>
{subtab==='Документи'?<section className="property-documents"><div className="section-topline"><div className="section-ribbon"><Icon name="doc"/>Документи на имота</div><Btn icon="plus" className="red-button add-group" onClick={()=>setModal({type:'group',title:'Създай нова графа'})}>Създай нова графа</Btn></div>{docs.map((d,i)=><section className="doc-section" key={d.name}><div className="doc-row" style={{'--row-image':art[i]?`url(https://cdn.screenshottocode.com/${art[i]}.png)`:'none'}}>{rowContent(d,i)}</div>{expanded===i&&<div className="doc-expanded"><div className="document-preview">{i===1?<img src={DOCUMENT} style={{transform:previewPage%2?'rotate(0deg) scale(.95)':'none'}} alt="Скица на имот"/>:<div className="document-paper" style={{transform:'scale(.45)',transformOrigin:'center',flexShrink:0}}><h4>{d.name.toUpperCase()}</h4>{Array.from({length:7},(_,j)=><div key={j} className="paper-line"/>)}<div className="paper-stamp">ЗАВЕРЕНО</div></div>}<button className="photo-arrow left" aria-label="Предишен документ" onClick={()=>setPreviewPage(Math.max(0,previewPage-1))}><Icon name="left"/></button><button className="photo-arrow right" aria-label="Следващ документ" onClick={()=>setPreviewPage((previewPage+1)%Math.max(1,d.count))}><Icon name="right"/></button><span className="photo-counter">{previewPage%Math.max(1,d.count)+1} / {Math.max(1,d.count)}</span></div><div className="attached-files"><h3>Прикачени файлове ({d.count})</h3>{d.files.map((name,j)=><div className="attached-file" key={name+j}><Icon name="doc"/><span className="attached-name">{name}</span><span className="file-meta">10.02.2026</span><span className="file-meta">•</span><span className="file-meta">{j%2?'0,9':'1,6'} МВ</span><button aria-label={'Преглед на '+name} onClick={()=>setModal({type:'preview',title:name,image:i===1})}><Icon name="eye"/></button><button aria-label={'Изтегли '+name} onClick={()=>download(name.replace(/\.pdf$/,'.txt'))}><Icon name="download"/></button><button aria-label={'Още действия за '+name} onClick={()=>{if(confirm('Да се премахне ли файлът „'+name+'“?'))setDocs(docs.map((doc,idx)=>idx===i?{...doc,count:doc.count-1,files:doc.files.filter((f,k)=>k!==j)}:doc))}}><Icon name="more"/></button></div>)}<label className={'upload-zone '+(dragging?'dragging':'')} onDragOver={e=>{e.preventDefault();setDragging(true)}} onDragLeave={()=>setDragging(false)} onDrop={e=>{e.preventDefault();setDragging(false);addFiles(e.dataTransfer.files,i)}}><strong><Icon name="upload"/>Прикачи файл</strong><span>Плъзни файл тук или избери от компютъра</span><input type="file" multiple className="hidden" onChange={e=>addFiles(e.target.files,i)}/></label></div></div>}</section>)}</section>:<section className="other-property-content"><h2>{subtab}</h2>{subtab==='Основна информация'?<><p className="text-lg leading-relaxed mb-5">Луксозен апартамент в центъра на София с панорамна гледка, просторна дневна, три стаи и две бани.</p><div className="details-grid">{[['area','Площ: 120 м²'],['bed','Стаи: 3'],['layers','Етаж: 4 от 6']].map(([ic,t])=><div className="detail-tile" key={t}><Icon name={ic}/>{t}</div>)}</div><Btn icon="bank" className="red-button mt-6" onClick={()=>showView('bank')}>Банков модул за имота</Btn></>:subtab==='Снимки и медии'?<div className="grid grid-cols-2 gap-4">{[0,1,2,3].map(i=><button key={i} onClick={()=>setModal({type:'image'})}><img className="rounded-xl w-full" src={i===1?CITY:PHOTO} alt="Снимка на имота"/></button>)}</div>:subtab==='Характеристики'?<div className="details-grid">{['Площ: 120 м²','3 стаи','2 бани','Етаж 4 от 6','Година на строителство: 2028','Състояние: Отлично'].map(t=><div className="detail-tile" key={t}>{t}</div>)}</div>:subtab==='Локация'?<div className="flex flex-wrap items-center gap-6"><img src={CITY} alt="София" className="rounded-xl w-60"/><div><h3 className="text-2xl font-bold">София, Център</h3><p>Луксозен апартамент в центъра</p><a className="cream-button mt-4" href="https://www.google.com/maps/search/София+Център" target="_blank" rel="noreferrer">Отвори в Google Maps</a></div></div>:subtab==='История'?<>{['Прикачена скица на имот · 10.02.2026','Актуализирана оферта · 10.02.2026','Добавен имот · 09.02.2026'].map(t=><div className="detail-tile mb-3" key={t}><Icon name="history"/>{t}</div>)}</>:subtab==='Собственик'?<><div className="detail-tile"><Icon name="user"/> · Собственик на имота</div><Btn icon="phone" className="red-button mt-5" onClick={()=>setModal({type:'broker',title:'Контакт с брокера'})}>Свържи се с брокер</Btn></>:<><p className="mb-5">Документи и информация за {subtab==='Сделка'?'сделката':'договора'} на имота.</p><Btn icon="doc" className="red-button" onClick={()=>setSubtab('Документи')}>Преглед на документите</Btn></>}</section>}
</>}
</main>}{toast&&<div className="toast" role="status"><Icon name="check"/>{toast}</div>}{Modal()}</>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
