/* ================= SMOOTH PAGE-TO-PAGE TRANSITION (shared by all CRM pages) ================= */
@view-transition{navigation:auto}
body{background:#efc19c}
#dock{view-transition-name:crm-dock}
::view-transition-old(root){animation:crmOut .22s ease both}
::view-transition-new(root){animation:crmIn .36s cubic-bezier(.2,.7,.2,1) both}
::view-transition-group(crm-dock){animation-duration:.3s}
@keyframes crmOut{to{opacity:0}}
@keyframes crmIn{from{opacity:0;transform:translateY(10px)}}
html.no-vt #stage{animation:crmIn .34s cubic-bezier(.2,.7,.2,1) both}
html.leaving #stage{opacity:0;transform:translateY(-6px);transition:opacity .17s ease,transform .17s ease}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root),html.no-vt #stage{animation:none}html.leaving #stage{transition:none}}

  var sorts=[['new','Най-нови'],['pasc','Цена: възходящо'],['pdesc','Цена: низходящо'],['area','Най-голяма площ']];
  fill(sel.region,'region',uniq(props.map(function(p){return p.region})));
  /* full lists of our territories (NDPlaces) + anything else found in the data */
  var PLC=window.NDPlaces||{cities:[],PLACES:{}};
  function cities(){fill(sel.city,'city',uniq((sel.region.value?[]:PLC.cities).concat(props.filter(function(p){return !sel.region.value||p.region===sel.region.value}).map(function(p){return p.city})).filter(Boolean)))}

      return '<article class="pc" tabindex="0" data-id="'+p.id+'" aria-label="'+esc(p.title+', '+p.city+', '+p.hood)+'">'+
        '<div class="pp" style="background-image:url('+img(p.img)+')">'+
          '<button class="hrt'+(favs[p.id]?' on':'')+'" data-fav="'+p.id+'" aria-pressed="'+!!favs[p.id]+'" aria-label="Любим имот">'+ic('heart')+'</button>'+
          '<span class="tg">'+ic(p.deal==='rent'?'key-round':'tag')+(p.deal==='rent'?'Наем':'Продажба')+'</span>'+
          '<span class="cam">'+ic('camera')+p.photos+'</span></div>'+
        '<h3 class="tt">'+(p.num?'<span class="inum">И#'+esc(p.num)+'</span> ':'')+esc(p.title)+'</h3>'+
        '<p class="lc">'+ic('pin')+esc(p.city+', '+p.hood)+'</p>'+
        '<p class="sp">'+specs+'</p>'+
        '<span class="pr">'+priceText(p)+'</span>'+
        '<span class="st '+st+'"><i></i>'+esc(p.status)+'</span>'+
        '<button class="mn" data-menu="'+p.id+'" aria-label="Още действия">'+ic('ellipsis-vertical')+'</button></article>'}).join('')
      :'<div class="empty">Няма имоти по избраните критерии.</div>';
  }
  $('i-go').addEventListener('click',function(){setView(null);render(current())});
  $('i-q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();setView(null);render(current())}});
  $('i-clear').addEventListener('click',function(){
    $('i-q').value='';Object.keys(sel).forEach(function(k){sel[k].value=''});cities();hoods();Object.keys(sel).forEach(function(k){show(sel[k])});
    deal='sale';document.querySelectorAll('.dl').forEach(function(x){var on=x.getAttribute('data-deal')==='sale';x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
    setView(null);render(null)});
  $('i-more').addEventListener('click',function(){window.NDProps.more(MORE,function(o){MORE=o;render(applied);say(o?'Допълнителните филтри са приложени':'Допълнителните филтри са изчистени')})});
  var MORE=null;

  function setView(v){document.querySelectorAll('.ia').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-view')===v)})}
  document.querySelectorAll('.ia').forEach(function(b){b.addEventListener('click',function(){
    var v=b.getAttribute('data-view');
    if(v==='new'){window.NDScan.menu(b,'property',{manual:function(){window.NDProps.edit(null)},scanned:function(f,file,bundle){window.NDProps.edit(null,f,file,bundle)}});return}
    setView(v);render(v==='all'?null:{only:v})})});

  document.querySelectorAll('.vb').forEach(function(b){b.addEventListener('click',function(){
    view=b.getAttribute('data-v');document.querySelectorAll('.vb').forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});render(applied)})});

  $('plist').addEventListener('click',function(e){
    var f=e.target.closest('[data-fav]');if(f){e.stopPropagation();var id=f.getAttribute('data-fav');favs[id]=!favs[id];f.classList.toggle('on',favs[id]);f.setAttribute('aria-pressed',favs[id]);
      try{localStorage.setItem('imoti-favs',JSON.stringify(favs))}catch(x){};say(favs[id]?'Добавен в любими':'Премахнат от любими');return}
    var m=e.target.closest('[data-menu]');if(m){e.stopPropagation();var mp=props.filter(function(x){return x.id===m.getAttribute('data-menu')})[0];if(mp)window.NDProps.edit(mp);return}
    var c=e.target.closest('.pc');if(c)openProp(c.getAttribute('data-id'),c)});
  $('plist').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('pc'))e.target.click()});

  /* ---------- toast, header buttons, navigation ---------- */
  var t=$('toast'),timer;
  function say(s){t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){t.classList.remove('show')},2200)}
  document.querySelectorAll('[data-msg]').forEach(function(b){b.addEventListener('click',function(){say(b.getAttribute('data-msg'))})});
  document.querySelectorAll('[data-focus]').forEach(function(b){b.addEventListener('click',function(){var el=$(b.getAttribute('data-focus'));el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){el.focus({preventScroll:true})},350)})});
  document.querySelectorAll('[data-nav]').forEach(function(b){b.addEventListener('click',function(){
    var to=b.getAttribute('data-href');if(to){window.goTo(to);return}
    if(b.classList.contains('on')){scrollTo({top:0,behavior:'smooth'});return}
    say(b.getAttribute('data-nav')+' – страницата предстои')})});


  /* ---------- property card window (opens on this page) ---------- */
  var det={};
  var docs=[['file-text','Нотариален акт','PDF · 1.2 MB'],['file-text','Скица / схема','PDF · 640 KB'],['file-text','Данъчна оценка','PDF · 210 KB'],['file-text','Енергиен сертификат','PDF · 380 KB']];
  var pwin=$('pwin'),pback=$('pback'),pmcv=$('pmcv'),pscroll=$('pscroll'),pctl=pwin.querySelector('.pctl');
  var cur=null,gi=0,pfull=false,plast=null;
  function cell(icon,label,val){return '<div class="pm-cell">'+ic(icon)+'<span>'+label+'</span><b>'+esc(val)+'</b></div>'}
  function showPhoto(){
    var g=det[cur.id].gallery,im=$('pm-img');im.classList.add('fade');
    setTimeout(function(){im.src=img(g[gi]);im.alt=cur.title+' – снимка '+(gi+1);im.classList.remove('fade')},120);
    $('pm-cnt').querySelector('span').textContent=(gi+1)+' / '+g.length;
    [].forEach.call($('pm-thumbs').querySelectorAll('.pm-th'),function(t){t.classList.toggle('on',+t.dataset.i===gi)});
  }
  function acc(id,icon,label,body){return '<div class="acc" data-acc="'+id+'"><button aria-expanded="false">'+ic(icon)+'<span>'+label+'</span><svg class="i cv"><use href="#chev-d"/></svg></button><div class="body">'+body+'</div></div>'}
  function openProp(id,from){
    var p=props.filter(function(x){return x.id===id})[0];if(!p)return;var d=det[id];cur=p;gi=0;plast=from||document.activeElement;
    $('pm-id').textContent=(p.num?'И#'+p.num+' · ':'')+'№ '+d.num;
    $('pm-title').textContent=p.title;
    $('pm-loc').querySelector('span').textContent=p.city+', кв. '+p.hood;
    $('pm-price').innerHTML=priceText(p);
    var th=d.gallery.slice(0,4).map(function(g,i){return '<button class="pm-th" data-i="'+i+'" aria-label="Снимка '+(i+1)+'" style="background-image:url('+img(g)+')"></button>'}).join('');
    var more=p.photos-Math.min(4,d.gallery.length);
    $('pm-thumbs').innerHTML=th+(more>0?'<button class="pm-more" data-more aria-label="Всички '+p.photos+' снимки">+'+more+'</button>':'');
    $('pm-grid').innerHTML=[cell('m2','Площ',money(p.area)+' м²'),cell('bed-double','Стаи',d.rooms),cell('bed-double','Спални',d.beds),cell('bath','Бани',d.baths),
      cell('building-2','Етаж',d.floor),cell('book-open','Тип',d.kind),cell('brick-wall','Строителство',d.build),cell('calendar','Година',d.year)].join('');
    $('pm-desc').textContent=d.desc;
    var pics=d.gallery.map(function(g){return '<span style="background-image:url('+img(g)+')"></span>'}).join('');
    var monthly=p.deal==='sale'&&p.price>20000?(function(){var L=p.price*.8,r=.0325/12,n=360;return money(Math.round(L*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)))})():null;
    $('pm-acc').innerHTML=
      acc('docs','image','Снимки и документи ('+p.photos+')','<div class="pics">'+pics+'</div>'+(p.docs.length?p.docs.map(function(x,i){return '<div class="row" data-doc="'+i+'" role="button" tabindex="0" style="cursor:pointer">'+ic('file-text')+'<span>'+esc(x.name)+'</span><span class="r">'+Math.max(1,Math.round((x.size||0)/1024))+' KB</span></div>'}).join(''):'<div class="row">'+ic('file-text')+'<span>Няма качени документи</span></div>')+'<p class="note">Добавяне на снимки и документи – бутон „Редактирай“.</p>')+
      acc('pdocs','file-text','Документи на имота (чеклист)','<div class="row">'+ic('shield')+'<span>Нотариален акт, скица, тежести, данъчна оценка… + специални ситуации</span></div><button class="bankbtn" data-pa="pdocs">'+ic('file-text')+'Отвори документите</button>')+
      acc('owner','user','Собственик',(p.client?'<div class="row">'+ic('user')+'<span>'+esc(p.client)+'</span><span class="r">'+(CL[p.client]?'<a href="crm-klienti.html#'+esc(CL[p.client].id)+'">Клиент</a>':'Клиент')+'</span></div><div class="row">'+ic('phone')+'<span>Телефон</span><span class="r">'+(CL[p.client]&&CL[p.client].phone?'<a href="tel:'+esc(CL[p.client].phone.replace(/\s/g,''))+'">'+esc(CL[p.client].phone)+'</a>':'няма данни')+'</span></div>':'<div class="row">'+ic('user')+'<span>Няма посочен собственик</span></div>')+'<p class="note">Данните на собственика се показват според правата на потребителя.</p>')+
      acc('bank','landmark','Финансиране / Банка',(monthly?'<div class="row">'+ic('coins')+'<span>Примерна вноска (80% кредит, 30 г., 3,25%)</span><span class="r">'+monthly+' € / мес.</span></div>':'<div class="row">'+ic('coins')+'<span>Имотът е под наем – без кредит</span></div>')+'<button class="bankbtn" data-pa="bank">'+ic('landmark')+'Банков модул</button>')+
      acc('log','clock','Коментари и активност',(p.log.length?p.log.slice(0,12).map(function(l){return '<div class="row">'+ic(l.icon||'clock')+'<span>'+esc(l.text)+'</span><span class="r">'+esc(window.NDUI.bgDateTime(l.at))+'</span></div>'}).join(''):'<div class="row">'+ic('megaphone')+'<span>Статус: '+esc(p.status)+'</span></div>'));
    var pub=pwin.querySelector('[data-pa="publish"] span');pub.textContent=p.status==='Публикуван'?'Публикуван':'Публикувай';
    pwin.dataset.title=p.title;
    pback.hidden=false;pwin.hidden=false;root.classList.add('locked');
    $('pm-img').src=img(d.gallery[0]);$('pm-img').alt=p.title;$('pm-cnt').querySelector('span').textContent='1 / '+d.gallery.length;
    [].forEach.call($('pm-thumbs').querySelectorAll('.pm-th'),function(t){t.classList.toggle('on',t.dataset.i==='0')});
    $('pm-prev').hidden=$('pm-next').hidden=d.gallery.length<2;
    fitProp();pscroll.scrollTop=0;$('pm-right').scrollTop=0;
    requestAnimationFrame(function(){pback.classList.add('show');pwin.classList.add('show')});
    try{history.replaceState(null,'','#'+p.id)}catch(e){}
    setTimeout(function(){$('pm-close').focus({preventScroll:true})},60);
  }
  function closeProp(){
    pwin.classList.remove('show');pback.classList.remove('show');root.classList.remove('locked');
    setTimeout(function(){pwin.hidden=true;pback.hidden=true;setPFull(false)},230);
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(plast&&plast.focus)plast.focus({preventScroll:true});
  }
  function setPFull(v){pfull=v;pwin.classList.toggle('full',v);var b=$('pm-full');b.innerHTML=ic(v?'minimize-2':'maximize-2');
    b.setAttribute('aria-label',v?'Възстанови размера':'На цял екран');b.title=b.getAttribute('aria-label');fitProp();setTimeout(fitProp,280)}
  function fitProp(){
    if(pwin.hidden)return;
    if(desk){
      var vw=root.clientWidth,dh=parseFloat(getComputedStyle(root).getPropertyValue('--dockH'))||100,ah=innerHeight-dh-14;
      var aw=pfull?vw-16:vw*.94,av=pfull?ah-8:ah*.94,z=Math.min(aw/2048,av/1250),w=2048*z,h=1250*z;
      pwin.style.width=w+'px';pwin.style.height=h+'px';pwin.style.left=((vw-w)/2)+'px';pwin.style.top=Math.max(6,(ah-h)/2)+'px';pmcv.style.zoom=z;
    }else{pwin.style.width=pwin.style.height=pwin.style.left=pwin.style.top='';pmcv.style.zoom=pwin.clientWidth/1024}
  }
  addEventListener('resize',function(){setTimeout(fitProp,0)});
  $('pm-full').addEventListener('click',function(){setPFull(!pfull)});
  $('pm-close').addEventListener('click',closeProp);
  pback.addEventListener('click',closeProp);
  $('pm-prev').addEventListener('click',function(){var n=det[cur.id].gallery.length;gi=(gi-1+n)%n;showPhoto()});
  $('pm-next').addEventListener('click',function(){var n=det[cur.id].gallery.length;gi=(gi+1)%n;showPhoto()});
  $('pm-thumbs').addEventListener('click',function(e){
    var t=e.target.closest('.pm-th');if(t){gi=+t.dataset.i;showPhoto();return}
    if(e.target.closest('[data-more]')){var a=pwin.querySelector('[data-acc="docs"]');a.classList.add('open');a.querySelector('button').setAttribute('aria-expanded','true');a.scrollIntoView({behavior:'smooth',block:'start'})}});
  $('pm-acc').addEventListener('click',function(e){var b=e.target.closest('.acc>button');if(!b)return;var a=b.parentNode,o=!a.classList.contains('open');a.classList.toggle('open',o);b.setAttribute('aria-expanded',o)});
  pwin.addEventListener('click',function(e){var b=e.target.closest('[data-pa]');if(!b)return;var a=b.getAttribute('data-pa'),t=pwin.dataset.title;
    if(a==='share'){var u=location.href.split('#')[0]+'#'+cur.id;try{navigator.clipboard.writeText(u).then(function(){say('Линкът към имота е копиран')},function(){say('Линк: '+u)})}catch(x){say('Линк: '+u)}return}
    if(a==='edit'){window.NDProps.edit(cur);return}
    if(a==='publish'){if(cur.status==='Публикуван'){say('Имотът вече е публикуван');return}window.NDProps.setStatus(cur,'Публикуван');return}
    if(a==='archive'){window.NDProps.setStatus(cur,cur.status==='Архивиран'?'Активен':'Архивиран');return}
    if(a==='bank'){window.NDUI.bank({client:cur.client,price:cur.deal==='sale'?cur.price:'',city:cur.city});return}
    if(a==='pdocs'&&window.NDDocs){var pp=cur;window.NDDocs.property(pp,{say:say,save:function(patch){var o=window.NDProps.stored(pp);Object.keys(patch).forEach(function(k){o[k]=patch[k]});return ND.put('properties',o)},onUpload:function(t,n){var o=window.NDProps.stored(pp);o.log=(o.log||[]).slice(0,49);o.log.unshift({icon:'file-text',text:'Прикачен документ: '+t+(n>1?' ('+n+' файла)':''),at:new Date().toISOString()});pp.log=o.log;ND.put('properties',o).catch(function(){})}});return}
    say(t)});
  $('pm-acc').addEventListener('click',function(e){var r=e.target.closest('[data-doc]');if(!r||!cur)return;var d=cur.docs[+r.getAttribute('data-doc')];if(!d)return;var w=window.open('','_blank');ND.fileUrl(d.path).then(function(u){if(w)w.location=u;else location.href=u})});
  document.addEventListener('keydown',function(e){
    if(pwin.hidden)return;
    if(e.key==='Escape'){e.preventDefault();closeProp();return}
    if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT'){$('pm-next').click()}
    if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT'){$('pm-prev').click()}
    if(e.key==='Tab'){var f=[].slice.call(pwin.querySelectorAll('button,a[href]')).filter(function(x){return x.offsetParent!==null&&!x.hidden});if(!f.length)return;
      var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  });
  render(null);fit();
  function refreshFilters(){fill(sel.region,'region',uniq(props.map(function(p){return p.region}).filter(Boolean)));cities();hoods();['region','city','hood'].forEach(function(k){show(sel[k])})}
  function loadAll(){
    return Promise.all([ND.load('properties'),ND.load('clients')]).then(function(r){
      CL={};r[1].forEach(function(c){if(c.name)CL[c.name]=c});window.__ndClientNames=Object.keys(CL);
      var paths=[];r[0].forEach(function(p){(p.pics||[]).forEach(function(x){paths.push(x)})});
      return ND.fileUrls(paths).then(function(m){window.IMG=Object.assign(window.IMG||{},m);det={};props.length=0;[].push.apply(props,prep(r[0]));refreshFilters();render(applied)});
    });
  }
  window.NDProps.init({say:say,list:function(){return props},clientNames:function(){return Object.keys(CL)},refresh:loadAll,
    reopen:function(id){if(!pwin.hidden&&cur&&cur.id===id)openProp(id,plast);else if(pwin.hidden)openProp(id)},closeCard:function(){if(!pwin.hidden)closeProp()}});
  ND.busy(1);
  ND.ready().then(loadAll).then(function(){ND.busy(0);var hh=(location.hash||'').slice(1);if(hh==='new'){try{history.replaceState(null,'',location.pathname)}catch(x){}setTimeout(function(){var nb=document.querySelector('.ia[data-view="new"]');if(nb)nb.click()},250)}else if(det[hh])openProp(hh)}).catch(function(e){ND.busy(0);say('Грешка при зареждане: '+(e&&e.message||e))});
})();
</script>
