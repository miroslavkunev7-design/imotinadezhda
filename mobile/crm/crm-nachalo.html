:root{
  --wine-950:#2e0610;--wine-900:#430c16;--wine-800:#5c0d1c;--wine-700:#7a1023;--ruby:#b8163f;--glint:#f27a98;
  --gold-600:#b8843a;--gold-500:#d9a95a;--gold-300:#f6d993;--gold-100:#fff1c9;
  --cream:#fbe9d9;--cream-2:#fdf3ea;--ivory:#fffaf5;--peach:#f2c7a3;

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#3e0d16;min-height:100%}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- scaling stage: the design is drawn on a 1024 px canvas and scaled to the phone width ---------- */
#stage{position:relative;width:100%;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 55%,#f6d3b6 0%,#efc19c 55%,#e2a882 100%)}
#canvas{position:absolute;left:0;top:0;width:1024px;height:1536px;transform-origin:0 0;zoom:var(--ndk,1);contain:layout}
.abs{position:absolute}

/* ---------- header / hero ---------- */
.top{left:0;top:0;width:1024px;height:380px;overflow:hidden;
  background:linear-gradient(180deg,#5a1424 0%,#4a0f1b 22%,#3f0d17 100%)}
.top .photo{left:236px;top:76px;width:790px;height:auto;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 9%,#000 24%),linear-gradient(180deg,transparent 0,#000 13%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 9%,#000 24%),linear-gradient(180deg,transparent 0,#000 13%);mask-composite:intersect}
.top .shade{inset:0;background:
  linear-gradient(90deg,rgba(64,10,22,.92) 0%,rgba(64,10,22,.55) 30%,rgba(64,10,22,0) 52%),
  linear-gradient(0deg,rgba(242,199,163,.35) 0%,rgba(242,199,163,0) 10%)}
.top .swoosh{left:0;top:0;width:1024px;height:380px}
.top .logo{left:64px;top:62px;width:212px;height:auto;mix-blend-mode:multiply}
.status{left:0;top:0;width:1024px;height:52px;color:#fff;font:700 26px/1 var(--sans)}
.status .time{position:absolute;left:62px;top:15px;letter-spacing:.5px}
.status .right{position:absolute;right:52px;top:13px;display:flex;align-items:center;gap:14px}
.bars{display:flex;align-items:flex-end;gap:4px;height:26px}
.bars i{display:block;width:6px;background:#fff;border-radius:2px}
.bars i:nth-child(1){height:9px}.bars i:nth-child(2){height:14px}.bars i:nth-child(3){height:19px}.bars i:nth-child(4){height:25px}
.battery{display:flex;align-items:center;gap:3px}
.battery b{display:grid;place-items:center;width:50px;height:28px;border-radius:9px;background:#fff;color:#2a0a10;font:800 20px/1 var(--sans)}
.battery i{width:4px;height:10px;border-radius:0 3px 3px 0;background:#fff;opacity:.85}
.ctrl{top:72px;width:44px;height:44px;display:grid;place-items:center;color:#f4c766;font-size:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.ctrl svg.i{stroke-width:1.75}
.ctrl.bell{left:675px}.ctrl.search{left:751px}.ctrl.gear{left:831px}
.ctrl.bell:after{content:'';position:absolute;right:-1px;top:-2px;width:15px;height:15px;border-radius:50%;background:#ee1c25;box-shadow:0 0 0 1px #ffb3b3 inset}
.avatar{left:904px;top:59px;width:76px;height:76px;border-radius:50%;padding:4px;
  background:linear-gradient(145deg,#fff3c9,#d49d48 40%,#fbe3a3 65%,#a8702e);box-shadow:0 4px 10px rgba(0,0,0,.45)}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.hero-title{left:47px;top:222px;font:700 57px/1.05 var(--serif);letter-spacing:.2px;
  background:linear-gradient(180deg,#fff4d4 0%,#f6d99b 38%,#d9a254 62%,#f7dca2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 3px rgba(40,0,8,.75))}
.hero-sub{left:49px;top:286px;color:#fff;font:400 22.5px/1.27 var(--sans);text-shadow:0 2px 4px rgba(0,0,0,.6)}
.hero-line{left:48px;top:351px;width:300px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,#f8dc98 0%,#d6a24f 55%,rgba(214,162,79,0) 100%)}

/* ---------- feature tiles ---------- */
.tile{--th:236px;width:484px;height:var(--th);border-radius:22px;overflow:hidden;text-align:left;color:#fff;
  background:#560b19;border:2px solid #f4cf85;
  box-shadow:0 0 0 1px rgba(255,236,190,.55),0 0 14px rgba(255,214,140,.55),0 8px 16px rgba(80,15,10,.45)}
.tile .ph{position:absolute;max-width:none}
.tile .veil{position:absolute;inset:0;background:
  linear-gradient(90deg,#580b1b 0%,#5a0c1c 30%,rgba(92,12,30,.78) 44%,rgba(92,12,30,.25) 62%,rgba(92,12,30,0) 78%),
  linear-gradient(0deg,rgba(60,6,16,.35),rgba(60,6,16,0) 45%)}
.tile .gloss{position:absolute;inset:0;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 30%);pointer-events:none}
.tile .ic{position:absolute;left:34px;top:calc(var(--th) - 124px);font-size:50px;color:#f2c56a;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.tile .ic svg.i{stroke-width:1.7}
.tile h3{position:absolute;left:34px;top:calc(var(--th) - 78px);font:700 35px/1 var(--serif);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.55);letter-spacing:.2px}
.tile p{position:absolute;left:34px;top:calc(var(--th) - 37px);font:400 19.5px/1 var(--sans);color:#fff4ea;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tile .go{position:absolute;right:16px;top:calc(var(--th) - 54px);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#2b0c0c;font-size:26px;
  background:radial-gradient(circle at 35% 28%,#fffbe8 0%,#f7dfa0 35%,#d9a650 75%,#b98235 100%);box-shadow:0 3px 6px rgba(0,0,0,.45),0 0 0 1px #fff2c4 inset}
.tile .go svg.i{stroke-width:2.6}

/* ---------- cream glass panels ---------- */
.panel{left:12px;width:1000px;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,247,240,.96) 0%,rgba(252,236,222,.95) 100%);
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px rgba(226,176,120,.35),0 0 18px rgba(255,236,214,.9),0 10px 22px rgba(120,50,20,.22),inset 0 1px 0 #fff}
.ptitle{position:absolute;display:flex;align-items:center;gap:16px;font:700 27px/1 var(--serif);color:#3b0a0e}
.ptitle svg.i{color:#7b1020;font-size:31px;stroke-width:2.2}

.qa-row{position:absolute;left:24px;top:44px;display:flex;gap:12px}
.qa{width:150px;height:78px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px;gap:8px;
  background:linear-gradient(180deg,#fffcf9 0%,#fcf0e6 100%);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 3px 7px rgba(140,70,40,.22),0 0 0 1px rgba(231,196,160,.55),inset 0 -2px 3px rgba(230,190,160,.35);
  font:700 18.5px/1 var(--sans);color:#2c1012}
.qa svg.i{font-size:37px;color:#7d1222;stroke-width:2}

.datepill{position:absolute;right:12px;top:6px;width:235px;height:39px;border-radius:20px;display:flex;align-items:center;gap:12px;padding:0 16px 0 22px;
  background:linear-gradient(180deg,#fffaf5,#f9eadd);box-shadow:0 2px 5px rgba(140,70,40,.25),0 0 0 1px rgba(231,196,160,.6);font:400 20px/1 var(--sans);color:#2b1414}
.datepill svg.i{font-size:28px;color:#7b1020;stroke-width:1.8}.datepill .dn{margin-left:auto;font-size:22px;color:#3a1212}
.metrics{position:absolute;left:20px;top:47px;width:958px;height:98px;border-radius:18px;display:grid;grid-template-columns:repeat(4,1fr);
  background:linear-gradient(180deg,rgba(255,251,247,.95),rgba(253,241,232,.9));box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 2px 6px rgba(150,80,40,.15)}
.metric{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:2px}
.metric+.metric:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:1.5px;background:linear-gradient(180deg,rgba(90,20,20,0),rgba(90,20,20,.55),rgba(90,20,20,0))}
.metric svg.i{font-size:34px;color:#7b1020;stroke-width:2}
.metric b{font:700 31px/1.05 var(--sans);color:var(--value);margin-top:3px}
.metric span{font:400 19.5px/1.1 var(--sans);color:#2b1414;margin-top:2px}

/* satin title ribbon */
.ribbon{position:absolute;left:-1px;top:-1px;width:575px;height:58px;pointer-events:none}
.rtitle{position:absolute;left:38px;top:12px;display:flex;align-items:center;gap:20px;color:#fff;font:400 28.5px/1 var(--serif);text-shadow:0 2px 3px rgba(40,0,8,.55)}
.rtitle svg.i{font-size:34px;color:#f3c56a;stroke-width:1.7}
.pillbtn{position:absolute;right:20px;top:9px;height:36px;border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 20px 0 22px;
  background:linear-gradient(180deg,#fffaf5,#f9eadd);box-shadow:0 2px 5px rgba(140,70,40,.25),0 0 0 1px rgba(231,196,160,.6);font:700 19px/1 var(--sans);color:#5a0a12}
.pillbtn svg.i{font-size:26px;color:#7b1020;stroke-width:1.8}
.linkbtn{position:absolute;right:26px;top:12px;display:flex;align-items:center;gap:10px;font:700 21px/1 var(--sans);color:#5a0a12}
.linkbtn svg.i{font-size:24px;stroke-width:2.6}

.daycard{position:absolute;left:22px;top:59px;width:136px;height:84px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fffcf9,#fbefe5);box-shadow:0 2px 6px rgba(140,70,40,.22),0 0 0 1px rgba(231,196,160,.5);color:#3b0a0e}
.daycard .d1{font:700 20px/1 var(--sans)}.daycard .d2{font:700 35px/1.02 var(--sans);margin:3px 0 2px}.daycard .d3{font:400 19px/1 var(--sans)}
.tl{position:absolute;left:178px;top:72px;width:14px;height:56px}
.tl i{position:absolute;left:0;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d24a5e,#7d0f20 65%);box-shadow:0 0 0 2px #f1c37f}
.tl i:first-child{top:0}.tl i:last-child{bottom:0}.tl:before{content:'';position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:#8b1a2a}
.ev{position:absolute;left:203px;width:776px;height:39px;border-radius:20px;display:flex;align-items:center;
  background:linear-gradient(180deg,#fffcf9,#fcf0e7);box-shadow:0 2px 5px rgba(140,70,40,.2),0 0 0 1px rgba(231,196,160,.5);font:400 20.5px/1 var(--sans);color:#2b1414;text-align:left}
.ev .t{width:98px;height:31px;margin-left:10px;border-radius:16px;display:grid;place-items:center;color:#fff;font:400 20.5px/1 var(--sans);
  background:linear-gradient(180deg,#a3213a 0%,#7d0f22 45%,#5e0716 100%);box-shadow:inset 0 1px 1px rgba(255,170,180,.6),0 1px 2px rgba(0,0,0,.3)}
.ev .n{margin-left:20px;flex:1}
.ev .c{display:flex;align-items:center;gap:9px;width:150px}
.ev .c svg.i{font-size:24px;color:#7b1020;stroke-width:1.8}
.ev .ch{width:40px;display:grid;place-items:center;font-size:24px;color:#3a1212}.ev .ch svg.i{stroke-width:2.6}

.act{position:absolute;left:18px;width:970px;height:49px;border-radius:14px;display:flex;align-items:center;text-align:left;
  background:linear-gradient(180deg,rgba(255,252,249,.97),rgba(252,240,231,.95));box-shadow:0 2px 5px rgba(140,70,40,.18),0 0 0 1px rgba(231,196,160,.45)}
.act .ib{width:90px;height:41px;margin-left:4px;border-radius:12px;display:grid;place-items:center;font-size:34px;color:#7b1020;
  background:linear-gradient(180deg,#fbeee3,#f5ddc8)}
.act .ib svg.i{stroke-width:2}
.act .tx{margin-left:16px;flex:1}
.act .tx b{display:block;font:700 20.5px/1.05 var(--sans);color:#5a0a12}
.act .tx span{display:block;font:400 18.5px/1.1 var(--sans);color:#1f1111;margin-top:2px}
.act .tm{font:400 17.5px/1 var(--sans);color:#2b1414}
.act .ch{width:52px;display:grid;place-items:center;font-size:24px;color:#5a0a12}.act .ch svg.i{stroke-width:2.6}

/* ---------- bottom navigation ---------- */
#dock{position:fixed;left:0;bottom:0;width:100%;z-index:20;pointer-events:none}
#dockCanvas{position:absolute;left:0;bottom:0;width:1024px;height:160px;transform-origin:0 100%;pointer-events:auto}
.dock-bg{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,rgba(74,15,26,0) 0%,#4a0f1a 35%,#3d0e17 100%)}
.nav{position:absolute;left:12px;top:12px;width:1000px;height:110px;border-radius:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 18px;
  background:linear-gradient(180deg,#8e1a2c 0%,#6a0f1f 30%,#4b0915 70%,#5d0c1a 100%);
  border:2.5px solid #e6b866;box-shadow:0 0 0 1px rgba(255,230,170,.5),0 0 16px rgba(255,200,120,.45),0 -6px 18px rgba(60,5,15,.35),inset 0 2px 2px rgba(255,170,180,.35)}
.nav:before{content:'';position:absolute;left:20px;right:20px;top:3px;height:40%;border-radius:40px 40px 10px 10px;background:linear-gradient(180deg,rgba(255,180,190,.18),rgba(255,255,255,0));pointer-events:none}
.nv{position:relative;width:104px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:#fff;font:400 17px/1 var(--sans);border-radius:20px;white-space:nowrap}
.nv svg.i{font-size:38px;stroke-width:1.9;color:#fff}
.nv.chart svg.i{color:#f2c56a}
.nv.on{width:106px;background:linear-gradient(180deg,#a31a2e 0%,#7c0f20 50%,#650b1a 100%);border:2px solid #f0c06e;
  box-shadow:0 0 12px rgba(255,190,110,.75),inset 0 0 10px rgba(255,140,150,.45)}
.nv.on svg.i,.nv.on span{color:#ffe7b5}
.nv.on span{color:#fff2d6}
.home-ind{position:absolute;left:364px;bottom:12px;width:298px;height:7px;border-radius:4px;background:#fff}

/* hide simulated phone chrome on real touch phones (the phone draws its own) */
@media (pointer:coarse) and (max-width:600px){.status,.home-ind{display:none}}

/* small feedback toast */
.toast{position:fixed;left:50%;bottom:calc(var(--dockH,110px) + 14px);transform:translateX(-50%) translateY(10px);opacity:0;z-index:30;
  max-width:88vw;padding:10px 16px;border-radius:14px;background:rgba(60,8,18,.92);color:#fff4df;font:600 14px/1.3 var(--sans);
  border:1px solid #d9a95a;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
button:active{filter:brightness(.96);transform:translateY(1px)}

/* ================= DESKTOP (same file, same sections, same order) ================= */
html.desk,html.desk body{height:100%;overflow:hidden}
html.desk #stage{height:100vh!important}
html.desk .status,html.desk .home-ind,html.desk .dock-bg{display:none}
html.desk .top{width:100%!important}
@media (hover:hover){button:hover{filter:brightness(1.06)}.tile:hover,.qa:hover,.act:hover,.ev:hover{transform:translateY(-2px);transition:transform .18s}}

/* ================= SMOOTH PAGE-TO-PAGE TRANSITION (shared by all CRM pages) ================= */
@view-transition{navigation:auto}
body{background:#efc19c}
#dock{view-transition-name:crm-dock}
::view-transition-old(root){animation:crmOut .22s ease both}
::view-transition-new(root){animation:crmIn .36s cubic-bezier(.2,.7,.2,1) both}
::view-transition-group(crm-dock){animation-duration:.3s}
@keyframes crmOut{to{opacity:0}}
@keyframes crmIn{from{opacity:0;transform:translateY(10px)}}
html.no-vt #stage{animation:crmIn .34s cubic-bezier(.2,.7,.2,1) both}
html.leaving #stage{opacity:0;transform:translateY(-6px);transition:opacity .17s ease,transform .17s ease}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root),html.no-vt #stage{animation:none}html.leaving #stage{transition:none}}

/* smooth navigation between CRM pages: native cross-page transition where supported, a soft fade elsewhere */
(function(){
  var root=document.documentElement,vt=('onpagereveal' in window);
  if(!vt)root.classList.add('no-vt');
  window.goTo=function(url){
    if(vt){location.href=url;return}
    root.classList.add('leaving');setTimeout(function(){location.href=url},170);
  };
  addEventListener('pageshow',function(){root.classList.remove('leaving')});
  /* nav-capture: the bottom menu always navigates, even if a page script fails */
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('.nv[data-href]');if(!b)return;e.preventDefault();e.stopPropagation();window.goTo(b.getAttribute('data-href'))},true);
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;
    var h=a.getAttribute('href');if(/^crm-[\w-]+\.html(#[\w-]+)?$/.test(h)){e.preventDefault();window.goTo(h)}
  });
})();

<script>
(function(){
  var W=1024,H=1736,DOCK=160;
  var stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),dock=document.getElementById('dock'),dockC=document.getElementById('dockCanvas');
  var rows=[].slice.call(document.querySelectorAll('[data-row]')).map(function(el){return {el:el,top:parseFloat(el.style.top),row:+el.getAttribute('data-row')}});
  var heros=[].slice.call(document.querySelectorAll('[data-hero]')).map(function(el){return {el:el,top:parseFloat(getComputedStyle(el).top)}});
  var top=document.getElementById('top');
  var root=document.documentElement;
  var tiles=[].slice.call(document.querySelectorAll('.tile')).map(function(el){var im=el.querySelector('.ph');im.dataset.il=parseFloat(im.style.left);im.dataset.it=parseFloat(im.style.top);im.dataset.iw=parseFloat(im.style.width);return {el:el,left:parseFloat(el.style.left),im:im,il:parseFloat(im.style.left),it:parseFloat(im.style.top),iw:parseFloat(im.style.width)}});
  /* снимката в плочката расте с височината ѝ (базата е 136) */
  window.NDTileImg=function(im,th){var s=th/136;im.style.width=(+im.dataset.iw*s)+'px';im.style.left=(484-(484-(+im.dataset.il))*s)+'px';im.style.top=(+im.dataset.it*s)+'px'};
  var panels=[].slice.call(document.querySelectorAll('.panel[data-row]'));
  var hdr={photo:top.querySelector('.photo'),ctrls:[].slice.call(top.querySelectorAll('.ctrl,.avatar'))};
  function isDesk(){return root.clientWidth>=1024&&root.clientWidth/innerHeight>=1.2}
  function fitDesk(){
    var vw=(root.clientWidth-(window.NDRAIL||0)),vh=innerHeight,BW=2072,BH=1173;
    var k=Math.min(vw/BW,vh/BH),W=vw/k,Hc=vh/k,exH=Hc-BH,exW=W-BW;
    var Hh=400+Math.min(exH*.5,160);
    var G=24+Math.min(exW*.15,80),xL=(W-2000-G)/2,xR=xL+1000+G;
    var C=Hc-Hh-16-(window.NDRAIL?24:162);                       /* height for the two columns above the navigation */
    var gv=Math.max(16,Math.min((C-536)/2,90)),yR=Hh+16+Math.max(0,(C-536-2*gv)/2);
    var th=Math.max(136,Math.min((C-132-2*gv)/2,330)),yL=Hh+16+Math.max(0,(C-(2*th+132+2*gv))/2);
    canvas.style.width=W+'px';canvas.style.height=Hc+'px';canvas.style.left='0px';canvas.style.top='0px';canvas.style.transform='none';canvas.style.zoom=k;
    top.style.height=Hh+'px';
    heros.forEach(function(o){o.el.style.top=(o.top+(Hh-380)*.75)+'px'});
    var ph=Hh*1.55,pw=ph*1.777;hdr.photo.style.width=pw+'px';hdr.photo.style.left=(W-pw+20)+'px';hdr.photo.style.top=(30-.16*ph)+'px';
    hdr.ctrls.forEach(function(el){if(el.dataset.l==null)el.dataset.l=parseFloat(getComputedStyle(el).left);el.style.left=(W-1024+(+el.dataset.l))+'px'});
    var s=th/136;
    tiles.forEach(function(o){
      var row=+o.el.getAttribute('data-row');
      o.el.style.left=(xL+(o.left-12))+'px';o.el.style.top=(yL+(row-1)*(th+gv))+'px';o.el.style.setProperty('--th',th+'px');
      o.im.style.width=(o.iw*s)+'px';o.im.style.left=(484-(484-o.il)*s)+'px';o.im.style.top=(o.it*s)+'px'});
    var qa=panels[0];qa.style.left=xL+'px';qa.style.top=(yL+2*th+2*gv)+'px';
    var y=yR;[panels[1],panels[2],panels[3]].forEach(function(el){el.style.left=xR+'px';el.style.top=y+'px';y+=el.offsetHeight+gv});
    dockC.style.transform='scale('+k+')';dockC.style.left=((vw-1024*k)/2)+'px';
    dock.style.height=(DOCK*k)+'px';root.style.setProperty('--dockH',(window.NDRAIL?0:118*k)+'px');
  }
  function clearDesk(){
    canvas.style.width='';top.style.height='';hdr.photo.style.left=hdr.photo.style.top=hdr.photo.style.width='';
    hdr.ctrls.forEach(function(el){el.style.left=''});
    tiles.forEach(function(o){o.el.style.left=o.left+'px';o.el.style.removeProperty('--th');window.NDTileImg(o.im,parseFloat(getComputedStyle(o.el).getPropertyValue('--th'))||236)});
    panels.forEach(function(el){el.style.left=''});
  }
  /* приложение на началния екран: височината под часовника/батерията (CSS --sat от crm-blend.css) */
  function safeTop(){var p=document.createElement('div');p.style.cssText='position:fixed;top:0;left:0;width:1px;height:var(--sat,0px);visibility:hidden;pointer-events:none';document.body.appendChild(p);var v=p.offsetHeight||0;p.remove();return v}
  function fit(){
    var desk=isDesk();root.classList.toggle('desk',desk);
    if(desk){fitDesk();return}
    clearDesk();
    var vw=document.documentElement.clientWidth;
    var k=vw/W, sat=safeTop(), vh=window.innerHeight-sat;
    /* taller phones: grow the hero photo first, then open up the gaps between sections; what is left is spread too – no empty field above the menu */
    var extra=Math.max(0,vh/k-H), h=Math.min(extra*.45,140), g=Math.min((extra-h)/7,42);
    var rest=extra-h-7*g; if(rest>0){var g2=Math.min(rest/7,40);g+=g2;rest-=7*g2;if(rest>0)h+=Math.min(rest,120)}
    top.style.height=(380+h)+'px';
    heros.forEach(function(o){o.el.style.top=(o.top+h)+'px'});
    rows.forEach(function(o){o.el.style.top=(o.top+h+g*o.row)+'px'});
    var endH=1567+h+g*7+26;
    canvas.style.height=endH+'px';
    canvas.style.transform='none';canvas.style.zoom=k;
    canvas.style.top=(sat/k)+'px';
    dockC.style.transform='scale('+k+')';
    var offset=(document.documentElement.clientWidth-vw)/2;
    canvas.style.left=offset+'px';dockC.style.left=offset+'px';
    var dockH=DOCK*k;
    stage.style.height=Math.max(endH*k+dockH-40*k,vh)+'px';
    dock.style.height=dockH+'px';
    document.documentElement.style.setProperty('--dockH',(118*k)+'px');
  }
  fit();addEventListener('resize',fit);addEventListener('orientationchange',fit);

  /* today's date in the overview pill and the calendar card */
  try{
    var d=new Date(),dd=('0'+d.getDate()).slice(-2),mm=('0'+(d.getMonth()+1)).slice(-2);
    var wd=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()];
    var mn=['Ян','Фев','Март','Апр','Май','Юни','Юли','Авг','Сеп','Окт','Ноем','Дек'][d.getMonth()];
    document.getElementById('today').textContent=dd+'.'+mm+'.'+d.getFullYear()+' г.';
    document.getElementById('dw').textContent=wd;document.getElementById('dd').textContent=dd;document.getElementById('dm').textContent=mn;
  }catch(e){}

  /* demo feedback — replace with real CRM routes */
  var t=document.getElementById('toast'),timer;
  function say(s){t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){t.classList.remove('show')},2200)}
  document.querySelectorAll('[data-msg]').forEach(function(b){b.addEventListener('click',function(){say(b.getAttribute('data-msg'))})});
  document.querySelectorAll('[data-href]').forEach(function(b){b.addEventListener('click',function(e){e.stopImmediatePropagation();window.goTo(b.getAttribute('data-href'))},true)});
  document.querySelectorAll('[data-nav]').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('.nv').forEach(function(x){x.classList.remove('on');x.removeAttribute('aria-current')});
    b.classList.add('on');b.setAttribute('aria-current','page');say(b.getAttribute('data-nav'));
  })});
})();
</script>

<script>
/* CRM Начало — real numbers, today's calendar and latest activity from the database */
(function(){
  var U=window.NDUI,esc=U.esc,q=function(s){return document.querySelector(s)},qa=function(s){return [].slice.call(document.querySelectorAll(s))};
  function iso(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function ago(t){var m=Math.round((Date.now()-new Date(t))/6e4);if(isNaN(m))return '';if(m<1)return 'сега';if(m<60)return 'преди '+m+' мин';var h=Math.round(m/60);if(h<24)return 'преди '+h+' ч';var d=Math.round(h/24);return d===1?'вчера':'преди '+d+' дни'}
  function link(el,href){el.removeAttribute('data-msg');el.setAttribute('data-go',href)}
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-go]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();window.goTo(b.getAttribute('data-go'))},true);
  /* quick actions open the real forms */
  qa('.qa[data-href="crm-klienti.html"]').forEach(function(b){b.setAttribute('data-href','crm-klienti.html#new');b.removeAttribute('data-href');b.setAttribute('data-go','crm-klienti.html#new')});
  qa('.qa[data-href="crm-imoti.html"]').forEach(function(b){b.removeAttribute('data-href');b.setAttribute('data-go','crm-imoti.html#new')});
  /* date pill: pick a date and open that week in the calendar */
  var dp=q('.datepill');
  if(dp){dp.removeAttribute('data-msg');var inp=document.createElement('input');inp.type='date';inp.value=iso();inp.setAttribute('aria-label','Избор на дата');
    inp.style.cssText='position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer';dp.style.position=dp.style.position||'absolute';dp.appendChild(inp);
    inp.addEventListener('change',function(){if(inp.value)window.goTo('crm-kalendar.html#d='+inp.value)});}
  var evs=qa('.panel .ev'),acts=qa('.panel .act');
  evs.forEach(function(b){b.style.visibility='hidden'});acts.forEach(function(b){b.style.visibility='hidden'});
  var mets=qa('.metric b');mets.forEach(function(b){b.textContent='…'});
  ND.ready().then(function(){return Promise.all([ND.load('properties'),ND.load('clients'),ND.load('deals'),ND.load('events'),ND.load('activities')])}).then(function(r){
    var pr=r[0],cl=r[1],dl=r[2],ev=r[3],ac=r[4];
    var won=dl.filter(function(d){return d.stage==='Приключена'}).length,lost=dl.filter(function(d){return d.stage==='Отказана'}).length;
    var vals=[pr.filter(function(p){return ['Архивиран','Продаден'].indexOf(p.status)<0}).length,cl.length,dl.length,won+lost?Math.round(won*100/(won+lost))+'%':'—'];
    mets.forEach(function(b,i){b.textContent=typeof vals[i]==='number'?new Intl.NumberFormat('fr-FR').format(vals[i]).replace(/\u202f|\u00a0/g,' '):vals[i]});
    /* today, otherwise the next upcoming events */
    var t=iso(),list=ev.filter(function(e){return e.date===t});var label='';
    if(!list.length){list=ev.filter(function(e){return e.date>t});label='next'}
    list.sort(function(a,b){return (a.date+(a.from||'')).localeCompare(b.date+(b.from||''))});
    evs.forEach(function(b,i){var e=list[i];b.style.visibility='';
      if(!e){if(i===0){b.querySelector('.t').textContent='';b.querySelector('.n').textContent='Няма събития днес';b.querySelector('.c').textContent='';link(b,'crm-kalendar.html')}else b.style.visibility='hidden';return}
      b.querySelector('.t').textContent=label?U.bgDate(e.date+'T00:00').slice(0,5):(e.from||'');b.querySelector('.n').textContent=e.title||'';
      b.querySelector('.c').textContent=e.client||(e.prop||'').split('·').pop().trim();link(b,'crm-kalendar.html#d='+e.date)});
    /* latest activity: client log + property log */
    var all=ac.map(function(a){return {t:a.at||a._created||a._updated,b:a.text,s:a.client||'',go:a.client_id?'crm-klienti.html#'+a.client_id:'crm-klienti.html'}});
    pr.forEach(function(p){(p.log||[]).forEach(function(l){all.push({t:l.at,b:l.text,s:(p.title||'')+(p.price?' – € '+new Intl.NumberFormat('fr-FR').format(p.price).replace(/\u202f|\u00a0/g,' '):''),go:'crm-imoti.html#'+p.id})})});
    all.sort(function(a,b){return String(b.t).localeCompare(String(a.t))});
    acts.forEach(function(b,i){var a=all[i];b.style.visibility='';
      if(!a){if(i===0){b.querySelector('.tx b').textContent='Още няма дейности';b.querySelector('.tx span').textContent='Добавете клиент или имот';b.querySelector('.tm').textContent='';link(b,'crm-klienti.html#new')}else b.style.visibility='hidden';return}
      b.querySelector('.tx b').textContent=a.b;b.querySelector('.tx span').textContent=a.s;b.querySelector('.tm').textContent=ago(a.t);b.removeAttribute('data-href');link(b,a.go)});
  }).catch(function(e){ND.say('Грешка при зареждане: '+(e&&e.message||e))});
})();
</script>
<script>
/* Вариант 3: стъкленото пано обгръща плочките и панелите; на компютър панелите текат свободно (по-едър текст),
   затова тук се подреждат по височина в мястото под шапката. Изпълнява се след основното оразмеряване. */
(function(){
  var root=document.documentElement,canvas=document.getElementById('canvas'),top=document.getElementById('top'),glass=document.querySelector('.v3-glass');
  if(!glass||!top)return;
  var tiles=[].slice.call(document.querySelectorAll('.tile[data-row]')),panels=[].slice.call(document.querySelectorAll('.panel[data-row]'));
  function place(){
    var right=panels.slice(1);
    right.forEach(function(p){p.style.minHeight=''});
    if(root.classList.contains('desk')){
      var Hh=top.offsetHeight,Hc=canvas.offsetHeight,bot=Hc-(window.NDRAIL?18:150),P=22,g=16;
      var xL=panels[0].offsetLeft,xR=panels[1].offsetLeft,gT=Hh+8,Y0=gT+P,S=bot-P-Y0;
      var sum=function(){return right.reduce(function(a,p){return a+p.offsetHeight},0)};
      canvas.classList.remove('v3-tight');
      if(sum()+2*g>S)canvas.classList.add('v3-tight');
      var hs=sum(),free=S-hs,gg=Math.max(12,Math.min(g,free/2)),extra=Math.max(0,free-2*gg),y=Y0;
      right.forEach(function(p){var h=p.offsetHeight+extra/right.length;if(extra>0)p.style.minHeight=h+'px';p.style.top=y+'px';y+=p.offsetHeight+gg});
      var qa=panels[0],hq=qa.offsetHeight,th=Math.max(150,Math.floor((S-hq-2*g)/2));
      tiles.forEach(function(t){var r=+t.getAttribute('data-row');t.style.setProperty('--th',th+'px');t.style.top=(Y0+(r-1)*(th+g))+'px';var im=t.querySelector('.ph');if(im&&window.NDTileImg)window.NDTileImg(im,th)});
      qa.style.top=(Y0+2*th+2*g)+'px';
      glass.style.left=(xL-P)+'px';glass.style.top=gT+'px';glass.style.width=(xR+1000+2*P-xL)+'px';glass.style.height=(bot-gT)+'px';
    }else{
      canvas.classList.remove('v3-tight');
      var t0=tiles[0].offsetTop,last=panels[panels.length-1],b=last.offsetTop+last.offsetHeight;
      glass.style.left='8px';glass.style.width='1008px';glass.style.top=(t0-26)+'px';glass.style.height=(b-t0+52)+'px';
    }
  }
  /* празни блокове не се показват: показател със стойност „—“ (напр. Успеваемост без приключени сделки) */
  function empties(){[].forEach.call(document.querySelectorAll('.metric'),function(m){var b=m.querySelector('b');m.classList.toggle('v3-empty',!!b&&/^[—–-]$/.test(b.textContent.trim()))})}
  var raf=0;function again(){cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){empties();place()})}
  if(window.MutationObserver)new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){var t=ms[i].target;t=t.nodeType===1?t:t.parentNode;if(t&&t.closest&&t.closest('.ev,.act,.metric')){again();return}}})
    .observe(canvas,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['style']});
  empties();place();addEventListener('resize',place);addEventListener('orientationchange',function(){setTimeout(place,60)});addEventListener('load',place);
  setTimeout(place,400);setTimeout(place,1500);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
})();
</script>
