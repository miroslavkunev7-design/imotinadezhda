const memoryStore={};
function readStore(key,fallback){try{return JSON.parse(localStorage.getItem(key))||memoryStore[key]||fallback}catch{return memoryStore[key]||fallback}}
function writeStore(key,value){memoryStore[key]=value;try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function LiveComponent({component,...props}){return component(props)}
function CrmAssistant(){
 const initial=[{role:'assistant',text:'Здравейте! Аз съм Аш Асистент — помощник за ежедневната работа с клиенти и имоти. Работя с реалните данни в CRM: клиенти, имоти, огледи, сделки и изчисления. Какво да свърша?',time:new Date().toISOString()}];
 const [messages,setMessages]=useState(()=>readStore('crm-assistant-conversation',initial));const [open,setOpen]=useState(false);const [maximized,setMaximized]=useState(false);const [value,setValue]=useState('');const [menu,setMenu]=useState(false);const [files,setFiles]=useState([]);const inputRef=useRef(null);const fileRef=useRef(null);const cameraRef=useRef(null);const bottomRef=useRef(null);
 useEffect(()=>{writeStore('crm-assistant-conversation',messages)},[messages]);useEffect(()=>{if(open)bottomRef.current?.scrollIntoView({behavior:'smooth',block:'end'})},[messages,open]);
 const addMessage=(role,text,attachments=[])=>({role,text,attachments:attachments.map(f=>({name:f.name,type:f.type})),time:new Date().toISOString()});
 const handleFileList=list=>{const added=Array.from(list||[]);if(!added.length)return;setFiles(old=>[...old,...added]);setMenu(false)};
 const respond=(text)=>{const lower=text.toLocaleLowerCase('bg');let reply='Разбрах задачата. В тази демо версия мога да подготвя съдържание и да запазя разговор/чернови локално. За реално публикуване, промяна на база данни или изпращане е нужна свързана CRM услуга.';
  if(/договор|предварителен/.test(lower)){const draft='ЧЕРНОВА — ПРЕДВАРИТЕЛЕН ДОГОВОР\n\nСтрани: [попълнете данните на купувача и продавача]\nИмот: [адрес, идентификатор и описание]\nЦена и депозит: [договорени суми и срокове]\nСрок за окончателен договор: [дата]\n\nТова е ориентировъчна структура, не правен документ. Проверете собствеността, тежестите, идентификаторите и клаузите с адвокат/нотариус преди подписване.';writeStore('crm-assistant-drafts',[{id:Date.now(),type:'contract',text:draft},...readStore('crm-assistant-drafts',[])]);reply='Подготвих структура за чернова и я запазих в локалната памет на асистента. Изпратете данните на страните, имота, цената, депозита и сроковете, за да я попълня. Важните клаузи трябва да бъдат прегледани от адвокат/нотариус.'}
  else if(/добави клиент|създай клиент|нов клиент/.test(lower)){const name=(text.match(/(?:име|клиент)\s*[:：-]\s*([^,;\n]+)/i)||[])[1];const phone=(text.match(/(?:тел(?:ефон)?\s*[:：-]\s*)?((?:\+?359|0)\s*8[7-9][\d\s().-]{6,})/i)||[])[1];if(name&&phone){const rows=readStore('crm-clients',[]);const row=[name.trim(),phone.trim(),'Апартамент','Бургас, Център','0',0];const updated=[...rows,row];writeStore('crm-clients',updated);window.dispatchEvent(new CustomEvent('crm-clients-updated',{detail:updated}));reply='Добавих клиента „'+name.trim()+'“ в локалната CRM база. Отворете Клиенти, за да прегледате и допълните данните.'}else reply='Мога да добавя клиента в локалната демо база. Изпратете го като „добави клиент; име: …; телефон: …; град: …; квартал: …“. Проверете данните преди запис.'}
  else if(/цена|публикува|архивира|имот/.test(lower)){const actions=readStore('crm-assistant-actions',[]);writeStore('crm-assistant-actions',[{id:Date.now(),request:text,status:'Чернова — чака проверка'},...actions]);reply='Записах заявката като чернова за имот и я оставих за проверка. В тази версия няма връзка към публикуваните обяви, затова не мога да променя реална цена, да публикувам или архивирам автоматично. Посочете ID на имота и желаната стойност, за да подготвя точните данни за промяната.'}
  else if(/прав|юрид|закон|вратич|схем/.test(lower)){reply='Мога да помогна с обща информация за процеса по сделка, проверки и документи, но не замествам адвокат или нотариус. Не съдействам за заобикаляне на закона, укриване на информация или измамни практики. Опишете казуса и ще подредя законните стъпки и въпросите за юрист.'}
  else if(/файл|снимк|прикач/.test(lower)){reply='Виждам прикачения материал. Мога да помогна с обобщение и извличане на видим текст, ако го поставите в съобщението. Не мога да потвърдя автентичност или правна валидност на документ само по файл.'}
  else if(/помощ|можеш|умее/.test(lower)){reply='Мога да помагам с текстове на обяви, описания, чеклисти за оглед и документи, подготовка на клиентски бележки, план за последващ контакт, резюме на файлове и обща информация за процеса на сделка. Записите в момента са локални демо-данни; реални CRM промени и публикации изискват backend интеграция.'}
  else if(/обяв|описан/.test(lower)){reply='Ето структура за продаващо, коректно описание: 1) тип и площ; 2) квартал и локация; 3) разпределение и състояние; 4) реални предимства; 5) цена и условия; 6) ясен призив за оглед. Изпратете характеристиките и ще напиша конкретен текст без непотвърдени твърдения.'}
  return reply;
 };
 const [thinking,setThinking]=useState(false);
 const send=(override)=>{const text=(override??value).trim();if((!text&&!files.length)||thinking)return;const attachments=files;const userMsg=addMessage('user',text||'Прикачени файлове',attachments);setMessages(old=>[...old,userMsg]);setValue('');setFiles([]);setMenu(false);setThinking(true);
  const toData=f=>new Promise(ok=>{if(!/^image\/|application\/pdf/.test(f.type))return ok(null);const r=new FileReader();r.onload=()=>{if(f.type==='application/pdf')return ok({mime:f.type,data:String(r.result).split(',')[1]});const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok({mime:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]})};im.onerror=()=>ok(null);im.src=r.result};r.onerror=()=>ok(null);r.readAsDataURL(f)});
  Promise.all(attachments.map(toData)).then(fd=>{const hist=[...messages.slice(1),userMsg].slice(-15).map(m=>({role:m.role,text:m.text}));const last=hist[hist.length-1];last.files=fd.filter(Boolean);if(last.text==='Прикачени файлове')last.text='Анализирай прикачените файлове.';
   const ask=window.NDAsh?window.NDAsh.ask(hist):Promise.resolve({ok:false,error:'Асистентът се зарежда – опитайте след секунда.'});
   return ask.then(j=>{setThinking(false);setMessages(old=>[...old,addMessage('assistant',j.ok?(j.text+(j.staff?'':'\n\n(За работа с CRM данните влезте в CRM: imotinadezhda.bg/mobile/crm/)')):(j.error||'Грешка при връзка с асистента.'))])})}).catch(()=>setThinking(false))};
 const quick=['Напиши обява','Добави клиент','Чернова на договор','Помощ с оглед'];
 return <><button className="crm-assistant-fab" style={{position:'fixed',right:20,bottom:20,zIndex:60,width:62,height:62,borderRadius:'50%',border:0,padding:0,display:'grid',placeItems:'center',cursor:'pointer',background:'radial-gradient(circle at 35% 28%,#b0213f,#7a0f22 55%,#4a0613)',boxShadow:'0 0 0 2px #edc47a,0 0 18px rgba(255,190,120,.75),0 8px 18px rgba(40,4,12,.45)'}} aria-label="Отвори Аш Асистент" title="Аш Асистент" onClick={()=>setOpen(true)}><img src="/mobile/crm/assets/ash-bot.png" alt="" style={{width:'72%',height:'72%',objectFit:'contain'}}/></button>{open&&<section className={'crm-assistant-window '+(maximized?'is-maximized':'')} role="dialog" aria-modal="false" aria-label="Аш Асистент"><header className="crm-assistant-head"><span className="crm-assistant-avatar" style={{background:'radial-gradient(circle at 35% 28%,#b0213f,#7a0f22 55%,#4a0613)'}}><img src="/mobile/crm/assets/ash-bot.png" alt="" style={{width:'78%',height:'78%',objectFit:'contain'}}/></span><div className="crm-assistant-heading"><strong>Аш Асистент</strong><small>Свързан с CRM · Имоти Надежда</small></div><button aria-label={maximized?'Възстанови размера':'Разгъни на цял екран'} title={maximized?'Възстанови размера':'Разгъни на цял екран'} onClick={()=>setMaximized(v=>!v)}><Icon name="area"/></button><button aria-label="Затвори чата" title="Затвори" onClick={()=>{setOpen(false);setMaximized(false)}}><Icon name="close"/></button></header><div className="crm-assistant-messages">{messages.map((m,i)=><div key={i} className={'crm-assistant-msg '+m.role}>{m.text}{m.attachments?.map((f,j)=><span key={j} className="crm-assistant-attachment"><Icon name="file"/>{f.name}</span>)}<time>{new Date(m.time).toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'})}</time></div>)}{thinking&&<div className="crm-assistant-msg assistant">Мисля…</div>}<div ref={bottomRef}/></div><div className="crm-assistant-quick">{quick.map(q=><button key={q} onClick={()=>{setValue(q);inputRef.current?.focus()}}>{     .crm-action-btn{background:#fff;border:1px solid #d4a34355;border-radius:20px;padding:12px 22px;display:flex;align-items:center;gap:10px;color:#510b19;font-weight:bold;box-shadow:0 5px 15px rgba(166,93,23,0.08);transition:0.2s}

  `}</style><aside className="crm-sidebar"><div className="crm-sidebar-logo"><img src={ASSETS.logo} alt="Недвижими имоти ИЛДЖ.ИА" className="w-full"/></div><nav>{navItems.map(item=><div key={item.id} onClick={()=>item.id==='clients'?navigate('/crm/clients'):null} className={'crm-nav-item '+(item.active?'active':'')}><Icon name={item.icon} className="w-7 h-7"/><span>{item.label}</span></div>)}<div className="mt-10 pt-6 border-t border-white/10"><div className="crm-nav-item" onClick={()=>navigate('/')}><Icon name="close" className="w-7 h-7"/><span>Изход</span></div></div></nav></aside><main className="crm-content"><header className="crm-header"><div className="crm-header-text"><h1 className="text-7xl font-serif text-[#510b19] font-bold mb-3">Начало</h1><p className="text-2xl text-[#230508]/80 font-medium">Управление на клиенти, имоти, сделки и финанси</p></div></header><div className="px-10 -mt-20 relative z-20 grid grid-cols-4 gap-5">{stats.map(s=><div key={s.label} className="crm-stat-card"><div className="text-[#510b19]"><Icon name={s.icon} className="w-14 h-14" strokeWidth="1"/></div><div className="flex-1"><p className="text-[#510b19]/60 font-bold text-lg mb-1">{s.label}</p><div className="flex items-center"><span className="text-4xl font-bold text-[#230508]">{s.val}</span>{s.inc&&<span className={'stat-inc '+s.color}>↑ {s.inc}</span>}{s.sub&&<span className={'stat-sub '+s.color}>{s.sub}</span>}</div></div></div>)}</div><div className="px-10 mt-10 grid grid-cols-4 gap-6">{mainCards.map(c=><div key={c.label} onClick={()=>c.label==='Клиенти'?navigate('/crm/clients'):null} className="crm-main-card"><img src={c.img} alt={c.label}/><div className="crm-main-card-overlay"><div><Icon name={c.icon} className="w-14 h-14 text-[#d4a343] mb-3"/><h3 className="text-4xl font-bold font-serif mb-1">{c.label}</h3><p className="text-lg opacity-90 mb-4">{c.sub}</p></div><div className="circle-arrow"><Icon name="right" className="w-6 h-6"/></div></div></div>)}</div><div className="px-10 mt-10 mb-16 flex flex-wrap gap-4">{actions.map(a=><button key={a.label} className="crm-action-btn"><Icon name={a.icon} className="w-6 h-6 text-[#d4a343] stroke-2"/>{a.label}</button>)}</div></main><CrmAssistant/></div>}
 function Home(){return <main className="home-shell"><section className="home-hero"><img className="home-photo" src={city.slug==='burgas'?ASSETS.aerial:city.card} alt={'Панорама към '+city.name}/>{Brand()}{Nav()}<div className="home-city"><p className="eyebrow">ЗА ГРАДА</p><h1>{city.name}</h1><p className="city-description">{city.description}</p><div className="city-stats">{[{icon:'people',a:city.slug==='burgas'?'~210 000':city.slug==='varna'?'~320 000':city.slug==='shumen'?'~70 000':'~11 000',b:'жители'},{icon:'grid',a:city.slug==='burgas'?'253 km²':city.slug==='varna'?'238 km²':city.slug==='shumen'?'136 km²':'37 km²',b:'площ'},{icon:'pin',a:city.slug==='burgas'?'Югоизточен':'Североизточен',b:'регион'},{icon:'buildings',a:city.slug==='burgas'?'850+':'Очаквайте',b:'активни имота'}].map(s=><div className="city-stat" key={s.a}><Icon name={s.icon}/><span>{s.a}</span><span>{s.b}</span></div>)}</div></div>{SearchBar({})}</section><section className="neighborhood-panel marble-surface"><div className="neighborhood-intro"><h2>Избери <small>квартал</small><span className="intro-line">в гр. {city.name}</span></h2><button className="wine-button" onClick={()=>setModal('neighborhoods')}>Виж всички<br/>квартали<Icon name="right"/></button></div>{neighborhoods.map(n=><NeighborhoodCard n={n} key={n.slug}/>)}</section></main>}

 function TerraceHero({detail=false}){return <header className={'terrace-hero '+(detail?'detail-hero':'')}><img className="terrace-photo" src={detail?ASSETS.sunset:ASSETS.hero} style={{objectFit:'cover',objectPosition:detail?'center 65%':'center 70%'}} alt={detail?'Панорама към Моста и Морската градина на Бургас':'Луксозна тераса с панорамна гледка към Бургас и морето'}/>{Brand()}{Nav()}{SearchBar({detail})}</header>}
 function Breadcrumb({detail=false}){return <div className={'breadcrumb '+(detail?'detail-breadcrumb':'listing-breadcrumb')}><a href="#/">Начало</a><Icon name="chevron"/><a href={'#/city/'+city.slug}>{city.name}</a><Icon name="chevron"/><a href={'#/neighborhood/'+city.slug+'/'+(neighborhoods.find(n=>n.name===selectedNeighborhood)?.slug||'lazur')}>{selectedNeighborhood}</a>{detail&&<><Icon name="chevron"/><span>{activeProperty.title}</span></>}</div>}
 function PropertyCard({p}){return <article className="property-card" tabIndex="0" onClick={()=>navigate('/property/'+p.id+'/'+city.slug)} onKeyDown={e=>{if(e.key==='Enter')navigate('/property/'+p.id+'/'+city.slug)}} aria-label={p.name+', '+money(p.price)+' евро'}><div className="property-image"><img src={p.img} alt={p.name}/>{p.badge&&<span className="badge">{p.badge}</span>}<button className={'heart-button '+(favorites.includes(p.id)?'is-favorite':'')} onClick={e=>{e.stopPropagation();toggleFavorite(p.id)}} aria-label="Добави в любими"><Icon name="heart"/></button></div><div className="property-copy"><h3>{p.name}</h3><p className="property-location"><Icon name="pin"/>{selectedNeighborhood}, гр. {city.name}</p><div className="property-features"><span><Icon name="calendar"/>{p.area} м²</span><span><Icon name="bed"/>{p.rooms}</span><span><Icon name="user"/>{p.baths}</span></div><div className="property-price">€ {money(transaction==='rent'?Math.round(p.price/230):p.price)}{transaction==='rent'&&<small style={{fontSize:12}}> / месец</small>}</div></div><span className="gold-sparkles"/></article>}
 function FilterContents({inModal=false}){return <><div className="filter-section"><h4>Тип имот</h4>{['Апартамент','Многостаен','Къща','Парцел','Офис','Магазин'].map(type=><label className="check-row" key={type}><input type="checkbox" checked={filters.types.includes(type)} onChange={e=>updateFilter('types',e.target.checked?[...filters.types,type]:filters.types.filter(x=>x!==type))}/>{type}</label>)}</div><h4>Цена</h4><div className="price-row"><span>От</span><input aria-label="Минимална цена" type="number" min="0" placeholder="€" value={filters.min} onChange={e=>updateFilter('min',e.target.value)}/>{!inModal&&<input aria-label="Валута" placeholder="€" style={{width:56}} readOnly/>}</div><div className="price-row"><span>До</span><input aria-label="Максимална цена" type="number" min="0" placeholder="€" value={filters.max} onChange={e=>updateFilter('max',e.target.value)}/></div><button className="gold-button" onClick={search}>Приложи филтрите</button></>}
 function DynamicDistrictMap({city,neighborhood}){const mapRef=useRef(null);const [mapError,setMapError]=useState('');useEffect(()=>{let cancelled=false;let map=null;const loadLeaflet=()=>new Promise((resolve,reject)=>{if(window.L){resolve(window.L);return}let css=document.querySelector('link[data-leaflet-css]');if(!css){css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';css.dataset.leafletCss='true';document.head.appendChild(css)}let script=document.querySelector('script[data-leaflet-js]');if(script){script.addEventListener('load',()=>resolve(window.L),{once:true});script.addEventListener('error',reject,{once:true});if(window.L)resolve(window.L);return}script=document.createElement('script');script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.dataset.leafletJs='true';script.onload=()=>resolve(window.L);script.onerror=reject;document.body.appendChild(script)});const draw=async()=>{try{const L=await loadLeaflet();if(cancelled||!mapRef.current)return;map=L.map(mapRef.current,{scrollWheelZoom:false,zoomControl:true}).setView([42.5,27.47],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);const query=encodeURIComponent(neighborhood+', '+city.name+', Bulgaria');let response=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&polygon_geojson=1&addressdetails=1&limit=1&q='+query,{headers:{'Accept-Language':'bg'}});let results=await response.json();let result=results.find(x=>x.geojson&&['Polygon','MultiPolygon'].includes(x.geojson.type));if(!result){response=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&polygon_geojson=1&addressdetails=1&limit=1&q='+encodeURIComponent(city.name+', Bulgaria'),{headers:{'Accept-Language':'bg'}});results=await response.json();result=results.find(x=>x.geojson&&['Polygon','MultiPolygon'].includes(x.geojson.type))}if(cancelled)return;if(result){const boundary=L.geoJSON(result.geojson,{style:{color:'#a3072d',weight:4,opacity:.95,fillColor:'#d49b39',fillOpacity:.2}}).addTo(map);map.fitBounds(boundary.getBounds(),{padding:[24,24],maxZoom:15});boundary.bindPopup('<strong>'+neighborhood+', '+city.name+'</strong>')}else{response=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+query,{headers:{'Accept-Language':'bg'}});results=await response.json();if(results[0]){const {lat,lon}=results[0];map.setView([Number(lat),Number(lon)],14);L.circle([Number(lat),Number(lon)],{radius:900,color:'#a3072d',weight:3,fillColor:'#d49b39',fillOpacity:.16}).addTo(map).bindPopup('<strong>'+neighborhood+', '+city.name+'</strong>')}else setMapError('Не е намерена карта за този квартал.')}setTimeout(()=>{if(!cancelled)map.invalidateSize()},100)}catch(error){if(!cancelled)setMapError('Картата временно не е достъпна.')}};draw();return()=>{cancelled=true;if(map){map.remove();map=null}}},[city.slug,city.name,neighborhood]);return <div style={{flex:'1 1 auto',minHeight:360,position:'relative'}}><div ref={mapRef} role="img" aria-label={'Карта с очертан квартал '+neighborhood+', '+city.name} style={{position:'absolute',inset:0,width:'100%',height:'100%'}}/>{mapError&&<div style={{position:'absolute',zIndex:500,top:10,left:10,right:10,background:'#fffaf0',border:'1px solid #d4a343',borderRadius:8,padding:10,color:'#50191c',fontSize:13}}>{mapError}</div>}</div>}
 function Listing(){return <>{TerraceHero({})}<main className="listing-layout"><aside className="quick-filters wine-surface"><h3>Бързи филтри</h3>{FilterContents({})}</aside><section className="listing-main"><Breadcrumb/><div className="listing-heading"><div className="listing-title"><h1>{selectedNeighborhood}, гр. {city.name}</h1><p>{city.slug==='burgas'?'Един от най-предпочитаните квартали в Бургас – с морска панорама и близост до Морската градина.':city.description}</p></div><div className="listing-badges"><div className="count-badge"><Icon name="home"/><span><strong>{appliedFilters?visibleProperties.length:(neighborhoods.find(n=>n.name===selectedNeighborhood)?.count??0)}</strong><small>имота</small></span></div><button className="favorite-neighborhood" onClick={()=>{setFavoriteNeighborhood(!favoriteNeighborhood);setToast(favoriteNeighborhood?'Кварталът е премахнат от любими':'Кварталът е добавен в любими')}}><Icon name="heart" style={{fill:favoriteNeighborhood?'#d7a146':'none'}}/><span>Добави<br/><small>в любими</small></span></button></div></div><div className="sort-bar"><div className="sort-control"><span>Сортирай по:</span><select aria-label="Сортирай обявите" value={sort} onChange={e=>setSort(e.target.value)}><option value="new">Най-нови</option><option value="price-asc">Цена: възходящо</option><option value="price-desc">Цена: низходящо</option><option value="area">Най-голяма площ</option></select></div><div className="view-switch"><button className={!listView?'active':''} aria-label="Изглед решетка" onClick={()=>setListView(false)}><Icon name="grid"/></button><button className={listView?'active':''} aria-label="Изглед списък" onClick={()=>setListView(true)}><Icon name="list"/></button></div></div>{visibleProperties.length?<div className={'property-grid '+(listView?'list-view':'')}>{visibleProperties.map(p=><PropertyCard p={p} key={p.id}/>)}</div>:<div className="empty-results"><Icon name="search"/><h3>Няма имоти с избраните критерии</h3><p>Опитайте с друг ценови диапазон или тип имот.</p><button className="wine-button" onClick={()=>{setAppliedFilters(null);setFilters({type:'Всички',price:'Без значение',area:'Без значение',min:'',max:'',types:[]})}}>Изчисти филтрите</button></div>}</section><aside className="listing-map"><DynamicDistrictMap city={city} neighborhood={selectedNeighborhood}/><div className="map-footer"><button onClick={()=>setModal('map')}><Icon name="pin"/>Виж на картата</button></div></aside></main></>}
 function Detail(){const p=activeProperty;return <>{TerraceHero({detail:true})}<main className="detail-layout"><section className="detail-main"><Breadcrumb detail/><div className="detail-title-block"><span className="badge">ТОП ОФЕРТА</span><div className="property-title-row"><h1>{p.title}</h1><div className="title-actions"><button className={favorites.includes(p.id)?'is-favorite':''} onClick={()=>toggleFavorite(p.id)}><Icon name="heart"/><span>Добави<br/>в любими</span></button><button onClick={async()=>{try{await navigator.clipboard.writeText(location.href);setToast('Линкът към имота е копиран')}catch{setModal('share')}}}><Icon name="share"/><span>Сподели</span></button></div></div><p className="property-subtitle">кв. {selectedNeighborhood}, гр. {city.name}</p><div className="detail-stats">{[{label:'Цена',icon:'pin',value:'€ '+money(p.price),price:true,small:'€ 2 450 / м²'},{label:'Площ',icon:'area',value:(p.id===1?100:p.area)+' м²',vicon:'area'},{label:'Етаж',icon:'floor',value:'8 от 9',vicon:'floor'},{label:'Стаи',icon:'rooms',value:'3',vicon:'user'},{label:'Спални',icon:'bed',value:'2',vicon:'bed'},{label:'Бани',icon:'bath',value:'1',vicon:'bath'},{label:'Изложение',icon:'sun',value:'Юг/Изток'}].map(s=><div className="detail-stat" key={s.label}><div className="stat-label"><Icon name={s.icon}/>{s.label}</div><div className={'stat-value '+(s.price?'price':'')}>{s.vicon&&<Icon name={s.vicon}/>}<span>{s.value}</span></div>{s.small&&<small>{s.small}</small>}</div>)}</div></div><div className="gallery-main" onClick={()=>setModal('gallery')}><img src={galleryImages[gallery]} alt={'Снимка '+(gallery+1)+' — '+p.title}/><button className="gallery-arrow left" aria-label="Предишна снимка" onClick={e=>{e.stopPropagation();setGallery((gallery+5)%6)}}><Icon name="chevron" style={{transform:'rotate(180deg)'}}/></button><button className="gallery-arrow right" aria-label="Следваща снимка" onClick={e=>{e.stopPropagation();setGallery((gallery+1)%6)}}><Icon name="chevron"/></button><span className="gallery-count">{gallery+1} / 18</span></div><div className="gallery-thumbs"><button className="thumb-arrow" aria-label="Предишна снимка" onClick={()=>setGallery((gallery+5)%6)}><Icon name="chevron" style={{transform:'rotate(180deg)'}}/></button>{galleryImages.map((img,i)=><button className={i===gallery?'active':''} key={img} onClick={()=>setGallery(i)} aria-label={'Отвори снимка '+(i+1)}><img src={img} alt={['Дневна','Морска панорама','Тераса','Спалня','Дневна зона','Баня'][i]}/></button>)}<button className="thumb-arrow" aria-label="Следваща снимка" onClick={()=>setGallery((gallery+1)%6)}><Icon name="chevron"/></button></div><section className="description-card wine-surface"><h2>Описание</h2><p>Предлагаме за продажба луксозен тристаен апартамент с неповторима панорамна гледка към морето и Морската градина. Имотът се намира в предпочитания квартал Лазур, в модерна сграда с контролиран достъп и отлично поддържани общи части.</p><p>Апартаментът е напълно обзаведен и оборудван с висок клас мебели и електроуреди. Просторна дневна с кухня, две спални, баня с тоалетна, тераса с гледка, която спира дъха.</p>{expanded&&<><p>Светлите помещения и югоизточното изложение осигуряват уют и естествена светлина през целия ден. Сградата разполага с асансьор, видеонаблюдение и възможност за закупуване на подземно паркомясто.</p><p>На пешеходно разстояние се намират плажът, Морската градина, магазини, училища и спирки на градския транспорт. Отличен избор както за собствен дом, така и за инвестиция.</p></>}<button className="gold-button" onClick={()=>setExpanded(!expanded)}>{expanded?'Виж по-малко':'Виж повече'}</button><div className="amenities">{[{icon:'view',text:<>Панорамна<br/>гледка</>},{icon:'terrace',text:'Тераса'},{icon:'ac',text:'Климатик'},{icon:'user',text:'Обзаведен'},{icon:'shield',text:'СОТ'},{icon:'key',text:<>Контролиран<br/>достъп</>}].map(a=><div className="amenity" key={a.icon}><Icon name={a.icon} style={{color:'var(--gold)'}}/>{a.text}</div>)}</div></section></section><aside className="detail-sidebar"><div className="agent-card wine-surface"><div className="agent-profile"><img src={ASSETS.agent} alt="Мария Иванова — старши консултант"/><div><h3>Мария Иванова</h3><p>Старши консултант</p></div></div><a className="agent-contact" href="tel:+359881234567"><Icon name="phone"/>+359 88 123 4567</a><a className="agent-contact" href="mailto:m.ivanova@ildja.bg"><Icon name="email"/>m.ivanova@ildja.bg</a><button className="gold-button" onClick={()=>setModal('viewing')}><Icon name="calendar"/>Запази час за оглед</button><button className="outline-button" onClick={()=>setModal('inquiry')}><Icon name="email"/>Запитване</button></div><section className="facts-card wine-surface"><h2>Детайли за имота</h2><dl>{[['Тип имот:','Апартамент'],['Вид строителство:','Тухла'],['Година на строителство:','2015'],['Етаж:','8 от 9'],['Асансьор:','Да'],['Отопление:','Електричество'],['Паркиране:','Възможност за покупка на подземно паркомясто'],['Мазе:','Да'],['Такса поддръжка:','€ 45 / месец']].map(([k,v])=><div className="facts-row" key={k}><dt>{k}</dt><dd>{v}</dd></div>)}</dl></section><section className="location-card subtle-card"><h2>Локация</h2><p>кв. {selectedNeighborhood}, гр. {city.name}</p><div className="small-map"><img src={ASSETS.smallMap} alt="Локация на имота на картата"/><button onClick={()=>setModal('map')}><Icon name="pin"/>Виж на картата</button></div></section></aside></main></>}
 function ContactForm({viewing=false}){const [sent,setSent]=useState(false);return sent?<div className="success-state"><Icon name="check"/><h2>{viewing?'Заявката за оглед е запазена':'Запитването е запазено'}</h2><p>Това е демонстрационна форма. За потвърждение се свържете с Мария Иванова на +359 88 123 4567.</p><button className="wine-button" onClick={()=>setModal(null)}>Затвори</button></div>:<><h2>{viewing?'Запази час за оглед':'Запитване за имота'}</h2><p>{activeProperty.title}<br/>кв. {selectedNeighborhood}, гр. {city.name} · € {money(activeProperty.price)}</p><form onSubmit={e=>{e.preventDefault();const fields=Array.from(e.currentTarget.elements).filter(x=>['INPUT','TEXTAREA','SELECT'].includes(x.tagName)).map(x=>({label:x.getAttribute('placeholder')||x.type||x.tagName,value:x.value}));writeStore('ildjia-requests',[...readStore('ildjia-requests',[]),{type:viewing?'viewing':'inquiry',property:activeProperty.id,date:new Date().toISOString(),fields}]);setSent(true)}}><div className="form-grid"><label className="form-field">Вашето име<input required placeholder="Име и фамилия" defaultValue={profile.name}/></label><label className="form-field">Телефон<input required type="tel" placeholder="+359"/></label><label className="form-field">Имейл<input required type="email" placeholder="email@example.com" defaultValue={profile.email}/></label>{viewing?<label className="form-field">Дата за оглед<input required type="date" min={new Date().toISOString().slice(0,10)}/></label>:<label className="form-field">Предпочитан контакт<select><option>По телефон</option><option>По имейл</option></select></label>}</div>{viewing&&<label className="form-field" style={{marginTop:15}}>Предпочитан час<select><option>09:00 – 11:00</option><option>11:00 – 13:00</option><option>13:00 – 15:00</option><option>15:00 – 18:00</option></select></label>}<label className="form-field" style={{marginTop:15}}>Съобщение<textarea placeholder="Вашите въпроси и предпочитания…"/></label><label className="check-row" style={{fontSize:12}}><input type="checkbox" required/>Съгласен/на съм с обработването на личните ми данни.</label><button className="gold-button form-submit"><Icon name={viewing?'calendar':'email'}/>{viewing?'Изпрати заявка за оглед':'Изпрати запитване'}</button></form></>}
 function ContractEditor(){const [data,setData]=useState({type:'Предварителен договор за покупко-продажба',buyer:profile.name,seller:'',buyerId:'',sellerId:'',address:'Апартамент, кв. '+selectedNeighborhood+', гр. Бургас',price:String(activeProperty.price),deposit:'5000',date:new Date().toISOString().slice(0,10)});const [preview,setPreview]=useState(false);const [saved,setSaved]=useState(false);const upd=(k,v)=>{setData(d=>({...d,[k]:v}));setSaved(false)};const text=`${data.type.toUpperCase()}\n\nДнес, ${data.date}, в гр. Бургас между:\n\n1. ${data.seller}, ЕГН/ЕИК: ${data.sellerId}, наричан/а по-долу „ПРОДАВАЧ / НАЕМОДАТЕЛ“,\nи\n2. ${data.buyer}, ЕГН/ЕИК: ${data.buyerId}, наричан/а по-долу „КУПУВАЧ / НАЕМАТЕЛ“,\nсе състави настоящият проект за следното:\n\nI. ПРЕДМЕТ НА ДОГОВОРА\nНедвижим имот: ${data.address}.\n\nII. ЦЕНА И ПЛАЩАНЕ\nДоговорена цена: ${money(Number(data.price))} EUR.\nДепозит / задатък: ${money(Number(data.deposit))} EUR.\nНачинът на плащане, сроковете и останалите условия се уточняват между страните преди подписване.\n\nIII. ДОПЪЛНИТЕЛНИ УСЛОВИЯ\nДокументите за собственост, тежестите, точната индивидуализация на имота и всички задължителни клаузи подлежат на правна проверка и допълване.\n\nПРОДАВАЧ / НАЕМОДАТЕЛ: _______________\n\nКУПУВАЧ / НАЕМАТЕЛ: _______________\n\nПРОЕКТ — не представлява правна консултация. Документът следва да бъде проверен от адвокат или нотариус преди подписване.`;return <><h3>Изготви проект на договор</h3><p className="fine-print">Попълнете данните и прегледайте проекта. Данните се запазват само в този браузър.</p>{!preview?<form onSubmit={e=>{e.preventDefault();setPreview(true)}}><label className="form-field">Вид договор<select value={data.type} onChange={e=>upd('type',e.target.value)}><option>Предварителен договор за покупко-продажба</option><option>Договор за наем</option><option>Договор за резервация на имот</option></select></label><div className="form-grid"><label className="form-field">Купувач / наемател<input required value={data.buyer} onChange={e=>upd('buyer',e.target.value)} placeholder="Три имена / фирма"/></label><label className="form-field">Продавач / наемодател<input required value={data.seller} onChange={e=>upd('seller',e.target.value)} placeholder="Три имена / фирма"/></label><label className="form-field">ЕГН / ЕИК на купувача<input required value={data.buyerId} onChange={e=>upd('buyerId',e.target.value)} minLength="9" maxLength="13"/></label><label className="form-field">ЕГН / ЕИК на продавача<input required value={data.sellerId} onChange={e=>upd('sellerId',e.target.value)} minLength="9" maxLength="13"/></label></div><label className="form-field" style={{marginTop:15}}>Адрес и описание на имота<textarea required value={data.address} onChange={e=>upd('address',e.target.value)}/></label><div className="form-grid"><label className="form-field">Цена (€)<input required type="number" min="1" value={data.price} onChange={e=>upd('price',e.target.value)}/></label><label className="form-field">Депозит (€)<input required type="number" min="0" value={data.deposit} onChange={e=>upd('deposit',e.target.value)}/></label></div><label className="form-field" style={{marginTop:15}}>Дата<input type="date" required value={data.date} onChange={e=>upd('date',e.target.value)}/></label><button className="gold-button form-submit"><Icon name="file"/>Преглед на договора</button></form>:<><div className="contract-preview">{text}</div><div className="contract-actions"><button className="outline-button" onClick={()=>setPreview(false)}>Редактирай</button><button className="gold-button" onClick={()=>{const blob=new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Договор-ИЛДЖИА-'+data.date+'.txt';a.click();URL.revokeObjectURL(url)}}><Icon name="download"/>Изтегли</button><button className="wine-button" onClick={()=>{if(!saved){setContracts(c=>[{id:Date.now(),type:data.type,date:data.date,text},...c]);setSaved(true);setToast('Проектът е запазен в профила')}}}><Icon name="file"/>{saved?'Запазен':'Запази'}</button></div><button className="outline-button" style={{marginTop:12,width:'100%'}} onClick={()=>window.print()}><Icon name="print"/>Печат / Запази като PDF</button></>}<p className="fine-print">Това е примерен проект, а не окончателен правен документ. Необходима е проверка от адвокат или нотариус преди подписване.</p>{contracts.length>0&&!preview&&<><h3>Запазени проекти</h3>{contracts.map(c=><div className="saved-contract" key={c.id}><span>{c.type}<br/><small>{c.date}</small></span><button className="outline-button" aria-label="Изтегли запазен договор" onClick={()=>{const url=URL.createObjectURL(new Blob(['\uFEFF'+c.text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Договор-'+c.date+'.txt';a.click();URL.revokeObjectURL(url)}}><Icon name="download"/></button></div>)}</>}</>}
 function Account(){const [form,setForm]=useState(profile);const [unlocked,setUnlocked]=useState(false);const [phrase,setPhrase]=useState('');const [error,setError]=useState('');const [authMode,setAuthMode]=useState('login');const [authenticated,setAuthenticated]=useState(false);const [awaitingConfirm,setAwaitingConfirm]=useState(false);if(authMode==='register'&&!unlocked)return <><h2>Достъп до регистрацията</h2><form onSubmit={e=>{e.preventDefault();if(phrase==='Nadka22godini'){setUnlocked(true);setError('')}else setError('Невярно кодово изречение. Опитайте отново.')}}><label className="form-field">Кодово Изречение<input autoFocus required type="password" autoComplete="off" value={phrase} onChange={e=>{setPhrase(e.target.value);setError('')}} placeholder="Въведете кодовото изречение"/></label>{error&&<p role="alert" style={{color:'#a12136'}}>{error}</p>}<button className="wine-button form-submit" type="submit">Продължи <Icon name="right"/></button><button className="outline-button form-submit" type="button" onClick={()=>{setAuthMode('login');setPhrase('');setError('')}}>Назад към вход</button></form></>;if(awaitingConfirm)return <div className="success-state text-center py-8"><Icon name="email" className="mx-auto mb-4 w-12 h-12 text-gold"/><h2 className="text-2xl mb-2">Потвърдете вашия имейл</h2><p className="mb-6">Изпратихме линк за потвърждение на <strong>{form.email}</strong>. Моля, проверете пощата си и кликнете върху него, за да активирате профила си.</p><button className="wine-button px-8 py-3" onClick={()=>{setAwaitingConfirm(false);setAuthMode('login');setError('')}}>Към вход</button></div>;if(!authenticated)return <><h2>{authMode==='login'?'Вход в профила':'Регистрация'}</h2><div className="modal-tabs"><button className={authMode==='login'?'active':''} onClick={()=>setAuthMode('login')}>Вход</button><button className={authMode==='register'?'active':''} onClick={()=>{setAuthMode('register');setUnlocked(false);setPhrase('');setError('')}}>Регистрация</button></div><form onSubmit={e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const email=fd.get('email');const pass=fd.get('password');if(authMode==='login'){if(email==='kuneto77@abv.bg'&&pass==='Mirko0099!'){setProfile({role:'Админ',name:'Мирослав Кънев',email:'kuneto77@abv.bg'});setAuthenticated(true);setToast('Добре дошли, г-н Кънев!');navigate('/crm');return}setProfile({...profile,name:email.split('@')[0],email});setAuthenticated(true);setToast('Успешен вход');navigate('/crm')}else{if(fd.get('password')!==fd.get('confirm')){setError('Паролите не съвпадат.');return}setForm({...form,email});setAwaitingConfirm(true);setToast('Код за потвърждение е изпратен')}}}>{authMode==='register'&&<label className="form-field">Име и фамилия<input name="name" required autoComplete="name" placeholder="Вашето име"/></label>}<label className="form-field">Имейл<input name="email" required type="email" autoComplete="email" placeholder="email@example.com"/></label><label className="form-field">Парола<input name="password" required type="password" minLength="6" autoComplete={authMode==='login'?'current-password':'new-password'} placeholder="Минимум 6 символа"/></label>{authMode==='register'&&<label className="form-field">Потвърдете паролата<input name="confirm" required type="password" minLength="6" autoComplete="new-password"/></label>}{error&&<p role="alert" style={{color:'#a12136'}}>{error}</p>}<button type="submit" className="wine-button form-submit">{authMode==='login'?'Влез':'Създай профил'}</button></form></>;return <><h2>Моят профил</h2><p className="profile-intro">Вашите имоти, любими предложения и договори.</p><div className="modal-tabs">{[['profile','user','Профил'],['favorites','heart','Любими'],['contracts','file','Договори']].map(([id,icon,label])=><button className={accountTab===id?'active':''} key={id} onClick={()=>setAccountTab(id)}><Icon name={icon}/>{label}{id==='favorites'&&favorites.length>0?' ('+favorites.length+')':''}</button>)}</div>{accountTab==='profile'?<><h3>Изберете тип профил</h3><div className="role-options">{[['Купувач','home'],['Собственик','key'],['Брокер','user']].map(([role,icon])=><button className={form.role===role?'active':''} key={role} onClick={()=>setForm(f=>({...f,role}))}><Icon name={icon}/>{role}</button>)}</div><form onSubmit={e=>{e.preventDefault();setProfile(form);setToast('Профилът е запазен');setAccountTab('contracts')}}><label className="form-field">Име и фамилия<input required value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Вашето име"/></label><label className="form-field">Имейл<input required type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="email@example.com"/></label><button className="gold-button form-submit"><Icon name="check"/>Запази и продължи към договорите</button></form><p className="fine-print">Демо профил: информацията се съхранява локално в браузъра. Не е необходима регистрация.</p></>:accountTab==='favorites'?favorites.length?<>{favorites.map(id=>{const p=properties.find(p=>p.id===id);return p&&<div className="account-favorite" key={id}><a href={'#/property/'+id} onClick={()=>setModal(null)}><img src={p.img} alt={p.name}/></a><div><h3><a href={'#/property/'+id} onClick={()=>setModal(null)}>{p.name}</a></h3><p>€ {money(p.price)}</p></div><button onClick={()=>toggleFavorite(id)} aria-label="Премахни от любими"><Icon name="close"/></button></div>})}</>:<div className="success-state"><Icon name="heart"/><h3>Все още нямате любими имоти</h3><p>Запазете предложенията, които Ви харесват, със символа сърце.</p><button className="wine-button" onClick={()=>navigate('/neighborhood/'+city.slug+'/'+neighborhoods[0].slug)}>Разгледай имотите</button></div>:<LiveComponent component={ContractEditor}/>}</>}
 return <>{isHome?Landing():route.startsWith('/city/')?Home():isDetail?Detail():route==='/crm'?CRM():route==='/crm/clients'?<LiveComponent component={Clients}/>:Listing()}{modal&&modal!=='gallery'&&<div className={'modal-backdrop '+(modalFullscreen||neighborhoodsFull?'modal-expanded':'')} onClick={e=>{if(e.target===e.currentTarget){setModal(null);setModalFullscreen(false);setNeighborhoodsFull(false)}}}><section role="dialog" aria-modal="true" aria-label="Диалогов прозорец" className={'modal account-modal '+(modal==='neighborhoods'?'wide neighborhoods-browser ':'')+(modal==='map'?'map-modal ':'')+(modal==='neighborhoods'&&neighborhoodsFull?' fullscreen ':'')+(modalFullscreen||neighborhoodsFull?'modal-fullscreen':'')}><PremiumModalHeader title={modal==='neighborhoods'?'Избери квартал в гр. '+city.name:modal==='map'?'Локация на имота':modal==='filters'?'Филтри за търсене':modal==='inquiry'?'Запитване за имота':modal==='viewing'?'Запази час за оглед':modal==='share'?'Сподели имота':modal==='account'?'Моят профил':'Имоти Надежда'} subtitle="Недвижими имоти · Бургас" isFullscreen={modalFullscreen||neighborhoodsFull} onToggleFullscreen={()=>{setModalFullscreen(v=>!v);if(modal==='neighborhoods')setNeighborhoodsFull(v=>!v)}} onClose={()=>{setModal(null);setModalFullscreen(false);setNeighborhoodsFull(false)}}/>{modal==='account'?<LiveComponent key="account" component={Account}/>:modal==='inquiry'?<LiveComponent key="inquiry" component={ContactForm}/>:modal==='viewing'?<LiveComponent key="viewing" component={ContactForm} viewing/>:modal==='filters'?<><h2>Филтри за търсене</h2><p>Намерете Вашия имот в Бургас.</p><div className="quick-filters wine-surface" style={{display:'flex',minHeight:430,padding:22}}>{FilterContents({inModal:true})}</div><button className="outline-button" style={{width:'100%',marginTop:15}} onClick={()=>{setFilters({type:'Всички',price:'Без значение',area:'Без значение',min:'',max:'',types:[]});setAppliedFilters(null)}}>Изчисти всички филтри</button></>:modal==='map'?<><h2>кв. {selectedNeighborhood}, {city.name}</h2>{city.slug==='burgas'?<img src={ASSETS.map} alt="Карта на квартал Лазур"/>:<iframe title={'Карта на '+city.name} src={'https://maps.google.com/maps?q='+encodeURIComponent(selectedNeighborhood+' '+city.name)+'&output=embed'} style={{width:'100%',height:400,border:0}}/>}<a className="wine-button" href={'https://www.google.com/maps/search/'+encodeURIComponent(selectedNeighborhood+' '+city.name+' България')} target="_blank" rel="noopener noreferrer"><Icon name="pin"/>Отвори в Google Maps</a></>:modal==='neighborhoods'?<><h2>Избери квартал в гр. {city.name}</h2><p>Открийте мястото за Вашия нов дом.</p><BurgasDistrictBrowser/></>:modal==='share'?<><h2>Сподели имота</h2><label className="form-field">Линк към обявата<input readOnly value={location.href} onFocus={e=>e.target.select()}/></label></>:<><h2>Недвижими имоти ИЛДЖ.ИА</h2><p>Вашият доверен партньор за недвижими имоти в Бургас.</p><p>Помагаме Ви да намерите дом, който отговаря на Вашия начин на живот. С лично отношение, познаване на местния пазар и внимание към всеки детайл Ви съпровождаме от първия оглед до финализирането на сделката.</p><div className="agent-profile" style={{marginTop:25}}><img src={ASSETS.agent} alt="Мария Иванова"/><div><h3>Мария Иванова</h3><p>Старши консултант</p></div></div><a className="wine-button" href="tel:+359881234567"><Icon name="phone"/>+359 88 123 4567</a></>}</section></div>}{modal==='gallery'&&<div className="lightbox" role="dialog" aria-modal="true" aria-label="Галерия на имота" onClick={e=>{if(e.target===e.currentTarget)setModal(null)}}><button className="modal-close" onClick={()=>setModal(null)} aria-label="Затвори галерията"><Icon name="close"/></button><img src={galleryImages[gallery]} alt={'Снимка '+(gallery+1)}/><button className="gallery-arrow left" onClick={()=>setGallery((gallery+5)%6)} aria-label="Предишна снимка"><Icon name="chevron" style={{transform:'rotate(180deg)'}}/></button><button className="gallery-arrow right" onClick={()=>setGallery((gallery+1)%6)} aria-label="Следваща снимка"><Icon name="chevron"/></button><span className="gallery-count">{gallery+1} / 18</span></div>}{toast&&<div className="toast" role="status"><Icon name="check"/>{toast}</div>}</>
