<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <!-- Defence in depth: the same policy (plus frame-ancestors) is sent as a response header by app://ted/ (electron/protocol.js META_CSP); vite.config.mjs fails the build if they differ. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Тед – Имоти Надежда</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
