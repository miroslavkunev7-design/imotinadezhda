# electron-builder 26 configuration for "Тед за Windows".
# Built only by the GitHub Actions workflow (.github/workflows/ted-desktop.yml) on windows-latest:
#   npm run dist:win  ->  dist-installer/Ted-Setup-<version>-x64.exe (+ win-unpacked/, SHA256SUMS.txt)
# Every option name was checked against node_modules/app-builder-lib/scheme.json (26.18.0).

appId: bg.imotinadezhda.ted # main.js sets the same AppUserModelId
# ASCII on purpose: it names the userData folder (%APPDATA%\Ted Imoti Nadezhda) and the program
# in Windows. The window title shown to the user is Bulgarian and is set at runtime.
productName: "Ted Imoti Nadezhda"
copyright: "Copyright (c) Imoti Nadezhda"

directories:
  output: dist-installer
  buildResources: build # never copied into app.asar

# What goes into app.asar: the built renderer, the main-process sources, package.json and the font files
# that MAIN embeds into PDF documents (electron/docs/fonts.js reads them by their source names; Vite hashes
# the copies in dist/). Production dependencies (package.json "dependencies": jose, electron-updater, docx,
# pdfkit, write-excel-file, read-excel-file, mammoth, unpdf) are collected from node_modules by
# electron-builder itself; devDependencies (electron, vite, react, ...) never are. Type declarations and
# browser-only bundles of those packages are left out (never loaded in MAIN).
files:
  - dist/**
  - electron/**
  - package.json
  - src/assets/fonts/*.woff2
  - src/assets/fonts/LICENSES.md
  - "!**/*.map"
  - "!**/*.test.*"
  - "!**/node_modules/@types/**"
  - "!**/node_modules/**/*.d.ts"
  - "!**/node_modules/**/*.d.cts"
  - "!**/node_modules/**/*.d.mts"
  - "!**/node_modules/docx/dist/*.iife.js"
  - "!**/node_modules/pdfkit/js/pdfkit.standalone.js"
asar: true

# Licence texts next to the program (the fonts' OFL asks for the notice to travel with every copy).
extraResources:
  - from: LICENSE
    to: licenses/Ted-LICENSE.txt
  - from: src/assets/fonts/LICENSES.md
    to: licenses/Fonts-LICENSES.md

win:
  target:
    - target: nsis
      arch:
        - x64
  # Stable, space-free .exe name: the CI smoke test starts win-unpacked/TedImotiNadezhda.exe.
  # It also names the default install folder: %LOCALAPPDATA%\Programs\TedImotiNadezhda.
  executableName: TedImotiNadezhda
  icon: build/icon.png # 512x512 PNG; converted to .ico for the program and the installer
  artifactName: "Ted-Setup-${version}-x64.${ext}"
  requestedExecutionLevel: asInvoker

nsis:
  # Assisted per-user installer: no administrator rights, default folder under
  # %LOCALAPPDATA%\Programs, and the user may pick another folder. No path is hard-coded.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # ASCII-safe names (Cyrillic shortcut names are not verified on real Windows yet).
  shortcutName: "Ted - Imoti Nadezhda"
  uninstallDisplayName: "Ted - Imoti Nadezhda ${version}"
  runAfterFinish: true
  # Uninstall keeps the user's settings and encrypted local chats.
  deleteAppDataOnUninstall: false
  # en_US only: bg_BG broke an earlier installer build of the agency.
  installerLanguages:
    - en_US
  # Updates download the whole installer (electron-updater: disableDifferentialDownload), so no .blockmap.
  differentialPackage: false
  # Extra installer steps: temporary files move next to the install folder when the %TEMP% drive is
  # full, a clear refusal when there is no room anywhere, and a completeness check after copying.
  include: build/installer.nsh

# Electron fuses, flipped in the packaged .exe by electron-builder (@electron/fuses) after packing.
# The app is served from app://ted/ out of app.asar and never needs file:// or Node-style switches.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  # If the packaged smoke test ever fails because of this fuse, set only this one to false.
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
  loadBrowserProcessSpecificV8Snapshot: false

# Automatic updates (electron/updater.js, electron-updater). electron-builder never uploads anything here
# (`--publish never`), but with a publish config it writes dist-installer/latest.yml (version, file name,
# sha512, size) and resources/app-update.yml. The workflow uploads latest.yml next to the installer to the
# GitHub release; the program reads <url>/latest.yml. No publisherName: the build is unsigned, so the
# updater checks the sha512 of latest.yml and skips the Authenticode check.
publish:
  - provider: generic
    url: "https://github.com/miroslavkunev7-design/imotinadezhda/releases/latest/download"
    useMultipleRangeRequest: false
