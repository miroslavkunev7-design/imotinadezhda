# Builds, smoke-tests and (for ted-desktop-v* tags) releases the unsigned Windows installer of
# "Тед за Windows" and (0.1.8) the ad-hoc signed disk image of "Тед за Mac" (apps/ted-desktop). The code lives in the production branch live-site; this
# workflow only reads the repository and never deploys or changes the website.
#
# - push to live-site touching apps/ted-desktop/** or this file -> tests + Windows installer (artifact),
#   and, if no release ted-desktop-v<package.json version> exists yet, that tag + a normal release
# - push of a tag ted-desktop-v<version>                       -> the same + a normal GitHub release
#   (normal, not a pre-release: the site links to releases/latest/download/Ted-Setup-x64.exe and
#   "latest" ignores pre-releases)
# - workflow_dispatch: harmless; GitHub only offers it once a workflow file is on the default branch.
#
# Actions are pinned to full commit SHAs of their current majors (checked 2026-11-17 with `git ls-remote`).
name: Тед за Windows и Mac

on:
  push:
    branches:
      - live-site
    paths:
      - "apps/ted-desktop/**"
      - ".github/workflows/ted-desktop.yml"
    # Path filters are not evaluated for tag pushes: every ted-desktop-v* tag builds and releases.
    tags:
      - "ted-desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ted-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тестове (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: apps/ted-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ted-desktop/package-lock.json

      - name: Release tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/ted-desktop-v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "ted-desktop-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected ted-desktop-v$version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Unit tests
        run: npm test

      - name: Build renderer (includes the secret/demo-data gate)
        run: npm run build:renderer

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (mock bridge, no network)
        run: npm run e2e -- --trace off

      # The real program under xvfb: app:// + CSP, the exact window.ted surface, no Node in the page,
      # window.open/navigation blocked, and Electron net sending no Origin/Referer to a local
      # 127.0.0.1 echo server. Never contacts the site, Supabase or OpenAI.
      - name: Electron smoke test (Linux, xvfb)
        run: |
          node node_modules/electron/install.js
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs.
          # Allow them on this throwaway runner instead of starting the app with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run smoke
          cat test-results/smoke.json

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            apps/ted-desktop/playwright-report/
            apps/ted-desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dependency audit (warning only)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported high-severity issues in production dependencies"

  build-windows:
    name: Инсталатор (Windows x64)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/ted-desktop
    env:
      # Unsigned build: do not look for a code-signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ted-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Build the installer (npm run dist:win)
        run: npm run dist:win

      # electron/smoke.js (--smoke-test): temporary userData, loads the renderer from app://ted/,
      # checks the CSP, the preload surface, the sandbox and that Electron net sends no Origin/Referer
      # to a local 127.0.0.1 echo server; writes a JSON report and exits 0 (pass) or 1 (fail).
      # Links are recorded instead of opened; no other network access.
      - name: Packaged smoke test (win-unpacked, fuses and asar integrity on)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist-installer\win-unpacked\TedImotiNadezhda.exe'
          $report = Join-Path $env:RUNNER_TEMP 'smoke.json'
          if (-not (Test-Path $exe)) { Write-Host "::error::Missing $exe"; exit 1 }
          Remove-Item $report -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"--smoke-report=$report`"") -PassThru
          $null = $p.Handle # keep the process handle so ExitCode stays readable after exit
          if (-not $p.WaitForExit(120000)) {
            Get-Process -Name 'TedImotiNadezhda' -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Host "::error::The smoke test did not finish within 120 s"
            exit 1
          }
          $code = $p.ExitCode
          if (-not (Test-Path $report)) { Write-Host "::error::No smoke report at $report (exit code $code)"; exit 1 }
          $json = Get-Content -Raw -Encoding utf8 $report
          Write-Host $json
          try { $null = $json | ConvertFrom-Json } catch { Write-Host "::error::The smoke report is not valid JSON"; exit 1 }
          if ($code -ne 0) { Write-Host "::error::Smoke test failed (exit code $code)"; exit 1 }
          Write-Host "Smoke test passed."

      # scripts/ci-installer-test.ps1: real silent installs of the installer that was just built.
      # A) normal install; B) %TEMP% on a too-small disk (the "disk C: is full" case) must still
      # install completely; C) no room anywhere must be refused with exit code 3. Each installed
      # program is compared with win-unpacked and runs the smoke test.
      - name: Installer tests (real installs, full temp drive)
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/ci-installer-test.ps1 `
            -Setup (Join-Path $PWD "dist-installer\Ted-Setup-$version-x64.exe") `
            -Unpacked (Join-Path $PWD 'dist-installer\win-unpacked') `
            -OldSetupUrl 'https://github.com/miroslavkunev7-design/imotinadezhda/releases/download/ted-desktop-v0.1.1/Ted-Setup-0.1.1-x64.exe'

      - name: Unversioned copy and SHA256SUMS.txt
        run: |
          version="$(node -p "require('./package.json').version")"
          cp "dist-installer/Ted-Setup-${version}-x64.exe" dist-installer/Ted-Setup-x64.exe
          node scripts/sha256.mjs
          grep -q "  Ted-Setup-${version}-x64.exe\$" dist-installer/SHA256SUMS.txt
          grep -q "  Ted-Setup-x64.exe\$" dist-installer/SHA256SUMS.txt
          (cd dist-installer && sha256sum --check SHA256SUMS.txt)
          {
            echo "## Тед за Windows ${version}"
            echo
            echo "Неподписан инсталатор за Windows 10/11 (x64), commit \`${GITHUB_SHA}\`."
            echo "Изтегляне: секция **Artifacts** на тази страница (нужен е вход в GitHub; пази се 30 дни)."
            echo "SmartScreen: „Повече информация“ → „Изпълни въпреки това“."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat dist-installer/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Automatic updates (electron/updater.js): electron-builder writes latest.yml even with --publish never
      # (electron-builder.yml has a generic publish config). The program trusts the installer only when its
      # sha512 matches latest.yml, so the file must describe exactly the installer that was just built.
      - name: Check latest.yml (automatic updates)
        run: |
          version="$(node -p "require('./package.json').version")"
          f=dist-installer/latest.yml
          [ -f "$f" ] || { echo "::error::Missing $f (needed for automatic updates)"; exit 1; }
          cat "$f"
          grep -qx "version: ${version}" "$f" || { echo "::error::latest.yml does not name version ${version}"; exit 1; }
          grep -qx "path: Ted-Setup-${version}-x64.exe" "$f" || { echo "::error::latest.yml does not point to Ted-Setup-${version}-x64.exe"; exit 1; }
          want="$(openssl dgst -sha512 -binary "dist-installer/Ted-Setup-${version}-x64.exe" | base64 -w0)"
          grep -qx "sha512: ${want}" "$f" || { echo "::error::sha512 in latest.yml does not match the installer"; exit 1; }
          echo "latest.yml matches Ted-Setup-${version}-x64.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ted-za-Windows-${{ github.run_number }}
          path: |
            apps/ted-desktop/dist-installer/Ted-Setup-*-x64.exe
            apps/ted-desktop/dist-installer/Ted-Setup-x64.exe
            apps/ted-desktop/dist-installer/SHA256SUMS.txt
            apps/ted-desktop/dist-installer/latest.yml
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build-mac:
    name: Инсталатор (macOS – Intel и Apple Silicon)
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/ted-desktop
    env:
      # No Apple Developer certificate: electron-builder signs ad hoc (mac.identity "-"), never looks for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ted-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Build the disk image (npm run dist:mac – universal, macOS 13+)
        run: npm run dist:mac

      # The packaged program must hold both architectures, carry a valid (ad hoc) signature, ask for Ventura or newer,
      # name the microphone, and pass the same smoke test as on Windows – natively (Apple Silicon) and under Rosetta (Intel).
      - name: Packaged checks and smoke test (Apple Silicon and Intel)
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app="$(ls -d dist-installer/mac-universal/*.app | head -n 1)"
          [ -d "$app" ] || { echo "::error::No .app in dist-installer/mac-universal"; exit 1; }
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs="$(lipo -archs "$exe")"; echo "archs: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "::error::Not universal: $archs"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          min="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          [ "$min" = "13.0" ] || { echo "::error::LSMinimumSystemVersion is $min"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          [ -f "dist-installer/Ted-Mac-${version}-universal.dmg" ] || { echo "::error::Missing Ted-Mac-${version}-universal.dmg"; exit 1; }
          hdiutil verify "dist-installer/Ted-Mac-${version}-universal.dmg"
          smoke() { # $1 = label, rest = command prefix
            local label="$1"; shift
            local report="$RUNNER_TEMP/smoke-$label.json"; rm -f "$report"
            "$@" "$exe" --smoke-test "--smoke-report=$report" & local pid=$!
            ( sleep 150; kill -9 "$pid" 2>/dev/null || true ) & local watch=$!
            local code=0; wait "$pid" || code=$?
            kill "$watch" 2>/dev/null || true
            [ -f "$report" ] || { echo "::error::No smoke report ($label, exit $code)"; exit 1; }
            cat "$report"; echo
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$report"
            [ "$code" -eq 0 ] || { echo "::error::Smoke test failed ($label, exit $code)"; exit 1; }
            echo "Smoke test passed ($label)."
          }
          smoke arm64 env
          if arch -x86_64 /usr/bin/true 2>/dev/null; then smoke x86_64 arch -x86_64; else echo "::warning::Rosetta is not available on this runner – the Intel half was checked with lipo only"; fi

      - name: Unversioned copy and SHA256SUMS-mac.txt
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cd dist-installer
          cp "Ted-Mac-${version}-universal.dmg" Ted-Mac.dmg
          shasum -a 256 "Ted-Mac-${version}-universal.dmg" Ted-Mac.dmg > SHA256SUMS-mac.txt
          shasum -a 256 -c SHA256SUMS-mac.txt
          {
            echo "## Тед за Mac ${version}"
            echo
            echo "Диск образ за MacBook – Intel и Apple Silicon, macOS 13 Ventura и по-нови, commit \`${GITHUB_SHA}\`."
            echo
            echo '```'
            cat SHA256SUMS-mac.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ted-za-Mac-${{ github.run_number }}
          path: |
            apps/ted-desktop/dist-installer/Ted-Mac-*-universal.dmg
            apps/ted-desktop/dist-installer/Ted-Mac.dmg
            apps/ted-desktop/dist-installer/SHA256SUMS-mac.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  release:
    name: GitHub release
    # Tag push -> release that tag. Push to live-site -> release ted-desktop-v<package.json version>
    # only if that release does not exist yet (the tag is then created on this commit by the job).
    if: startsWith(github.ref, 'refs/tags/ted-desktop-v') || (github.event_name == 'push' && github.ref == 'refs/heads/live-site')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ted-za-Windows-${{ github.run_number }}
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ted-za-Mac-${{ github.run_number }}
          path: release

      - name: Verify checksums and publish the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/ted-desktop-v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#ted-desktop-v}"
          else
            shopt -s nullglob
            versioned=(Ted-Setup-*-x64.exe)
            [ "${#versioned[@]}" -eq 1 ] || { echo "::error::Expected exactly one Ted-Setup-<version>-x64.exe"; exit 1; }
            version="${versioned[0]#Ted-Setup-}"
            version="${version%-x64.exe}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad version '$version'"; exit 1; }
            tag="ted-desktop-v${version}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release $tag already exists – nothing to publish (bump the version in package.json for a new release)."
              exit 0
            fi
          fi
          # Mac (0.1.8): its checksums join the Windows ones in one SHA256SUMS.txt, checked again here.
          sha256sum --check SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt >> SHA256SUMS.txt
          rm SHA256SUMS-mac.txt
          # latest.yml: the feed of the automatic updates (releases/latest/download/latest.yml) – Windows only.
          assets=("Ted-Setup-${version}-x64.exe" "Ted-Setup-x64.exe" "Ted-Mac-${version}-universal.dmg" "Ted-Mac.dmg" "SHA256SUMS.txt" "latest.yml")
          for f in "${assets[@]}"; do
            [ -f "$f" ] || { echo "::error::Missing release asset $f"; exit 1; }
          done
          grep -q "  Ted-Setup-${version}-x64.exe\$" SHA256SUMS.txt
          grep -q "  Ted-Setup-x64.exe\$" SHA256SUMS.txt
          grep -q "  Ted-Mac-${version}-universal.dmg\$" SHA256SUMS.txt
          grep -q "  Ted-Mac.dmg\$" SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          grep -qx "version: ${version}" latest.yml || { echo "::error::latest.yml is not for ${version}"; exit 1; }
          readme="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${tag}/apps/ted-desktop/README.md"
          {
            echo "Тед за Windows ${version} – неподписан инсталатор за Windows 10/11 (64-битов)."
            echo
            echo "**Изтегляне:** \`Ted-Setup-x64.exe\` (същият файл като \`Ted-Setup-${version}-x64.exe\`)."
            echo "Входът е със същия телефон/имейл и парола като в CRM на сайта. На сайта не се променя нищо."
            echo
            echo "**Първо стартиране:** Windows SmartScreen може да покаже „Windows защити компютъра ви“."
            echo "Натиснете „Повече информация“ → „Изпълни въпреки това“. Инсталира се само за текущия потребител, без администраторски права."
            echo
            echo "**Проверка на файла** (PowerShell): \`Get-FileHash .\\Ted-Setup-x64.exe -Algorithm SHA256\` – стойността трябва да съвпада с реда в SHA256SUMS.txt (малки/главни букви нямат значение)."
            echo
            echo "**Обновяване:** от версия 0.1.3 програмата сама проверява за нова версия, тегли я и я инсталира при затваряне (Настройки → Общи → Обновления). Версия 0.1.2 няма обновяване – 0.1.3 се инсталира веднъж ръчно върху нея; настройките и чатовете остават."
            echo
            echo "**Тед за Mac** (от 0.1.8): \`Ted-Mac.dmg\` – един файл за всеки MacBook (Intel и Apple Silicon), macOS 13 Ventura и по-нови. Бял с червени елементи."
            echo "Отворете файла и плъзнете „Ted Imoti Nadezhda“ в Applications. Първо стартиране: десен клик върху програмата → „Open“ → „Open“"
            echo "(на macOS 15 и по-нови: System Settings → Privacy & Security → „Open Anyway“). Програмата не е подписана с сертификат на Apple."
            echo "На Mac няма автоматично обновяване – новата версия се тегли оттук и се слага върху старата; чатовете и настройките остават."
            echo
            echo "Пълно ръководство: ${readme}"
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          title="Тед ${version} – Windows и Mac"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            # Branch push with a new version: the job creates the tag on exactly this commit.
            gh release create "$tag" --target "$GITHUB_SHA" --latest --title "$title" --notes-file notes.md "${assets[@]}"
          elif gh release view "$tag" > /dev/null 2>&1; then
            # Re-run of the same tag: replace the files and make sure the release is public and latest.
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes-file notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$tag" --verify-tag --latest --title "$title" --notes-file notes.md "${assets[@]}"
          fi
